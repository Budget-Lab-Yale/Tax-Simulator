---
# Missouri: SALT Parity Act, RSMo 143.436 (HB 2400, 2022; amended 2024,
# current text effective 8/28/2024). Applies to tax years ending on or after
# 12/31/2022. No sunset and no reference to IRC 164(b)(6).
# Partnerships and S corporations elect annually. The base is the entity's
# Missouri-source net income, reduced by the 143.022 business-income
# deduction allowable to owners and adjusted by 143.121/143.141
# modifications; entity losses carry forward for electing years.
# Owner credit is NONREFUNDABLE with unlimited carryforward until used.
# DRAFT: research/state_tax/ptet/params_draft -- not read by the model

available:
  value:
    '2017': 0
    '2022': 1
  reference: 'RSMo 143.436 ("shall only apply to tax years ending on or after December 31, 2022"), https://revisor.mo.gov/main/OneSection.aspx?section=143.436'
mandatory:
  value: 0
  reference: 'RSMo 143.436: elective'
method:
  value: 1
  reference: 'RSMo 143.436: member credit against 143.011/143.041 tax equal to the direct and indirect pro rata share of entity tax'
rate:
  value:
    '2017': 0.053
    '2023': 0.0495
    '2024': 0.048
    '2025': 0.047
  reference: 'RSMo 143.436: "highest rate of tax used to determine a Missouri income tax liability for an individual pursuant to section 143.011": 5.3% TY2022, 4.95% TY2023, 4.8% TY2024, 4.7% TY2025+ per max(st_ord.rates) in baseline/mo/ord.yaml. 2017-2021 value inert (available = 0)'
rate_tracks_top:
  value: 1
  reference: 'RSMo 143.436'
rate_scorp:
  value: NA   # same as rate
  reference: 'RSMo 143.436: one rate'
credit_share:
  value: 1
  reference: 'RSMo 143.436: credit equal to the member''s pro rata share of the tax'
credit_refundable:
  value: 0
  reference: 'RSMo 143.436: excess credit "shall not be refunded but may be carried forward" until used (carryforward not modeled)'
addback:
  value: 0
  reference: 'No member-level addition found: RSMo 143.436 provides none, and RSMo 143.121.2 lists no addition for state income taxes deducted in computing federal AGI (checked 2026-10-28), https://revisor.mo.gov/main/OneSection.aspx?section=143.121'
resident_scope:
  value: 2
  reference: 'RSMo 143.436: entity base is Missouri net income "to the extent derived from or connected with sources within this state"'
nonresident_scope:
  value: 2
  reference: 'RSMo 143.436'
resident_credit_for_other_state_ptet:
  value: 1
  reference: 'RSMo 143.436: resident and part-year resident members may claim credit for their pro rata share of tax paid to another state or DC by the entity if "substantially similar"; excess not refunded or carried forward'
surtax_rate:
  value: 0
  reference: 'No surtax-layer entity tax in Missouri law'
surtax_credit_share:
  value: 0
  reference: 'No surtax-layer entity tax in Missouri law'
local_rate:
  value: 0
  reference: 'Kansas City / St. Louis earnings taxes are not part of 143.436'
local_credit_share:
  value: 0
  reference: 'Not applicable'

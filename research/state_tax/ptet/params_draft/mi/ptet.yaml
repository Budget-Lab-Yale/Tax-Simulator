---
# Michigan: flow-through entity (FTE) tax, Income Tax Act Part 4,
# MCL 206.801 et seq. (2021 PA 135, HB 5376), for tax years beginning on or
# after 1/1/2021. Levied "at the same rate levied and imposed under section
# 51 for that same tax year" (MCL 206.815) on the positive business income
# tax base after allocation or apportionment to Michigan; available only for
# years in which the federal SALT limit (IRC 164(b)(6)) applies. The election
# binds the entity for that year and the next two (three-year commitment).
# Election deadline moved to the 9th month after year-end from TY2024
# (procedural). Tiered structures: positive shares from another electing FTE
# are removed (MCL 206.817). Income allocable to corporate, insurance and
# financial-institution members is excluded (MCL 206.815(5)).
# DRAFT: research/state_tax/ptet/params_draft -- not read by the model

available:
  value:
    '2017': 0
    '2021': 1
  reference: 'MCL 206.801 et seq. (2021 PA 135), tax years beginning on or after 1/1/2021 while IRC 164(b)(6) applies (permanent under P.L. 119-21). Treasury FTE notice https://www.michigan.gov/documents/treasury/19773_FTE_tax_notice_745849_7.pdf (not retrievable 2026-10-28; michigan.gov returned 403)'
mandatory:
  value: 0
  reference: 'MCL 206.801 et seq.: elective, 3-year binding election'
method:
  value: 1
  reference: 'MCL 206.801 et seq.; Treasury FTE notice: members claim "a refundable tax credit equal to the tax previously paid"'
rate:
  value:
    '2017': 0.0425
    '2023': 0.0405
    '2024': 0.0425
  reference: 'MCL 206.815: rate under MCL 206.51 for the same tax year. 4.05% for TY2023 (206.51 revenue trigger), 4.25% otherwise; Treasury notice "4.25% tax rate for flow-through entity tax years beginning in 2024", https://www.michigan.gov/treasury/reference/taxpayer-notices/2024/03/20/425-tax-rate-for-flow-through-entity-tax-years-beginning-in-2024. Equals max(st_ord.rates) in baseline/mi/ord.yaml'
rate_tracks_top:
  value: 1
  reference: 'MCL 206.815 (rate = MCL 206.51 rate; Michigan''s individual tax is flat)'
rate_scorp:
  value: NA   # same as rate
  reference: 'MCL 206.815: one rate'
credit_share:
  value: 1
  reference: 'Treasury FTE notice; MI-1040 line "Credit for allocated share of tax paid by an electing flow-through entity" (2022 form line 29), https://law.msu.edu/clinics/tax_class/MI-1040_2022.pdf'
credit_refundable:
  value: 1
  reference: 'Treasury FTE notice (members may claim "a refundable tax credit" of their allocable share; text seen in search excerpt, page 403); claimed on MI-1040 line 29 (2022 form)'
addback:
  value: 1
  reference: 'Michigan Schedule FTE (Form 6072) instructions: a direct member of an entity that deducted the Michigan FTE tax federally carries it as an ADDITION to Schedule 1 (with a matching subtraction for FTE tax refunds), https://www.michigan.gov/taxes/-/media/Project/Websites/taxes/Forms/IIT/TY2025/6072.pdf (text seen in search excerpt only; page returned 403)'
resident_scope:
  value: 2
  reference: 'MCL 206.815(1): tax imposed on the positive business income tax base "after allocation or apportionment to this state"; no all-source rule for residents'
nonresident_scope:
  value: 2
  reference: 'MCL 206.815(1)'
resident_credit_for_other_state_ptet:
  value: NA   # searched Treasury FTE FAQs (403) and MCL 206.255; not settled
  reference: 'Not found: Michigan resident credit for income tax imposed by another state (MCL 206.255 / Schedule CR-?) not confirmed to cover other states'' entity-level taxes'
surtax_rate:
  value: 0
  reference: 'No surtax-layer entity tax in Michigan law'
surtax_credit_share:
  value: 0
  reference: 'No surtax-layer entity tax in Michigan law'
local_rate:
  value: 0
  reference: 'Michigan city income taxes are not part of the FTE tax'
local_credit_share:
  value: 0
  reference: 'Not applicable'

# Nebraska: elective pass-through entity tax (PTET).
# Enacted by LB 754 (2023, signed 5/31/2023), retroactive to taxable years
# beginning on or after 1/1/2018. Partnerships (not PTPs) and S corporations
# elect annually; the election is irrevocable for the year. TY2018-2022
# elections were made on Form PTET-E by 12/30-31/2025 (and required a 2018 NE
# return on file); TY2023+ by the return due date (Form PTET-E or box 5 on the
# return). Statute cites per NDOR: Neb. Rev. Stat. 77-2727, 77-2730,
# 77-2734.01, 77-2775. NOT LB 1261 (2022): no evidence that bill carried the
# PTET. No sunset and no tie to IRC 164(b)(6).
# Not held by the parameters: nonresidents whose only NE income is from an
# electing entity need not file; the 2018-2022 owner credit is allowed only
# once the entity has paid.
# DRAFT: research/state_tax/ptet/params_draft -- not read by the model

available:
  value: 1
  reference: 'LB 754 (2023) sec. creating the election for taxable years beginning on or after 1/1/2018; NDOR PTET page https://revenue.nebraska.gov/businesses/nebraska-pass-through-entity-tax-ptet ("tax years beginning on or after January 1, 2018"); Form PTET-E (2018-2022) https://revenue.nebraska.gov/sites/default/files/doc/tax-forms/2023/f_PTET-E_after_2022_2023.pdf. Transcription check: EY Tax Alert 2023-0991'
mandatory:
  value: 0
  reference: 'LB 754 (2023): annual election by the entity; NDOR PTET page'
method:
  value: 1
  reference: 'LB 754 (2023): partners/shareholders claim a refundable credit for their share of the entity tax. Transcription check: EY Tax Alert 2023-0991 https://taxnews.ey.com/news/2023-0991-nebraska-adopts-elective-pass-through-entity-tax-and-phases-in-income-tax-rate-reductions'
rate:
  value:
    '2017': 0.0684
    '2023': 0.0664
    '2024': 0.0584
    '2025': 0.0520
    '2026': 0.0455
    '2027': 0.0399
  reference: 'LB 754 (2023): highest individual rate under Neb. Rev. Stat. 77-2715.03 for the tax period. 77-2715.03(2)(c) as read 2026-10-28 https://nebraskalegislature.gov/laws/statutes.php?statute=77-2715.03: 6.84% for years beginning before 1/1/2023, 6.64% (2023), 5.84% (2024), 5.20% (2025), 4.55% (2026), 3.99% (2027 and after). FLAG: our baseline/ne/ord.yaml stops at 4.55% from 2026 and has no 3.99% for 2027+; ptet_state_law.csv had the 2022-2024 values one year early'
rate_tracks_top:
  value: 1
  reference: 'LB 754 (2023): rate = highest rate applicable to individuals under 77-2715.03. Transcription check: EY Tax Alert 2023-0991'
rate_scorp:
  value: NA   # same as rate; no separate S-corporation rate found
  reference: 'LB 754 (2023): one rate for partnerships and S corporations'
credit_share:
  value: 1
  reference: 'LB 754 (2023): credit equals the owner''s share of the entity tax. Transcription check: EY Tax Alert 2023-0991'
credit_refundable:

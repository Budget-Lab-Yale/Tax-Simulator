---
# Indiana: elective pass-through entity tax, IC 6-3-2.1 (SEA 2, P.L. 1-2023,
# retroactive to taxable years beginning on or after 1/1/2022); PTE definition
# IC 6-3-1-35; credit for other states' substantially similar taxes
# IC 6-3-3-3(d) (retroactive to 1/1/2019). No sunset.
# Partnerships and S corporations elect annually (TY2022 election window
# 3/31/2023-8/31/2024; later years by the earlier of the extended due date or
# the filing date); irrevocable.
# Base nuance the scalars cannot hold: nonresident owners' shares are after
# allocation and apportionment; RESIDENT owners' shares may be computed
# either before or after apportionment, at the entity's choice, applied
# uniformly to all resident owners -- hence resident_scope NA.
# County income taxes are not part of the PTE tax.
# DRAFT: research/state_tax/ptet/params_draft -- not read by the model

available:
  value:
    '2017': 0
    '2022': 1
  reference: 'IC 6-3-2.1 (SEA 2, P.L. 1-2023), taxable years beginning on or after 1/1/2022, no expiration. Transcription check: EY Tax Alert 2023-0409 https://taxnews.ey.com/news/2023-0409-indiana-enacts-elective-passthrough-entity-tax'
mandatory:
  value: 0
  reference: 'IC 6-3-2.1: annual election'
method:
  value: 1
  reference: 'IC 6-3-2.1: owners remain liable for AGI tax on their share and receive a credit equal to the entity tax. Transcription check: EY Tax Alert 2023-0409'
rate:
  value:
    '2017': 0.0323
    '2023': 0.0315
    '2024': 0.0305
    '2025': 0.0300
    '2026': 0.0295
    '2027': 0.0290
  reference: 'IC 6-3-2.1 imposes the tax at the individual adjusted gross income tax rate under IC 6-3-2-1(b): 3.23% through 2022, 3.15% 2023, 3.05% 2024, 3.0% 2025, 2.95% 2026, 2.9% 2027+ (HB 1001-2023 schedule; IN DOR Departmental Notice #1 rate notices as reported by Bloomberg Tax 12/2025 and 3/2026). Equals max(st_ord.rates) in baseline/in/ord.yaml. Revenue-triggered cuts from 2030 (SEA 451-2025) not encoded. 2017-2021 value inert (available = 0)'
rate_tracks_top:
  value: 1
  reference: 'IC 6-3-2.1 rate cross-reference to IC 6-3-2-1(b). Transcription check: EY Tax Alert 2023-0409'
rate_scorp:
  value: NA   # same as rate
  reference: 'IC 6-3-2.1: one rate'
credit_share:
  value: 1
  reference: 'IC 6-3-2.1: credit equal to the owner''s share of the entity tax. Transcription check: EY Tax Alert 2023-0409'
credit_refundable:
  value: 1
  reference: 'IC 6-3-2.1: "refundable credit equal to such tax". Transcription check: EY Tax Alert 2023-0409'
addback:
  value: 1
  reference: 'IC 6-3-1-3.5(a)(3): individuals add back taxes based on or measured by income levied by any state, to the extent deducted in computing federal AGI -- reaches the owner''s share of the entity tax. Statutory reading; not confirmed against IT-20S/IT-65 PTE instructions (DOR Information Bulletin #72B could not be retrieved, 404)'
resident_scope:
  value: NA   # entity's choice: before or after apportionment, uniform across resident owners
  reference: 'IC 6-3-2.1 (resident owners'' shares may be determined before or after allocation and apportionment, same method for all resident owners). Transcription check: EY Tax Alert 2023-0409'
nonresident_scope:
  value: 2
  reference: 'IC 6-3-2.1 with IC 6-3-2-2: after allocation and apportionment'
resident_credit_for_other_state_ptet:
  value: 1
  reference: 'IC 6-3-3-3(d) as amended by SEA 2 (2023), retroactive to 1/1/2019: owners may credit another state''s PTE tax that is substantially similar to Indiana''s. Transcription check: EY Tax Alert 2023-0409'
surtax_rate:
  value: 0
  reference: 'No surtax-layer entity tax in Indiana law'
surtax_credit_share:
  value: 0
  reference: 'No surtax-layer entity tax in Indiana law'
local_rate:
  value: 0
  reference: 'County income taxes are not part of the IC 6-3-2.1 tax'
local_credit_share:
  value: 0
  reference: 'Not applicable'

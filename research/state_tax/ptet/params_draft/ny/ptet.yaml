---
# New York: Pass-Through Entity Tax (PTET), Tax Law Article 24-A (secs. 860-866),
# enacted by L.2021 ch.59 Part C; owner credit Tax Law 606(kkk); NYC PTET,
# Tax Law Article 24-B (secs. 867-867-A), enacted by L.2022 ch.59 Part MM.
#
# Election: annual, online, by an authorized person, between January 1 and
# March 15 of the tax year (irrevocable after March 15). Eligible entities:
# partnerships (not publicly traded) and NY S corporations. Credit claimants:
# direct owners taxable under Article 22 (individuals, trusts, estates).
#
# Base. Partnerships: resident pool = ALL income allocated to resident
# partners; nonresident pool = NY-source income of nonresident partners.
# S corporations: a "resident S corporation" (all shareholders NY residents)
# uses unapportioned K-1 totals; a "standard" S corporation apportions under
# Article 9-A, so resident shareholders of a standard S corp are taxed only on
# the apportioned share. resident_scope = 1 below follows the partnership and
# resident-S-corp rule; the standard-S-corp case cannot be held in a scalar.
#
# Rate schedule is on ENTITY PTE taxable income (Tax Law 862; subsection not verified), not the
# owner's share: 6.85% to $2M, 9.65% to $5M, 10.30% to $25M, 10.90% above.
# It is NOT tied to the individual rate schedule (it equals NY's top rate
# 2021-2032 by coincidence of the 2021 budget; the individual top rates revert
# in 2033, the PTET schedule does not).
#
# NYC PTET: 3.876% flat on the city-resident partners'/shareholders' share
# (resident S corps only if ALL shareholders are city taxpayers); requires the
# state election; same March 15 deadline; credit = 100% of direct share,
# refundable, against NYC PIT; owners add back the NYC credit as well.
#
# FY2027 budget (enacted May 2026): the one-house bills S 9009 / A 10009
# proposed cutting the state credit to 90% and the NYC credit to 75%. NOT
# enacted -- see credit_share and local_credit_share references.
#
# DRAFT: research/state_tax/ptet/params_draft -- not read by the model

available:
  value:
    '2017': 0
    '2021': 1
  reference: 'NY Tax Law 861 (election for taxable years beginning on or after 1/1/2021), L.2021 ch.59 Part C; DTF PTET page https://www.tax.ny.gov/bus/ptet/ ("enacted in 2021 under Tax Law Article 24-A"); no sunset in Art. 24-A'

mandatory:
  value: 0
  reference: 'NY Tax Law 861: annual election; https://www.tax.ny.gov/bus/ptet/'

method:
  value: 1   # credit
  reference: 'NY Tax Law 606(kkk); TSB-M-21(1)C, (1)I (8/25/2021) p.9-10, https://www.tax.ny.gov/pdf/memos/ptet/m21-1c-1i.pdf'

rate:
  value:
    '2017': 0
    '2021': 0.109
  reference: 'NY Tax Law 862 top bracket, 10.90% of PTE taxable income over $25,000,000; DTF calculations page https://www.tax.ny.gov/e-services/ptet/calculations.htm. Top rate only; full entity-level schedule in rates/brackets'

rate_tracks_top:
  value: 0
  reference: 'NY Tax Law 862 states the schedule in its own terms; it is not defined by reference to 601. Equal to max(st_ord.rates) 2021-2032 only because both top rates are 10.9%'

rate_scorp:
  value: NA   # same schedule for partnerships and S corporations
  reference: 'NY Tax Law 862 applies one schedule to all electing entities'

# Entity-level graduated schedule (brackets are lower bounds of PTE taxable
# income of the ENTITY). Zero vectors before 2021 are inert (available = 0)
rates:
  value:
    '2017': [0, 0, 0, 0]
    '2021': [0.0685, 0.0965, 0.103, 0.109]
  reference: 'NY Tax Law 862; DTF calculations page https://www.tax.ny.gov/e-services/ptet/calculations.htm ("$2 million or less 6.85%; over $2M to $5M $137,000 + 9.65%; over $5M to $25M $426,500 + 10.30%; over $25M $2,486,500 + 10.90%")'
brackets:
  value:
    '2017': [0, 0, 0, 0]
    '2021': [0, 2000000, 5000000, 25000000]
  reference: 'NY Tax Law 862; DTF calculations page (above). Not indexed'

credit_share:
  value:
    '2017': 0
    '2021': 1.0
  reference: 'NY Tax Law 606(kkk) (cited in TSB-M-21(1)C fn.7): credit equals the taxpayer''s direct share of PTET; DTF PTET page https://www.tax.ny.gov/bus/ptet/ ("PTET credit is equal to its direct share of the PTET"). FY2027 budget: the 90% cut proposed in the one-house bills (S 9009 / A 10009) was NOT enacted -- BDO, "New York Passes Fiscal 2027 Budget" (post-enactment alert, Tax Proposals Considered but Not Enacted: "did not adopt proposals that would have reduced the value of the state pass-through entity tax (PTET) credit to 90%"), https://www.bdo.com/insights/tax/new-york-passes-fiscal-2027-budget-ushering-in-wide-ranging-tax-reform (secondary; the enacted Revenue Article VII bill text was not read)'

credit_refundable:
  value: 1
  reference: 'NY Tax Law 606(kkk); TSB-M-21(1)C, (1)I p.10: "If the amount of the PTET credit allowable ... exceeds the taxpayer''s tax due ... the excess will be treated as an overpayment, to be credited or refunded without interest"'

addback:
  value: 1
  reference: 'NY Tax Law 612(b) addition modification for the PTET credit claimed; TSB-M-21(1)C, (1)I p.10 "Addition modification to income": an eligible taxpayer claiming the PTET credit must add back an amount equal to the PTET credit claimed; Form IT-225-I. Note the add-back equals the CREDIT, which equals the PTET at 100%'

resident_scope:
  value: 1
  reference: 'NY Tax Law 860 (definitions; subsection not verified); DTF calculations page: partnership resident pool uses all income allocated to resident partners; resident S corporations use K-1 totals without Article 9-A apportionment. EXCEPTION: standard S corporations apportion, so their resident shareholders are taxed on NY-apportioned income only'

nonresident_scope:
  value: 2
  reference: 'DTF calculations page: nonresident pool uses NY-source amounts allocated to nonresident partners; standard S corporations apportion under Article 9-A'

resident_credit_for_other_state_ptet:
  value:
    '2017': 0
    '2021': 1
  reference: 'NY Tax Law 620(b); TSB-M-21(1)C, (1)I p.10 "Resident tax credit": for tax years beginning on or after 1/1/2021 residents get a resident credit for another jurisdiction''s PTE tax substantially similar to Art. 24-A; for earlier years "not allowed a resident tax credit for any tax imposed upon or payable by the S corporation or partnership". Residents add back the other-state PTET (same memo). List: https://www.tax.ny.gov/bus/ptet/substantially-similar.htm'

surtax_rate:
  value: 0
  reference: 'NY has no surtax-layer PTET'
surtax_credit_share:
  value: 0
  reference: 'NY has no surtax-layer PTET'

local_rate:
  value:
    '2017': 0
    '2022': 0.03876
  reference: 'NY Tax Law Art. 24-B (867; subsection not verified, L.2022 ch.59 Part MM): 3.876% of city PTE taxable income, taxable years beginning on or after 1/1/2022; DTF NYC PTET page https://www.tax.ny.gov/bus/ptet/city.htm (requires the state election; partnerships need at least one city-taxpayer partner, S corps must be resident S corps with all city-taxpayer shareholders). Documentation-only: the state calculator models no NYC tax'

local_credit_share:
  value:
    '2017': 0
    '2022': 1.0
  reference: 'NYC PTET credit under Tax Law Art. 30 (city PIT; subsection not verified), direct share, excess refunded as overpayment; https://www.tax.ny.gov/bus/ptet/city.htm. FY2027 budget: the 75% cut (S 9009 / A 10009; urged by Mayor Mamdani and Speaker Menin 4/2026) was NOT enacted -- BDO post-enactment alert (above): did not adopt proposals that would have reduced "the city PTET credit to 75%" (secondary)'

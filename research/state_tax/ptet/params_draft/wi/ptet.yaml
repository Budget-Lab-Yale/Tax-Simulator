---
# Wisconsin: entity-level tax election (2017 Wis. Act 368, enacted 12/2018).
# Tax-option (S) corporations: Wis. Stat. 71.365(4m), taxable years beginning
# on or after 1/1/2018 (Schedule 5S-ET). Partnerships: Wis. Stat. 71.21(6),
# taxable years beginning on or after 1/1/2019 (Schedule 3-ET) -- partnerships
# could NOT elect for TY2018. Election annually on the return, with consent
# of owners holding more than 50% of capital and profits / shares.
# Method is EXCLUSION: owners do not include their share of the entity's
# items in Wisconsin AGI. Both entity types pay 7.9% of net income reportable
# to Wisconsin (no capital-gain rate; the entity may claim the 30%/60%
# long-term gain exclusion for individual owners' shares). The partnership
# rate is 7.9%, NOT the individual graduated schedule as ptet_state_law.csv
# notes had it.
# Situs: determined as if no election were made, so a resident owner's share
# is 100% Wisconsin income and a nonresident's share is apportioned.
# Encoding: `rate` is the PARTNERSHIP rate (0 in 2018, when only S corps
# could elect); `rate_scorp` the S-corporation rate.
# DRAFT: research/state_tax/ptet/params_draft -- not read by the model

available:
  value:   # 2018: S corporations only; partnerships from 2019 (rate = 0 in 2018)
    '2017': 0
    '2018': 1
  reference: 'Wis. Stat. 71.365(4m) (2017 Wis. Act 368), taxable years beginning on or after 1/1/2018 (2018 Schedule 5S-ET instructions); Wis. Stat. 71.21(6): partnerships "For taxable years beginning January 1, 2019" (WI DOR FAQ https://revenue.wi.gov/Pages/FAQS/ise-pship.aspx)'
mandatory:
  value: 0
  reference: 'Wis. Stat. 71.21(6)(a), 71.365(4m)(a): elective with >50% owner consent'
method:
  value: 2
  reference: 'WI DOR FAQ "Pass-Through Entity-Level Tax: Partnership" (partners "do not include in their Wisconsin adjusted gross income their proportionate share" of partnership items), https://www.revenue.wi.gov/Pages/FAQS/ise-passthrough-general.aspx; same for S-corporation shareholders under 71.365(4m)'
rate:
  value:
    '2017': 0
    '2019': 0.079
  reference: 'Partnerships: 2024 Schedule 3-ET instructions ("The net income reportable to Wisconsin is taxed at 7.9 percent"), https://www.revenue.wi.gov/TaxForms2024/2024-Schedule3-ET-Inst.pdf; WI DOR FAQ https://www.revenue.wi.gov/Pages/FAQS/ise-passthrough-tax.aspx. 0 before 2019 because partnerships could not elect'
rate_tracks_top:
  value: 0
  reference: '7.9% is the corporate franchise/income tax rate (Wis. Stat. 71.27), not the top individual rate (7.65%)'
rate_scorp:
  value: 0.079
  reference: '2025 Schedule 5S-ET instructions line 18 ("Multiply line 17 by 7.9% (0.079)"), https://www.revenue.wi.gov/TaxForms2025/2025-Schedule5S-ET-Inst.pdf; Wis. Stat. 71.365(4m)'
credit_share:
  value: 0
  reference: 'Not applicable: exclusion method (no owner credit)'
credit_refundable:
  value: 0
  reference: 'Not applicable: exclusion method'
addback:
  value: 0
  reference: 'Not applicable: owners exclude their entire share of entity items, so there is no owner-level deduction to add back (WI DOR partnership FAQ)'
resident_scope:
  value: 1
  reference: 'WI DOR FAQ https://www.revenue.wi.gov/Pages/FAQS/ise-passthrough-tax.aspx: situs determined as if no election were made; a resident partner''s share is 100% Wisconsin income'
nonresident_scope:
  value: 2
  reference: 'WI DOR FAQ (same page): nonresident partner''s share is apportioned'
resident_credit_for_other_state_ptet:
  value: 1   # except income from an entity that also made the Wisconsin election
  reference: 'WI DOR FAQ "Pass-Through Entity-Level Tax: Partnership" (resident partners may claim the TPOS credit for entity-level taxes paid to other states, but get no credit on income from a partnership that elected the Wisconsin entity-level tax; that entity claims its own credit on Schedule ET-OS), https://www.revenue.wi.gov/Pages/FAQS/ise-passthrough-reporting.aspx (seen in search excerpt; full answer not read)'
surtax_rate:
  value: 0
  reference: 'No surtax-layer entity tax in Wisconsin law'
surtax_credit_share:
  value: 0
  reference: 'No surtax-layer entity tax in Wisconsin law'
local_rate:
  value: 0
  reference: 'No local income tax in Wisconsin'
local_credit_share:
  value: 0
  reference: 'Not applicable'

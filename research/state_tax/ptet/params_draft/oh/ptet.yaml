---
# Ohio: electing pass-through entity tax, ORC 5747.38 (SB 246, 134th GA,
# 2022), Form IT 4738, for taxable years beginning in 2022 and later. No
# sunset. Annual election filed by the return deadline, irrevocable for the
# year; disregarded entities cannot elect.
# Rate is NOT the top individual rate: 5% for taxable years beginning in
# 2022, and from 2023 the rate on taxable business income under
# 5747.02(A)(4)(a) (3%). HB 96 (2025) left the rate unchanged and lets the
# electing entity claim credit for taxes paid to other states from TY2025.
# Owner add-back (5747.01(A)(36)) re-enters the income as business income,
# eligible for the 5747.01(A)(28) business income deduction
# ($250,000; $125,000 per spouse filing separately) and taxed at 3%.
# DRAFT: research/state_tax/ptet/params_draft -- not read by the model

available:
  value:
    '2017': 0
    '2022': 1
  reference: 'ORC 5747.38 (SB 246, 134th GA), taxable years beginning in 2022 and later, https://codes.ohio.gov/ohio-revised-code/section-5747.38'
mandatory:
  value: 0
  reference: 'ORC 5747.38: annual election'
method:
  value: 1
  reference: 'ORC 5747.38 and 5747.08(I); IT 4738 instructions (2022): owners claim a refundable credit for their proportionate share on the IT 1040 Schedule of Credits, pass-through entity credit line, https://dam.assets.ohio.gov/image/upload/tax.ohio.gov/forms/pass-through_entities/2022/pte-it4738-instructions.pdf'
rate:
  value:
    '2017': 0.05
    '2023': 0.03
  reference: 'ORC 5747.38: 5% for taxable years beginning in 2022; from 2023 the rate under 5747.02(A)(4)(a) on taxable business income (3%). IT 4738 instructions 2022 ("If the PTE taxable reporting period begins in 2022, the tax rate is 5%"). 2017-2021 value inert (available = 0). Corrects ptet_state_law.csv 2022 (3.0)'
rate_tracks_top:
  value: 0
  reference: 'ORC 5747.38: tied to the business-income rate, not the top individual rate (max(st_ord.rates) is 3.99% in 2022, 2.75% from 2026)'
rate_scorp:
  value: NA   # same as rate
  reference: 'ORC 5747.38: one rate'
credit_share:
  value: 1
  reference: 'IT 4738 instructions (2022): refundable credit for the proportionate share of the tax paid'
credit_refundable:
  value: 1
  reference: 'ORC 5747.08(I); IT 4738 instructions (2022)'
addback:
  value: 1
  reference: 'ORC 5747.01(A)(36): add "the taxpayer''s proportionate share of the amount of the tax levied under section 5747.38" to the extent not otherwise included, https://codes.ohio.gov/ohio-revised-code/section-5747.01; IT 4738 instructions (2025) carry the direct and indirect add-back lines'
resident_scope:
  value: 2
  reference: 'ORC 5747.38: base is "qualifying taxable income" -- the Ohio-apportioned share of business income plus nonbusiness income allocated to Ohio under 5747.20'
nonresident_scope:
  value: 2
  reference: 'ORC 5747.38'
resident_credit_for_other_state_ptet:
  value: NA   # Ohio resident credit (ORC 5747.05(B)) not checked for other states' entity-level taxes
  reference: 'Not settled: HB 96 (2025) entity-level credit for taxes paid to other states is a credit of the ELECTING entity (TY2025+), not the resident individual credit'
surtax_rate:
  value: 0
  reference: 'No surtax-layer entity tax in Ohio law'
surtax_credit_share:
  value: 0
  reference: 'No surtax-layer entity tax in Ohio law'
local_rate:

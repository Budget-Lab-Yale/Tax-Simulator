---
# North Carolina: taxed partnership (G.S. 105-154.1) and taxed S corporation (G.S. 105-131.1A)
# election, S.L. 2021-180 as amended by S.L. 2023-12, TY2022+. Partnerships may elect only if every
# partner is an individual, estate, qualifying trust, certain exempt organization or (from S.L.
# 2023-12) a partnership/corporation whose share is left out of the base; publicly traded
# partnerships cannot elect. Partners deduct their included share (105-153.5(c3)(3)). Before TY2026
# the entity's credits could not pass through to partners (105-154.1(c)).
# Codes: method 0 none / 1 credit / 2 exclusion; *_scope 1 all-source / 2 state-source (apportioned).
# DRAFT: research/state_tax/ptet/params_draft -- not read by the model.

available:
  value:
    '2017': 0
    '2022': 1
  reference: 'N.C.G.S. 105-154.1, https://ncleg.gov/EnactedLegislation/Statutes/HTML/BySection/Chapter_105/GS_105-154.1.html (S.L. 2021-180, amended S.L. 2023-12); taxed S corporations under G.S. 105-131.1A; taxable years beginning on or after 1/1/2022; no sunset or SALT-cap tie in the section'
mandatory:
  value: 0
  reference: 'N.C.G.S. 105-154.1, https://ncleg.gov/EnactedLegislation/Statutes/HTML/BySection/Chapter_105/GS_105-154.1.html (a): annual election'
method:
  value:
    '2017': 0
    '2022': 2
  reference: 'N.C.G.S. 105-154.1, https://ncleg.gov/EnactedLegislation/Statutes/HTML/BySection/Chapter_105/GS_105-154.1.html (d): partners "are allowed a deduction as specified in G.S. 105-153.5(c3)(3)" (their share of income included in the taxed partnership''s NC taxable income); (e) addition for losses under 105-153.5(c3)(4)'
rate:
  value:
    '2017': 0.0
    '2022': 0.0499
    '2023': 0.0475
    '2024': 0.045
    '2025': 0.0425
    '2026': 0.0399
  reference: 'N.C.G.S. 105-154.1, https://ncleg.gov/EnactedLegislation/Statutes/HTML/BySection/Chapter_105/GS_105-154.1.html (b): tax "at the rate levied in G.S. 105-153.7" (individual flat rate); values = baseline/nc/ord.yaml (G.S. 105-153.7; NCDOR tax rate schedules). Trigger-contingent cuts after 2026 not encoded, as in ord.yaml'
rate_tracks_top:
  value: 1
  reference: 'N.C.G.S. 105-154.1, https://ncleg.gov/EnactedLegislation/Statutes/HTML/BySection/Chapter_105/GS_105-154.1.html (b) (rate in G.S. 105-153.7)'
# null = same as rate
rate_scorp:
  value: null
  reference: 'G.S. 105-131.1A (taxed S corporation) at the same 105-153.7 rate'
# exclusion state
credit_share:
  value: 0
  reference: 'Exclusion state: N.C.G.S. 105-154.1, https://ncleg.gov/EnactedLegislation/Statutes/HTML/BySection/Chapter_105/GS_105-154.1.html (d)'
# exclusion state; not applicable
credit_refundable:
  value: 0
  reference: 'Exclusion state: no owner credit exists'
# moot in an exclusion state
addback:
  value: 0
  reference: 'N.C.G.S. 105-154.1, https://ncleg.gov/EnactedLegislation/Statutes/HTML/BySection/Chapter_105/GS_105-154.1.html (b)(2)-(3), (d): the owner deduction removes the whole included share'
# 2017 NA = no tax in effect
resident_scope:
  value:
    '2017': NA
    '2022': 1
    '2023': 2
  reference: 'N.C.G.S. 105-154.1, https://ncleg.gov/EnactedLegislation/Statutes/HTML/BySection/Chapter_105/GS_105-154.1.html (b)(1)a: each eligible partner''s share "attributable to the State"; (b)(1)b (resident partners'' shares NOT attributable to the State) applied to TY2022 only and is repealed for taxable years beginning on or after 1/1/2023 (S.L. 2023-12)'
nonresident_scope:
  value: 2
  reference: 'N.C.G.S. 105-154.1, https://ncleg.gov/EnactedLegislation/Statutes/HTML/BySection/Chapter_105/GS_105-154.1.html (b)(1)a (State-attributable share only)'
# NA: not researched to a primary source
resident_credit_for_other_state_ptet:
  value: NA
  reference: 'G.S. 105-153.9 (credit for taxes paid other states) not checked against PTET; no NCDOR guidance found'
surtax_rate:
  value: 0
  reference: 'No surtax-layer entity tax in NC (searched the PTET statute and revenue-department guidance cited above)'
surtax_credit_share:
  value: 0
  reference: 'No surtax-layer entity tax in NC'
local_rate:
  value: 0
  reference: 'No local entity-level income tax tied to the NC election'
local_credit_share:
  value: 0
  reference: 'No local entity-level income tax tied to the NC election'

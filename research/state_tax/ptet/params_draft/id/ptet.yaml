---
# Idaho: affected business entity (ABE) election (Idaho Code 63-3026B).
#
# Law: added 2021 ch. 239 (HB 317), amended 2022 ch. 185 and 2026 ch. 81
# (election timing; the 2026 amendment was not read beyond the history
# line). Applies to any taxable year in which the entity elects; no sunset
# and no tie to the federal SALT cap in the statute.
#
# Election: separately each year, on a timely filed return (or an amended
# return filed before the original due date), signed by all members or an
# authorized officer/manager/member (63-3026B(2)). The election is
# irrevocable for the year (Tax Commission decision). Tax due by the 15th
# day of the 4th month after year end. Entity NOLs stay at the entity and
# carry forward only to later elected years (63-3026B(4)).
#
# Rate: "the tax rate applicable to corporations provided in section
# 63-3025" -- the CORPORATE rate, which Idaho has kept equal to the top
# individual rate every year 2018-2025.
#
# DRAFT: research/state_tax/ptet/params_draft -- not read by the model

available:
  value:
    '2017': 0
    '2021': 1
  reference: 'Idaho Code 63-3026B(2)(a) ("may elect ... in any taxable year"), history "added 2021, ch. 239, sec. 1"; Tax Commission HB 317 summary (election available for taxable years beginning 1/1/2021), https://legislature.idaho.gov/statutesrules/idstat/Title63/T63CH30/SECT63-3026B/'
mandatory:
  value: 0
  reference: 'Idaho Code 63-3026B(2)(a)'
method:
  value:
    '2017': 0
    '2021': 1
  reference: 'Idaho Code 63-3026B(7)(a): each individual member "is entitled to a credit ... equal to the individual''s pro rata share of the tax paid"'
rate:
  value:
    '2017': 0.074
    '2018': 0.06925
    '2021': 0.065
    '2022': 0.06
    '2023': 0.058
    '2024': 0.05695
    '2025': 0.053
  reference: 'Idaho Code 63-3026B(3)(c) (corporate rate in 63-3025); 63-3025(1)(c)-(h): 6.925% 2018, 6.5% 2021, 6% 2022, 5.8% 2023, 5.695% 2024, 5.3% 2025+, https://legislature.idaho.gov/statutesrules/idstat/Title63/T63CH30/SECT63-3025/. Equals max(st_ord.rates) in baseline/id/ord.yaml every year. Pre-2021 values inert'
# References the corporate rate, which happens to equal the individual top
rate_tracks_top:
  value: 0
  reference: 'Idaho Code 63-3026B(3)(c) references 63-3025 (corporate), not 63-3024 (individual)'
rate_scorp:
  value: NA   # NA = same as rate (schema default)
  reference: 'Idaho Code 63-3026B(3)(c)'
credit_share:
  value: 1
  reference: 'Idaho Code 63-3026B(7)(a)'
credit_refundable:
  value: 1
  reference: 'Idaho Code 63-3026B(7)(a): "If the amount of the credit ... exceeds the individual''s tax liability ..., the individual will be paid a refund equal to the balance of the unused credit"'
# General addition for state income taxes deducted in computing taxable
# income; Form 39R line-level treatment of the entity-deducted ABE tax was
# not read
addback:
  value: 1
  reference: 'Idaho Code 63-3022(a) ("Add any state and local taxes, as defined in section 164 of the Internal Revenue Code that are measured by net income ... paid or accrued during the taxable year"), https://legislature.idaho.gov/statutesrules/idstat/Title63/T63CH30/SECT63-3022/. Form 39R instructions not checked'
# The ABE base is income "derived from or connected with Idaho sources" for
# every member: a resident owner's non-Idaho share is outside the entity tax
resident_scope:
  value: 2
  reference: 'Idaho Code 63-3026B(1)(b) ("Affected business entity income" means items "derived from or connected with Idaho sources") and (3)(a)'
nonresident_scope:
  value: 2
  reference: 'Idaho Code 63-3026B(1)(b), (3)(a)'
resident_credit_for_other_state_ptet:
  value: 1
  reference: 'Idaho Code 63-3026B(7)(b): a resident or part-year resident member "is entitled to a credit against such tax for the individual''s pro rata share of taxes paid to another state ... on income of any partnership or S corporation of which the individual is a member"'
surtax_rate:
  value: 0
  reference: 'No second entity-level layer'
surtax_credit_share:
  value: 0
  reference: 'No second entity-level layer'
local_rate:
  value: 0
  reference: 'No local income tax in Idaho'
local_credit_share:
  value: 0
  reference: 'No local income tax in Idaho'

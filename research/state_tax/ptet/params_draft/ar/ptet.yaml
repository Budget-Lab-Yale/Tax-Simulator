---
# Arkansas: Elective Pass-Through Entity Tax (Act 362 of 2021; Ark. Code Title 26 Ch. 65; member
# exclusion at 26-51-404(b)(31)). Election by >50% of voting rights on Form AR362-E or ATAP by the
# (extended) due date; all members participate, no opt-out. Rate = top individual rate; net capital
# gains at one half of that rate (not held in these parameters). Entity may use AR credits or pass
# them to members. NOLs per 26-51-427.
# NOTE: baseline/ar/ord.yaml has no 2026 entry (holds 3.9%); the enacted 2026 top rate is 3.7%.
# Codes: method 0 none / 1 credit / 2 exclusion; *_scope 1 all-source / 2 state-source (apportioned).
# DRAFT: research/state_tax/ptet/params_draft -- not read by the model.

available:
  value:
    '2017': 0
    '2022': 1
  reference: 'Act 362 of 2021, Ark. Code 26-65-101 et seq. ("Elective Pass-Through Entity Tax Act"), effective for tax years beginning on or after 1/1/2022; Arkansas Form AR1100PET instructions TY2024, https://www.dfa.arkansas.gov/wp-content/uploads/AR1100PET_Instructions_2024_4.pdf p.5/9 ("not available for 2021"). No sunset in the Act; the DFA 2026 similar-tax list (dated 6/3/2026) confirms it is live for 2026'
mandatory:
  value: 0
  reference: 'Arkansas Form AR1100PET instructions TY2024, https://www.dfa.arkansas.gov/wp-content/uploads/AR1100PET_Instructions_2024_4.pdf p.5: election by owners of more than 50% of voting rights; once made all members must participate'
method:
  value:
    '2017': 0
    '2022': 2
  reference: 'Arkansas Form AR1100PET instructions TY2024, https://www.dfa.arkansas.gov/wp-content/uploads/AR1100PET_Instructions_2024_4.pdf p.5-6: Act 362 amends Ark. Code 26-51-404(b) so income of a member subject to the PET "would be excluded from Arkansas income tax"'
# Capital gains are taxed at half the rate (2.45/2.35/1.95% for 2022/2023/2024+); not held here
rate:
  value:
    '2017': 0.0
    '2022': 0.049
    '2023': 0.047
    '2024': 0.039
    '2026': 0.037
  reference: 'Arkansas Form AR1100PET instructions TY2024, https://www.dfa.arkansas.gov/wp-content/uploads/AR1100PET_Instructions_2024_4.pdf p.9: Acts 1 and 2 of the 2021 Third Extraordinary Session set the PET rate "equal to the maximum income tax rate for individual income taxes", so "for tax years beginning in 2022 is 4.9%"; 2023 "4.7%"; p.5 "For tax years beginning in 2024 ... 3.9%". 2025 = 3.9% top individual rate (baseline/ar/ord.yaml). 2026 = 3.7% under HB 1001 / Act 1 of the 2026 extraordinary session, retroactive to 1/1/2026 (EY Tax News 2026-1239, secondary; enrolled act not read)'
rate_tracks_top:
  value: 1
  reference: 'Arkansas Form AR1100PET instructions TY2024, https://www.dfa.arkansas.gov/wp-content/uploads/AR1100PET_Instructions_2024_4.pdf p.5: "will be equal to the highest income tax rate for individuals"; p.6 "equal to the highest personal income tax rate in Arkansas in effect for that year in future years"'
# null = same as rate
rate_scorp:
  value: null
  reference: 'Arkansas Form AR1100PET instructions TY2024, https://www.dfa.arkansas.gov/wp-content/uploads/AR1100PET_Instructions_2024_4.pdf p.5: "The PET tax rate for all taxpayers will be the same for all owner members"'
# exclusion state
credit_share:
  value: 0
  reference: 'Exclusion state: Ark. Code 26-51-404(b)(31) (Act 362 of 2021)'
# exclusion state; not applicable
credit_refundable:
  value: 0
  reference: 'Exclusion state: no owner credit exists (Ark. Code 26-51-404(b)(31))'
# moot in an exclusion state: the owner excludes its entire share of the entity income
addback:
  value: 0
  reference: 'Arkansas Form AR1100PET instructions TY2024, https://www.dfa.arkansas.gov/wp-content/uploads/AR1100PET_Instructions_2024_4.pdf p.5: the member''s whole share of PET-taxed income is excluded, so an owner-level add-back of the entity deduction has no base to act on'
resident_scope:
  value: 2
  reference: 'Arkansas Form AR1100PET instructions TY2024, https://www.dfa.arkansas.gov/wp-content/uploads/AR1100PET_Instructions_2024_4.pdf p.6: "all Arkansas income of the entity is subject to the PET tax"; multistate entities apportion by single sales factor (Act 822 of 2019); residents separately exclude income taxed by substantially similar other-state taxes'
nonresident_scope:
  value: 2
  reference: 'Arkansas Form AR1100PET instructions TY2024, https://www.dfa.arkansas.gov/wp-content/uploads/AR1100PET_Instructions_2024_4.pdf p.5-6 (Arkansas-apportioned income; nonresidents whose only Arkansas income is PET-taxed need not file)'
# relief is an EXCLUSION of the other-state-PTET income, not a credit
resident_credit_for_other_state_ptet:
  value: 1
  reference: 'Ark. Code 26-51-404(b)(31)(B)(i)(a) as quoted in Arkansas Form AR1100PET instructions TY2024, https://www.dfa.arkansas.gov/wp-content/uploads/AR1100PET_Instructions_2024_4.pdf p.5: a resident member "may exclude ... the member''s pro rata share of income subject to a tax paid to another state or DC" under a "substantially similar" tax; DFA publishes the list of similar-tax states (2026 list, https://www.dfa.arkansas.gov/wp-content/uploads/States_with_Similar_Tax_PET_2026.pdf)'
surtax_rate:
  value: 0
  reference: 'No surtax-layer entity tax in AR (searched the PTET statute and revenue-department guidance cited above)'
surtax_credit_share:
  value: 0
  reference: 'No surtax-layer entity tax in AR'
local_rate:
  value: 0
  reference: 'No local entity-level income tax tied to the AR election'
local_credit_share:
  value: 0
  reference: 'No local entity-level income tax tied to the AR election'

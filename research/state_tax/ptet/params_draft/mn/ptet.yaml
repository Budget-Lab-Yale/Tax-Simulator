---
# Minnesota: elective pass-through entity tax, Minn. Stat. 289A.08 subd. 7a
# (created 2021 c 14 art 3 s 2; amended 2023 c 1, 2023 c 64, 2024 c 85,
# 2026 c 128). Owner credit Minn. Stat. 290.06 subd. 40; credit for PTE tax
# paid to another state 290.06 subd. 23a.
# Years: TY2021 onward; the original subd. 7a(l) expired "at the same time and
# on the same terms as section 164(b)(6)(B)", i.e. after TY2025. 2026 c 128
# (HF 2438, signed 5/27/2026) art 2 s 17 REVIVES AND REENACTS subd. 7a and
# subd. 23a retroactively from 1/1/2026, and art 2 s 9 / s 12 replace the
# federal-tie sunset with a fixed end: taxable years beginning after
# 12/31/2027. Available TY2021-2027 continuously under current law.
# Qualifying owners: resident or nonresident individuals and estates, certain
# trusts owning S stock, and disregarded entities owned by one of these; PTPs
# excluded. Election on the return by its due date, binding on all qualifying
# owners.
# Base nuance the scalar cannot hold: a RESIDENT owner's share of a
# PARTNERSHIP is "not subject to allocation outside this state" (all-source),
# but a resident S-corporation shareholder's share is allocated under the
# nonresident rules (290.17, 290.191, 290.20), i.e. Minnesota-source only.
# resident_scope below records the partnership case.
# DRAFT: research/state_tax/ptet/params_draft -- not read by the model

available:
  value:
    '2017': 0
    '2021': 1
    '2028': 0
  reference: 'Minn. Stat. 289A.08 subd. 7a (2021 c 14 art 3 s 2), https://www.revisor.mn.gov/statutes/cite/289A.08; Laws 2026 c 128 (HF 2438) art 2 s 9 (fixed expiration: taxable years beginning after 12/31/2027) and s 17 (revival and reenactment retroactive to 1/1/2026), https://www.revisor.mn.gov/laws/2026/0/128/. Transcription check: EY Tax Alert 2026-1193; Forvis Mazars 2026-06'
mandatory:
  value: 0
  reference: 'Minn. Stat. 289A.08 subd. 7a(b): elective'
method:
  value: 1
  reference: 'Minn. Stat. 290.06 subd. 40(a): qualifying owner credit equal to the owner''s tax liability under 289A.08 subd. 7a(d)'
rate:
  value: 0.0985
  reference: 'Minn. Stat. 289A.08 subd. 7a(d): owner''s income times "the highest tax rate for individuals" under 290.06 subd. 2c (9.85%, all statuses, unchanged 2021-2027), https://www.revisor.mn.gov/statutes/cite/290.06. Matches max(st_ord.rates) in baseline/mn/ord.yaml'
rate_tracks_top:
  value: 1
  reference: 'Minn. Stat. 289A.08 subd. 7a(d)'
rate_scorp:
  value: NA   # same as rate
  reference: 'Minn. Stat. 289A.08 subd. 7a(d): one rate for partnerships and S corporations'
credit_share:
  value: 1
  reference: 'Minn. Stat. 290.06 subd. 40(a)'
credit_refundable:
  value: 1
  reference: 'Minn. Stat. 290.06 subd. 40(b): if the credit exceeds liability "the commissioner shall refund the excess"'
addback:
  value: 1
  reference: 'Minn. Stat. 290.0131 subd. 5 (addition for income taxes deducted in computing federal AGI, which reaches the owner''s share of the entity tax deducted at the entity level) and Schedule PTE-RP 2026 instructions line 8 (addition for state income taxes deducted by the entity, sourced from Schedule KPI), https://www.revenue.state.mn.us/sites/default/files/2026-10/pte-rp-26.pdf. Statutory reading; the KPI line instructions were not read (404)'
resident_scope:
  value: 1   # partnerships only; resident S-corp shareholders are Minnesota-source (2)
  reference: 'Minn. Stat. 289A.08 subd. 7a(a)(1): a resident''s partnership income is "not subject to allocation outside this state"; resident S-corporation income is allocated under 290.17, 290.191, 290.20'
nonresident_scope:
  value: 2
  reference: 'Minn. Stat. 289A.08 subd. 7a(a)(1): allocated and assigned to Minnesota under 290.17, 290.191, 290.20'
resident_credit_for_other_state_ptet:
  value: 1
  reference: 'Minn. Stat. 290.06 subd. 23a (PTE tax paid to another state, treated as a credit under subd. 22; claimable only by a qualifying owner), revived and extended through TY2027 by Laws 2026 c 128 art 2 s 12 and s 17. Transcription check: Forvis Mazars 2026-06 ("extended the provision that lets a resident individual claim a credit for PTET taxes paid to other states")'
surtax_rate:
  value: 0
  reference: 'No surtax-layer entity tax in Minnesota law'
surtax_credit_share:
  value: 0
  reference: 'No surtax-layer entity tax in Minnesota law'
local_rate:
  value: 0
  reference: 'No local income tax in Minnesota'
local_credit_share:
  value: 0
  reference: 'No local income tax in Minnesota'

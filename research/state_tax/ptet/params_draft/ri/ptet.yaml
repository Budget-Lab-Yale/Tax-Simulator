---
# Rhode Island: entity-level election, R.I. Gen. Laws 44-11-2.3, enacted by
# P.L. 2019 ch. 88 art. 5 s.8 (TY2019+); credit cut to 90% by P.L. 2024
# ch. 117 art. 6 s.11 (TY2025+).
#
# Election: annual, by filing the prescribed form and remitting the tax
# (44-11-2.3(a)(1)); from TY2024 computed on RI Schedule PTE attached to the
# RI-1065 / RI-1120S. Electing entities are relieved of nonresident
# withholding (44-11-2.3(b)(2)).
#
# Base: "net income" = ordinary business income, net rental income,
# guaranteed payments and other Schedule C/E business income, less
# specially allocated 179 and depreciation; EXCLUDES specially allocated
# investment income (44-11-2.3(a)(2)). Apportioned to RI for all owners
# (Schedule PTE line 1 "Total Pass-through Entity Income apportioned to
# Rhode Island") -- residents are NOT taxed at entity level on income
# sourced elsewhere.
#
# Owners: credit, reported with withholding on RI Schedule W (so it acts
# as a payment and is refunded if it exceeds tax), plus an ADDITION
# modification for the pro rata entity tax (44-11-2.3(c)(2)).
# No sunset in 44-11-2.3.
#
# DRAFT: research/state_tax/ptet/params_draft -- not read by the model

available:
  value:
    '2017': 0
    '2019': 1
  reference: 'R.I. Gen. Laws 44-11-2.3(b)(1): "For tax years beginning on or after January 1, 2019, a pass-through entity may elect to pay the state tax at the entity level", http://webserver.rilegislature.gov/Statutes/TITLE44/44-11/44-11-2.3.htm; no end date in the section'

mandatory:
  value: 0
  reference: 'R.I. Gen. Laws 44-11-2.3(a)(1),(b)(1) (annual election)'

method:
  value: 1   # credit
  reference: 'R.I. Gen. Laws 44-11-2.3(c)(1),(d)'

rate:
  value:
    '2017': 0
    '2019': 0.0599
  reference: 'R.I. Gen. Laws 44-11-2.3(b)(1): "at the rate of five and ninety-nine hundredths percent (5.99%)"; 2024 RI Schedule PTE line 4 "Individual Tax Rate 5.99%", https://tax.ri.gov/sites/g/files/xkgbur541/files/2024-10/RI%20Schedule%20PTE_bd_0.pdf'

rate_tracks_top:
  value: 0
  reference: 'R.I. Gen. Laws 44-11-2.3(b)(1) states 5.99% in its own terms; equal to max(st_ord.rates) 2019-2030 but not linked'

rate_scorp:
  value: NA   # same rate
  reference: 'R.I. Gen. Laws 44-11-2.3(b)(1) applies one rate'

credit_share:
  value:
    '2017': 0
    '2019': 1.0
    '2025': 0.9
  reference: 'R.I. Gen. Laws 44-11-2.3(a)(5),(d): "For tax years beginning on or after January 1, 2025, the state tax credit shall be ninety percent (90%) of the amount of tax paid by the pass-through entity" (P.L. 2024 ch. 117 art. 6 s.11, effective 1/1/2025), http://webserver.rilegislature.gov/Statutes/TITLE44/44-11/44-11-2.3.htm. CORRECTION to ptet_state_law.csv (which carries 1.0 for 2025-2030)'

credit_refundable:
  value: 1
  reference: 'Credit is reported on RI Schedule W with withholding and pass-through payments (2023 Form RI-PTE: "the amount each pass-through entity member will report on RI Schedule W when filing Form RI-1040 or Form RI-1040NR"), so excess is refunded. 44-11-2.3 itself is silent on refundability; inferred from the form treatment'

addback:
  value: 1
  reference: 'R.I. Gen. Laws 44-11-2.3(c)(2): the entity "shall also report the pro rata share of the state income taxes paid by the entity as an income (addition) modification to be reported by an owner on his or her personal income tax returns". Note: from TY2025 the add-back is 100% of the tax while the credit is 90%'

resident_scope:
  value:
    '2017': NA   # no election
    '2019': 2
  reference: '2024 RI Schedule PTE line 1 "Total Pass-through Entity Income apportioned to Rhode Island" (the same base for every owner); R.I. Gen. Laws 44-11-2.3(a)(2) net income definition'

nonresident_scope:
  value:
    '2017': NA   # no election
    '2019': 2
  reference: '2024 RI Schedule PTE line 1 (apportioned income)'

resident_credit_for_other_state_ptet:
  value:
    '2017': 0
    '2019': 1
  reference: 'R.I. Gen. Laws 44-11-2.3(e): "A similar type of tax imposed by another state on the owners'' income paid at the state entity level shall be deemed to be allowed as a credit for taxes paid to another jurisdiction in accordance with the provisions of 44-30-18" (P.L. 2019 ch. 88)'

surtax_rate:
  value: 0
  reference: 'RI has no surtax-layer PTET'
surtax_credit_share:
  value: 0
  reference: 'RI has no surtax-layer PTET'
local_rate:
  value: 0
  reference: 'No local income tax in RI'
local_credit_share:
  value: 0
  reference: 'No local income tax in RI'

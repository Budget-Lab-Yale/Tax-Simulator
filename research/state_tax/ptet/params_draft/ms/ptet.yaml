  reference: 'Mississippi DOR Electing Pass-Through Entity FAQs (rev. 9/11/2023), https://www.dor.ms.gov/sites/default/files/news/EPTE%20Revised%20FAQ%209-11-23.pdf: credit "equal to the partner''s pro rata or distributive share of the tax paid (form 84-105, line 9)"; Mississippi Form 84-100 Pass-Through Entity Income and Franchise Tax Instructions TY2025 (Rev. 01/26), https://www.dor.ms.gov/sites/default/files/tax-forms/business/2025%20PTE%20INSTRUCTIONS%2084-100%20-%20Final%20%2001.14.2026.pdf'
credit_refundable:

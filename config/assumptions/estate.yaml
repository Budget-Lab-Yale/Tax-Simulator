# Estate reporting response -- config/scenarios/behavior/estate/avoidance.R
#
# Model ASSUMPTIONS, not tax law. Override per scenario with the runscript column
# assumption.estate.{name}. See src/misc/assumptions.R.
#
# NOT here, deliberately: the estate MEASUREMENT bridge (r, rho_pt, the SOI
# per-bin deduction/DSUE fractions, the gift add-back gamma, the donor-clone
# cluster cap). Those live in config/estate/estate_valuation_params.yaml, are
# GENERATED by other/estate_tax/write_frozen_params.R, and must never be
# scenario-overridden: they measure the data rather than describe a
# counterfactual world. Estate LAW lives in
# config/scenarios/tax_law/baseline/estate.yaml and is reform-overridable like
# any other parameter.

report_eps:
  value: 0.16
  kind: sourced
  citation: >
    Kopczuk and Slemrod, "Dying to Save Taxes": elasticity of the REPORTED
    estate with respect to the net-of-estate-tax rate, central ~0.16 (pooled
    estimates 0.10-0.22). Applied as
    retained = ((1 - tau_S) / (1 - tau_B)) ^ eps.
  note: >
    Source caveats recorded at the call site: the KS estimate bundles timing,
    avoidance, valuation and some real response, and their elasticity is of the
    reported TAXABLE estate while this is applied to the reported GROSS estate
    -- a slight mismatch, accepted. Magnitude check: at 0.16 a 40% -> 55%
    top-rate hike shrinks the top-bracket reported estate by about 4.5%.
    Author-sanctioned at 0.16 on 2026-07-12.

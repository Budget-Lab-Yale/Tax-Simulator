# Noncompliance / evasion -- config/scenarios/behavior/evasion/debacker.R
#
# Model ASSUMPTIONS, not tax law. Override per scenario with the runscript column
# assumption.evasion.{name}. See src/misc/assumptions.R.
#
# These are net-of-tax-rate elasticities of REPORTED income (reported income
# falls when the MTR rises), applied through the 'netoftax' form. Wages,
# interest and dividends have NO response by design: information reporting makes
# them visible (DHY report audit-adjustment rates around 7% for wages against
# ~74% for sole-proprietor income, and the tax-gap literature puts wage
# misreporting near 1%).
#
# Do NOT stack this module with any generic ETI adjustment -- that double-counts
# the noncompliance component. Note also that sigma.conv is calibrated as a
# RESIDUAL given these values, so changing one of them invalidates sigma.

e_schc:
  value: 0.046
  kind: sourced
  citation: >
    DeBacker, Heim and Yuskavage (NTA 2025), pooled cross-section,
    sole-proprietor subsample, federal MTR. Applies to Schedule C/F (sole prop
    and farm). Alternative anchors for sweeps, not centrals: the Kansas DiD
    Schedule C estimate of 0.09, and 0.26 from bunching at EITC kinks (a
    low-income population).

e_pt:
  value: 0.052
  kind: sourced
  citation: >
    DeBacker, Heim and Yuskavage (NTA 2025), pooled cross-section, partnership
    subsample, federal MTR. Applies to partnership and S-corp income.

e_rent:
  value: 0.040
  kind: sourced
  citation: >
    DeBacker, Heim and Yuskavage, Kansas DiD, Schedule E excluding
    pass-through. Not statistically significant -- the weakest-identified value
    in this file.

topend_mult:
  value: 1
  kind: structural
  note: >
    Underdetection multiplier applied to every elasticity above. NRP random
    audits underdetect sophisticated top-end evasion (offshore structures,
    tiered partnerships -- Guyton, Langetieg, Reck, Risch and Zucman 2021), so
    detected-noncompliance elasticities are a FLOOR for the top tail. Default 1
    (no adjustment); sweep 1.5-2.0 for the high band.

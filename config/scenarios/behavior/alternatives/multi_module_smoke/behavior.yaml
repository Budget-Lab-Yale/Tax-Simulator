# Behavior leg alternative -- multi_module_smoke
#
# Gate fixture. Four families at once -- bathtub, entity shifting, evasion and
# charitable giving at -1.0 -- chosen to exercise the stack rather than to
# represent any real assumption set. Deliberately has no conversion module,
# so it also covers the bathtub-without-conversion shape.
#
# Execution order is not the order below: src/sim/behavior.R sorts the list
# against one pinned family order, because some responses read what an earlier
# one wrote. See that file for the order and the reasons.

# kg_dynamics binds the pieces of the gains machinery this scenario uses, each to
# the calibration file carrying its value and provenance. The bathtub applier is
# not listed under modules: it is the machinery itself and comes in automatically.
# A sweep binds a different file of the same shape, which is how the sweep ends up
# recorded in the vintage.

kg_dynamics:
  bathtub: config/calibrations/kg/bathtub.yaml

modules:
  - src/behavior/entity_shifting/pearce_prisinzano.R
  - src/behavior/evasion/debacker.R
  - src/behavior/charity/100.R

# This fixture pins Tax-Data 2026050315 on purpose (its economy alternative), which
# makes every capital-gains calibration read as stale -- correctly, since they were
# derived under a later vintage. Accepted here rather than in the calibration files
# themselves: those are rewritten by their calibrators, and this acceptance is
# about what THIS scenario is doing, not about the values being wrong.
waivers:
  bathtub.eta:
    date: '2026-07-26'
    reason: >
      Gate fixture pinned to Tax-Data 2026050315 on purpose.
  bathtub.eta_logs:
    date: '2026-07-26'
    reason: >
      Gate fixture pinned to Tax-Data 2026050315 on purpose.
  bathtub.timeable_share:
    date: '2026-07-26'
    reason: >
      Gate fixture pinned to Tax-Data 2026050315 on purpose.
  bathtub.timeable_share_logs:
    date: '2026-07-26'
    reason: >
      Gate fixture pinned to Tax-Data 2026050315 on purpose.

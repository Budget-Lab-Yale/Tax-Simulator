# Behavior leg alternative -- kg_dynamics_only
#
# The capital-gains bathtub and nothing else: realization timing responds to
# rates, and no other margin moves. The clean read on the gains channel.
#
# Execution order is not the order below: src/sim/behavior.R sorts the list
# against one pinned family order, because some responses read what an earlier
# one wrote. See that file for the order and the reasons.

# kg_dynamics binds the pieces of the gains machinery this scenario uses, each to
# the calibration file carrying its value and provenance. The bathtub applier is
# not listed under modules: it is the machinery itself and comes in automatically.
# A sweep binds a different file of the same shape, which is how the sweep ends up
# recorded in the vintage.

kg_dynamics:
  bathtub: config/calibrations/kg/bathtub.yaml

modules: []

# Income-evasion responses -- src/behavior/evasion/debacker.R
#
# TEMPORARY HOME. This channel moves out of the economy leg later in the
# rebuild: kg and sigma become calibration stamps under config/calibrations/kg/
# (read through the behavior leg), and the module-only parameters below get
# inlined into the behavior module files that are their only readers. It sits
# here now so exactly one configuration engine is live at a time.

_channel:
  role: transmission

e_schc:
  value: 0.046
  kind: sourced
  citation: >
    DeBacker, Heim and Yuskavage (NTA 2025), pooled cross-section,
    sole-proprietor subsample, federal MTR. Applies to Schedule C/F (sole prop
    and farm). Alternative anchors for sweeps, not centrals: the Kansas DiD
    Schedule C estimate of 0.09, and 0.26 from bunching at EITC kinks (a
    low-income population).

e_pt:
  value: 0.052
  kind: sourced
  citation: >
    DeBacker, Heim and Yuskavage (NTA 2025), pooled cross-section, partnership
    subsample, federal MTR. Applies to partnership and S-corp income.

e_rent:
  value: 0.040
  kind: sourced
  citation: >
    DeBacker, Heim and Yuskavage, Kansas DiD, Schedule E excluding
    pass-through. Not statistically significant -- the weakest-identified value
    in this file.

topend_mult:
  value: 1
  kind: structural
  note: >
    Underdetection multiplier applied to every elasticity above. NRP random
    audits underdetect sophisticated top-end evasion (offshore structures,
    tiered partnerships -- Guyton, Langetieg, Reck, Risch and Zucman 2021), so
    detected-noncompliance elasticities are a FLOOR for the top tail. Default 1
    (no adjustment); sweep 1.5-2.0 for the high band.

# Entity-choice / conversion elasticity -- the sigma conversion module
#
# TEMPORARY HOME. This channel moves out of the economy leg later in the
# rebuild: kg and sigma become calibration stamps under config/calibrations/kg/
# (read through the behavior leg), and the module-only parameters below get
# inlined into the behavior module files that are their only readers. It sits
# here now so exactly one configuration engine is live at a time.

_channel:
  role: transmission

conv:
  value: 0.16
  kind: calibrated
  set: '2026-07-12'
  target: >
    Top-subset ETI of 0.25 (Saez-Slemrod-Giertz central; taxable income
    EXCLUDING net capital gains, after deductions) measured on the +5pp
    top-ordinary validation leg (tests/topord_plus5, 2025:2035) with the full
    behavior stack running. sigma is the RESIDUAL conversion margin: entity
    shifting and evasion supply ~0.22 of the target on their own.
  derived_under:
    tax_data: '2026070814'
    macro_projections: '2026022522'
  invalidated_by:
    - src/behavior/entity_shifting/pearce_prisinzano.R
    - src/behavior/evasion/debacker.R
    - src/behavior/charity/100.R
    - src/sim/sigma_conversion.R
  invalidated_by_hashes:
    src/behavior/entity_shifting/pearce_prisinzano.R: 309cc92f32c0ee6836ee4b4b31a2bf8e
    src/behavior/evasion/debacker.R: 5a18248b8e7a5d29e9dd44a3b04fdbd3
    src/behavior/charity/100.R: 3e6d30228a38e970360e2e80acb6b4d7
    src/sim/sigma_conversion.R: 79077977f1675e91604f9cbab5d8a842
  rederive: other/top_tax/archive/tests/compute_top_eti.R
  note: >
    History 0.08 -> 0.157 -> 0.16. The 2026-07-12 move was driven by
    entity-shifting tau_eq repricing plus the evasion cross-base fix, not by the
    estate build. Method and measured legs: other/top_tax/sigma_explainer.md.
    The kg Bellman calibration is orthogonal (disjoint base: ordinary income
    excludes realizations) unless the pool ever starts taxing gains.
    NOTE: the rederive script sits under other/top_tax/archive/ -- the path
    quoted in src/sim/sigma_conversion.R points at a location that no longer
    exists.
    VINTAGE CORRECTED 2026-07-25 (author): the inherited record in
    calibration_reference.csv said Tax-Data 2026050315, but the 2026-07-12
    re-derivation ran AFTER the 2026-07-08 Tax-Data bump and therefore used
    2026070814. The old row was stale bookkeeping, not a stale calibration.
    HASH RE-PIN 2026-07-25: debacker.R and sigma_conversion.R changed in the
    assumptions-layer refactor (constants moved to config, read at point of use).
    The refactor is intended to be behavior-preserving, so the hashes were
    re-pinned rather than treating sigma as re-derivable. This is CONDITIONAL on
    the byte-identical verification run; if that run shows any output diff, the
    refactor changed behavior and sigma must actually be re-derived.
    HASH RE-PIN 2026-07-26 (behavior leg): pearce_prisinzano.R, debacker.R and
    sigma_conversion.R changed again, all three in the same one respect -- the
    hand-written module-order and activation guards were deleted, because the
    behavior loader now settles order before the run starts and checks the same

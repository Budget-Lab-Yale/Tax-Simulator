    condition as the line above: this re-pin stands only if the six-scenario
    gate is byte-identical, and is reverted to a real re-derivation if not.
    HASH RE-PIN 2026-07-26 (step 3): debacker.R and sigma_conversion.R changed
    again, in comment text only -- the evasion elasticities moved into their
    module file and stale config/assumptions/ pointers were corrected. Same

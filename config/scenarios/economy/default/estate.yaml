# Estate measurement -- src/sim/estate.R
#
# A state channel holding one entry, the valuation bridge. It measures the data
# rather than describing a counterfactual, which is why it is locked against
# scenario override. The estate reporting elasticity is in
# src/behavior/estate/avoidance.R, its only reader.

_channel:
  role: state

valuation_bridge:
  value: config/calibrations/estate/bridge.yaml
  kind: calibrated
  locked: true
  enforcement: warn
  set: '2026-07-08'
  target: >
    SOI-published estate aggregates: the valuation factors r and rho_pt, the
    per-bin deduction and DSUE fractions, the gift add-back gamma and the
    donor-clone cluster cap, frozen at the latest observed SOI death year, 2022, at
    the $12.06M exemption. Generated by other/estate_tax/write_frozen_params.R; the
    target file is not hand-edited.
  derived_under:
    tax_data: '2026070814'
  invalidated_by:
    - config/calibrations/estate/bridge.yaml
    - config/calibrations/estate/valuation_fit.yaml
    - config/calibrations/estate/settings.yaml
    - other/estate_tax/write_frozen_params.R
  invalidated_by_hashes:
    config/calibrations/estate/bridge.yaml: 93afa716229f15e50f62a0c27835d8e5
    config/calibrations/estate/valuation_fit.yaml: 3c9b514c1b6d98461635d1bc45cae1b2
    config/calibrations/estate/settings.yaml: b2146da972908185be7510ef9bb83d58
    other/estate_tax/write_frozen_params.R: 727ab8e68b4696391f7e2c4aea437ec8
  rederive: other/estate_tax/write_frozen_params.R
  note: >
    Points to the file holding the frozen measurement parameters. A reform changes
    estate law, not how the data maps to reported estates, so this bridge is never
    reform-overridable and `locked: true` is what enforces that.

    Enforcement is at warn level because the model is run against older Tax-Data
    vintages on purpose, for historical comparisons and to reproduce a shipped
    vintage, and a locked entry has no override to escape through. A hard stop would
    make those runs impossible rather than caveated. src/sim/estate.R warns at the
    point of use as well.

# Estate measurement -- src/sim/estate.R
#
# A state channel holding two entries, the valuation bridge and the widowhood
# shares. Both measure the data rather than describing a counterfactual, which
# is why they are locked against scenario override. The estate reporting
# elasticity is in src/behavior/estate/avoidance.R, its only reader.

_channel:
  role: state

widowhood_shares:
  value: config/calibrations/estate/widowhood.yaml
  kind: calibrated
  locked: true
  enforcement: warn
  set: '2026-07-28'
  target: >
    The probability that an unmarried person is widowed rather than never married,
    separated or divorced, by age band and sex, measured from the 2022 SCF
    (weighted share with X8023 == 5 among X8023 in {3,4,5,6}, all five
    implicates). Read by the kg_dynamics death-gain exclusion to decide whether a
    single filer can claim the married amount through a survivor election.
    Widowhood is an upper bound on that eligibility: a real regime requires the
    election to have been made, and some spouses leave no unused exclusion.
    Generated by other/estate_tax/write_widowhood_shares.R; the target file is
    not hand-edited.
  derived_under:
    tax_data: '2026070814'
  invalidated_by:
    - config/calibrations/estate/widowhood.yaml
    - config/calibrations/estate/settings.yaml
    - other/estate_tax/write_widowhood_shares.R
  invalidated_by_hashes:
    config/calibrations/estate/widowhood.yaml: 83bf12cedc616d0175f62a9fab4f4459
    config/calibrations/estate/settings.yaml: dfdc5b990593ee6fffd63b35ff70d451
    other/estate_tax/write_widowhood_shares.R: 77e6fed51d2b9762ec75ffa6bb501674
  rederive: other/estate_tax/write_widowhood_shares.R
  note: >
    Points to the file holding the widowhood shares. Like the valuation bridge
    this measures the data rather than the law, so it is never reform-overridable
    and `locked: true` is what enforces that. Enforcement is at warn level for the
    same reason as the bridge: the model is run against older Tax-Data vintages on
    purpose, and a locked entry has no override to escape through.

valuation_bridge:
  value: config/calibrations/estate/bridge.yaml
  kind: calibrated
  locked: true
  enforcement: warn
  set: '2026-07-08'
  target: >
    SOI-published estate aggregates: the valuation factors r and rho_pt, the
    per-bin deduction and DSUE fractions, the gift add-back gamma and the
    donor-clone cluster cap, frozen at the latest observed SOI death year, 2022, at
    the $12.06M exemption. Generated by other/estate_tax/write_frozen_params.R; the
    target file is not hand-edited.
  derived_under:
    tax_data: '2026070814'
  invalidated_by:
    - config/calibrations/estate/bridge.yaml
    - config/calibrations/estate/valuation_fit.yaml
    - config/calibrations/estate/settings.yaml
    - other/estate_tax/write_frozen_params.R
  invalidated_by_hashes:
    config/calibrations/estate/bridge.yaml: 93afa716229f15e50f62a0c27835d8e5
    config/calibrations/estate/valuation_fit.yaml: 3c9b514c1b6d98461635d1bc45cae1b2
    config/calibrations/estate/settings.yaml: dfdc5b990593ee6fffd63b35ff70d451
    other/estate_tax/write_frozen_params.R: 727ab8e68b4696391f7e2c4aea437ec8
  rederive: other/estate_tax/write_frozen_params.R
  note: >
    Points to the file holding the frozen measurement parameters. A reform changes
    estate law, not how the data maps to reported estates, so this bridge is never
    reform-overridable and `locked: true` is what enforces that.

    Enforcement is at warn level because the model is run against older Tax-Data
    vintages on purpose, for historical comparisons and to reproduce a shipped
    vintage, and a locked entry has no override to escape through. A hard stop would
    make those runs impossible rather than caveated. src/sim/estate.R warns at the
    point of use as well.

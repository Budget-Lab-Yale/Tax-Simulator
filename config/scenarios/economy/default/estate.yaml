# Estate measurement -- src/sim/estate.R
#
# Economy-leg STATE channel, and after the behavior leg went live it holds one
# entry: the valuation bridge, which MEASURES THE DATA rather than describing a
# counterfactual, which is why it is locked against scenario override. The
# estate reporting elasticity that used to sit here moved into
# src/behavior/estate/avoidance.R, its only reader.

_channel:
  role: state

valuation_bridge:
  value: config/calibrations/estate/bridge.yaml
  kind: calibrated
  locked: true
  enforcement: warn
  set: '2026-07-08'
  target: >
    SOI-published estate aggregates: valuation factors r/rho_pt, per-bin
    deduction/DSUE fractions, gift add-back gamma and the donor-clone cluster
    cap, frozen at the latest observed SOI death year (2022, at the $12.06M
    exemption). GENERATED by other/estate_tax/write_frozen_params.R -- do not
    hand-edit the target file.
  derived_under:
    tax_data: '2026070814'
  invalidated_by:
    - config/calibrations/estate/bridge.yaml
    - config/calibrations/estate/valuation_fit.yaml
    - config/calibrations/estate/settings.yaml
    - other/estate_tax/write_frozen_params.R
  invalidated_by_hashes:
    config/calibrations/estate/bridge.yaml: 929aeb4a2d0bf1df86b57555f81b6ce6
    config/calibrations/estate/valuation_fit.yaml: 8c9b7a1baa7506e125d00b2fe59bbc5f
    config/calibrations/estate/settings.yaml: 46da94161caa4fcb0fdc779c8add5c57
    other/estate_tax/write_frozen_params.R: ca41eb83d71c69d2c2c81404d96c7060
  rederive: other/estate_tax/write_frozen_params.R
  # Re-pinned 2026-07-26. write_frozen_params.R now reads the fitted r/rho_pt from
  # config/calibrations/estate/valuation_fit.yaml (written by the calibrator) and
  # the chosen inputs from settings.yaml, instead of the hand-written
  # other/estate_tax/estate_valuation_params.yaml, which is deleted. Both new
  # files join the list above. bridge.yaml's hash moved because its header
  # comment changed and two record-keeping fields reformatted; verified directly
  # that every value the model reads is identical.
  note: >
    Value is a PATH POINTER to the frozen measurement-parameter file. This is a
    measurement bridge, never reform-overridable: reforms change estate LAW,
    not how the data maps to reported estates. `locked: true` enforces that no
    scenario override can retarget or replace it.

    `enforcement: warn` because the model deliberately runs against older
    Tax-Data vintages (historical comparisons, reproducing a shipped vintage),
    and a locked entry has no override escape hatch -- a hard stop here would
    make those runs unrunnable rather than caveated. src/sim/estate.R has
    warned at the point of use since before the redesign; this keeps the
    pre-redesign behavior while the provenance stays recorded.

timeable_share_logs:
  value: 0.2542
  kind: calibrated
  set: '2026-07-19'
  target: >
    Same short-run announcement moment as the levels share (+5.04), calibrated
    independently for the net-of-tax form given eta_logs. The timing overlay is
    a mechanical fraction rather than a Bellman response, so it is nearly
    form-robust -- hence the same numeric value.
  derived_under:
    tax_data: '2026070814'
    macro_projections: '2026022522'
  invalidated_by:
    - src/sim/kg/constants.R
    - src/sim/kg/timing.R
    - src/sim/kg/recurrence.R
  invalidated_by_hashes:
    src/sim/kg/constants.R: 6d96164e9721c0cf75aa781a1597a552
    src/sim/kg/timing.R: 145b353488bd511e87f6ee66f22027a8

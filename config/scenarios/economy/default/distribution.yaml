# Distribution-table incidence conventions -- src/data/post_processing/corp_alloc.R
#
# A state channel: who bears burdens in the reporting tables.

_channel:
  role: state

corp_foreign_share:
  value: 0.40
  kind: sourced
  citation: >
    Foreign-borne share of the corporate burden, excluded from the distribution
    tables under the JCT convention (JCX-14-13 excludes 20.6% as foreign-borne;
    CBO, OTA and TPC instead allocate 100% to US households). Value is the
    foreign share of total US corporate equity -- FDI plus portfolio, publicly
    traded plus closely held -- at 42% end-2022 (Rosenthal and Mucciolo, Tax
    Notes Federal 183, 2024-04-01), rounded down.
  note: >
    The denominator includes S corporation equity that foreigners are barred from
    holding, which biases the C corporation share down. The labor leg takes no
    haircut: wage incidence lands on US workers whoever owns the equity. So the
    tables do not sum to the corporate revenue line, and the remainder is
    foreign-borne. It equals corp.theta_res by coincidence; they are separate
    values.

housing_structure_share:
  value: 0.70
  kind: judgment
  note: >
    Structure share of owner-occupied housing. In the Harberger model the mobile
    capital margin is reproducible structures rather than residential land, a fixed
    factor whose incidence runs through capitalization, so owner-occupied housing
    enters the all-capital base as this share of net home equity. 0.70 is a national
    average: the BEA current-cost net stock of residential structures is between two
    thirds and low seventy percent of the Fed's owner-occupied real estate
    aggregate, which is broader in including vacant land and mobile homes. A
    placeholder pending a split that varies by record or geography. Sensitivity
    cases are 0.60, and 1.00 for no land split.

# Wealth bathtub and wealth-tax avoidance -- src/sim/wealth_dynamics.R
#
# Economy-leg TRANSMISSION channel: how above-baseline during-life tax flows
# are financed out of wealth and drain into the estate and capital-income
# bases. The avoidance entries below are module-only and get inlined into
# their module file later in the rebuild.

_channel:
  role: transmission

avoid_public_e:
  value: -7
  kind: judgment
  note: >
    Semi-elasticity of REPORTED marketable (publicly valued) wealth with respect
    to the marginal wealth rate: reported stock scales by exp(mtr_net_worth * e).
    Author-accepted, seeded from the standalone Wealth-Tax-Simulator, and
    described in the module header as uncalibrated. Large enough to matter for
    any wealth-tax score -- a priority for the sensitivity ranking.

avoid_private_e:
  value: -17
  kind: judgment
  note: >
    Same, for closely held (privately valued) wealth, where valuation discretion
    is greater. Author-accepted, uncalibrated, and the largest single
    behavioral magnitude in the model. See avoid_public_e.

#-------------------------------------------------------------------------------
# Structural
#-------------------------------------------------------------------------------

chi_pub:
  value: 1.0
  kind: structural
  note: >
    Share of the public-wealth avoidance response that is CONCEALMENT (and so
    shrinks the income and estate bases too) rather than pure valuation.
    Default 1.0: marketable wealth that disappears from the reported balance
    sheet is treated as concealed consistently across bases (hidden-ledger
    R1-R7).

chi_priv:
  value: 0.5
  kind: structural
  note: >
    Same for closely held wealth. Default 0.5, i.e. half of the private-wealth
    response is concealment and half is valuation discretion that does not move
    the income base. Sweep 0.25 / 0.5 / 0.75 for the cross-base interaction
    rows.

cap_flows_pt_weight:
  value: 0.2
  kind: structural
  note: >
    Weight on pass-through flows in the capital-income bundle, for both the MTR
    bump and the wealth haircut (pure-capital flows carry 1.0). Matches the raw
    pass-through list in src/data/economy.R -- change both together. Also
    consumed by the corporate channel via wealth_cap_flows_pt_weight().

financing_profile:
  value: default
  kind: calibrated
  pointer_root: config/calibrations/wealth_profiles
  set: '2026-07-07'
  target: >
    Persistent-flow anchor calibration of the saving surface
    s(age, net-worth percentile) = 1 - MPC out of a PERSISTENT net income
    change (not the one-year transitory MPC): bridge formula
    s(p) = 1 - eps * (C/Y)(p) with eps ~ 0.7 (Straub 2019) and C/Y shares from
    Mian-Straub-Sufi (2021), cross-checked against the Fagereng-Holm-Natvik
    transitory-MPC gradient. Wealth-rank anchors run s ~ 0.10 at the bottom
    decile to 0.80 at the top percentile, age-tilted (full surface spans
    [0.04, 0.80] across 18-80 x 100 cells, monotone in percentile). Memo:
    other/wealth_dynamics/default_s_calibration.md.
  derived_under:
    macro_projections: '2026022522'
  invalidated_by:
    - config/calibrations/wealth_profiles/default/s.csv
    - config/calibrations/wealth_profiles/default/M.csv
    - src/sim/wealth_dynamics.R
    - other/wealth_dynamics/write_profiles.py
  invalidated_by_hashes:
    config/calibrations/wealth_profiles/default/s.csv: 05e353bfd1a82c9135a4af1b07ebac8f
    config/calibrations/wealth_profiles/default/M.csv: f69080edc998607de4a401f01cecc732
    src/sim/wealth_dynamics.R: 4cf373fa49833303076f2a09b76291f7
    other/wealth_dynamics/write_profiles.py: 305966e8951bef5126d9463022014965
  rederive: other/wealth_dynamics/write_profiles.py
  # src/sim/wealth_dynamics.R's hash was re-pinned 2026-07-25 after the
  # profile-spec refactor (it reads economy.wealth.financing_profile instead of
  # the retired s / wealth_financing columns). Verification came first: the P3b
  # gate suite -- six reference simulations, byte-identical to the pre-redesign
  # golden vintages -- is what licensed the re-pin. Only the dependency hash
  # moved; the calibration itself is untouched, so `set` stays 2026-07-07.
  note: >
    Value is a POINTER to a profile folder under config/calibrations/wealth_profiles/<name>/
    (s.csv = per-cell saving share; M.csv = within-age transition matrix,
    absent means identity). 'none' disables the channel; 'flat:<s>' is the
    flat-share shorthand (constant s, identity M). This entry replaces the
    retired `s` and `wealth_financing` runscript columns and the
    WEALTH_DYN_PROVENANCE warn-only stamp. Generated by s_default() in
    other/wealth_dynamics/write_profiles.py.

n_pctiles:
  value: 100
  kind: structural
  role: state
  note: >
    Number of equal-weighted-headcount within-age net-worth percentile bins the
    bathtub's cells are cut into. Absorbed 2026-07-26 from the retired
    config/wealth/wealth_financing_params.yaml.

fmax:
  value: 0.9
  kind: structural
  note: >
    Symmetric per-record gross-asset shrink clamp, |f| <= fmax. The clamp lets
    cuts (a negative deficit) scale wealth up and hikes scale it down. It is
    around 1% of wealth in normal operation, so it rarely binds, but it can
    bind for low-net-worth high-income payers. Absorbed 2026-07-26 from the
    retired config/wealth/wealth_financing_params.yaml.

r_total_additive_delta:
  value: 0.0
  kind: structural
  note: >
    Additive shift (in decimal percentage points) applied to the whole
    r_total(t) path, for a one-time external sensitivity test. The central path
    is nominal GDP-per-capita growth read per year from Macro-Projections
    (projections.csv gdp_c), never a flat peak. A default of 0 leaves
    production runs untouched; there is no standing multi-run sweep. Absorbed
    2026-07-26 from the retired config/wealth/wealth_financing_params.yaml.

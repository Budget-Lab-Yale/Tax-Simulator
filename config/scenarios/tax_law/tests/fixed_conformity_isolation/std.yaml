---
# Test overlay for config/runscripts/tests/fixed_conformity_isolation.csv:
# doubles the standard deduction from TY2022 so that federal taxable income
# and the itemize/standard choice move for every unit. A fixed-conformity
# state (S44) must not see it; a rolling state must.

value_single:
  value:
    '2014': 3000
    '2018': 12000
    '2022': 24000
    '2026': 31500
  i_measure: default
  i_base_year: default
  i_direction: default
  i_increment: default

value_head:
  value:
    '2014': 4400
    '2018': 18000
    '2022': 36000
    '2026': 47250
  i_measure: default
  i_base_year: default
  i_direction: default
  i_increment: default

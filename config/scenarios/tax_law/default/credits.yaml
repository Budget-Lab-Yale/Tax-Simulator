---

# Whether to repeal Foreign Tax Credit
repeal_ftc:
  value: 0

# Whether to repeal residential energy credits. The input file carries the
# residential clean energy credit (IRC 25D) and the energy efficient home
# improvement credit (IRC 25C) as one amount. OBBBA ends both after 2025: 25C
# for property placed in service after 31 December 2025 (sec. 70505, 25C(i)),
# 25D for expenditures made after that date (sec. 70506, 25D(h)).
repeal_res_energy:
  value:
    '2014': 0
    '2026': 1
  
# Whether to repeal credit for the elderly/disabled
repeal_old:
  value: 0
  
# Whether to repeal general business credits
repeal_gbc:
  value: 0
  
# Whether to repeal all other nonrefundable credits
repeal_other:
  value: 0


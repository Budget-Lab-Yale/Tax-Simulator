---
indexation_defaults:
  i_measure:
    '1987': cpi
    '2017': chained_cpi
  i_base_year:
    '2014': 1987
    '2018': 2017
    '2026': 2024
  i_direction: -1
  i_increment: 50

filing_status_mapper:
  value:
    '1': value_single
    '2': value_single * 2
    '3': value_single
    '4': value_head
  bonus:
    '1': bonus_single
    '2': bonus_married
    '3': bonus_married
    '4': bonus_single
  bonus_other:
    '1': bonus_other
    '2': bonus_other * 2
    '3': bonus_other
    '4': bonus_other * 1.5

# Base value for single filers
value_single:
  value:
    '2014': 3000
    '2018': 12000
    '2025': 15750
  i_measure: default
  # IRC 63(c)(7) as amended by OBBBA sec. 70102: the 2025 amount is set in
  # statute and is not indexed. Later years index from a 2024 base.
  i_base_year:
    '2014': 1987
    '2018': 2017
    '2025': NA
    '2026': 2024
  i_direction: default
  i_increment: default
  
# Base value for HOH filers
value_head:
  value:
    '2014': 4400
    '2018': 18000
    '2025': 23625
  i_measure: default
  # As value_single. Rounding to $50 would make the 2025 amount $23,600.
  i_base_year:
    '2014': 1987
    '2018': 2017
    '2025': NA
    '2026': 2024
  i_direction: default
  i_increment: default

# Elderly/blind bonus for single filers
bonus_single:
  value: 750
  i_measure: default
  i_base_year: 1987
  i_direction: default
  i_increment: default

# Elderly/blind bonus for joint filers  
bonus_married:
  value: 600
  i_measure: default
  i_base_year: 1987
  i_direction: default
  i_increment: default
  
# Minimum standard deduction for dependent returns
dep_floor:
  value: 500
  i_measure: default
  i_base_year: 1987
  i_direction: default
  i_increment: default
  
# Amount of bonus deduction added to earned income for dependent returns 
dep_earned_bonus:
  value: 250
  i_measure: default
  i_base_year: 1997
  i_direction: default
  i_increment: default

# Additional other bonus
bonus_other:
  value: 
    '2014': 0

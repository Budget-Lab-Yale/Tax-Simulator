---
# Idaho: tax rate schedule (Form 40 line 20; Idaho Code 63-3024). Rates apply
# to Idaho taxable income. Brackets are CPI-indexed annually (63-3024(2));
# thresholds transcribed per year from the STC published rate schedules and
# the Form 40 packets (tax-table endpoints cross-checked).
#
# Four regimes:
#   2017:      seven brackets 1.6/3.6/4.1/5.1/6.1/7.1/7.4%
#   2018-2020 (HB463): seven brackets 1.125/3.125/3.625/4.625/5.625/6.625/6.925%
#   2021      (HB380): five brackets 1.0/3.1/4.5/5.5/6.5%
#   2022      (HB436): four brackets 1.0/3.0/4.5/6.0%
#   2023+     (2022 1st E.S. HB1): FLAT with an indexed zero bracket -- tax =
#     rate x max(0, taxable income - subtraction). The statutory $2,500/$5,000
#     subtraction is CPI-indexed like the old brackets: 4,489/8,978 (2023,
#     5.8%), 4,673/9,346 (2024 HB521, 5.695%), 4,811/9,622 (2025 HB40, 5.3%).
#     Do NOT hard-code the statutory base amounts.
# 2026+: carries the 2025 rate and thresholds (no enacted change as of
# 2026-07-23; thresholds index annually -- documented carry-forward).
#
# Filing-status mapping is unusual: MFS uses the SINGLE schedule and HoH uses
# the MARRIED schedule (tax-table column "Married Filing Jointly or Head of
# Household", verified every packet); married thresholds = exactly 2x single.
# 10-element uniform schedule; padded by repeating the top rate/threshold.

filing_status_mapper:
  brackets:
    '1': brackets_single
    '2': brackets_married
    '3': brackets_single
    '4': brackets_married

rates:
  value:
    '2017': [0.016, 0.036, 0.041, 0.051, 0.061, 0.071, 0.074, 0.074, 0.074, 0.074]
    '2018': [0.01125, 0.03125, 0.03625, 0.04625, 0.05625, 0.06625, 0.06925, 0.06925, 0.06925, 0.06925]
    '2021': [0.010, 0.031, 0.045, 0.055, 0.065, 0.065, 0.065, 0.065, 0.065, 0.065]
    '2022': [0.010, 0.030, 0.045, 0.060, 0.060, 0.060, 0.060, 0.060, 0.060, 0.060]
    '2023': [0.0, 0.058, 0.058, 0.058, 0.058, 0.058, 0.058, 0.058, 0.058, 0.058]
    '2024': [0.0, 0.05695, 0.05695, 0.05695, 0.05695, 0.05695, 0.05695, 0.05695, 0.05695, 0.05695]
    '2025': [0.0, 0.053, 0.053, 0.053, 0.053, 0.053, 0.053, 0.053, 0.053, 0.053]
  reference: 'Idaho Code 63-3024; STC Individual Income Tax Rate Schedule page (2017-2025); 2018 HB463; 2021 HB380; 2022 HB436; 2022 1st E.S. HB1 ch.1 (flat 5.8% TY2023); 2024 HB521 ch.237 (5.695%); 2025 HB40 ch.13 (5.3%); Form 40 line 20 worksheets 2023-2025'


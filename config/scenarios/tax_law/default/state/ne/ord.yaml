---
# Nebraska rate schedule (Neb. Rev. Stat. 77-2715.03; Form 1040N line 15, from
# the Tax Calculation Schedule).
#
# Four brackets throughout. The bottom two rates have not moved since 2013;
# what moves is the TOP rate, under the LB 754 (2023) ramp:
#   2017-2022  6.84%
#   2023       6.64%
#   2024       5.84%
#   2025       5.20%
#   2026       4.55%, and this is the first year the THIRD bracket is also cut
#              (77-2715.03(2)(c)(v), Form 1040N-ES 2026 p.6)
# The statutory 2027 rate is 3.99% but its thresholds are unpublished, so 2026
# is the last encoded year and its values carry forward.
#
# Thresholds are indexed annually and transcribed per year from the DOR
# "History of Individual Income Tax Rates by Brackets" (Rev. 2-2026), which
# covers 2014-2024. TY2025 is not in that chronology and was taken from
# PolicyEngine, then ARITHMETIC-VERIFIED against three published 2025-booklet
# worksheet constants ($3,566 single / $3,088 MFJ / $3,276 HoH of tax at
# $77,760), which reproduce to the dollar only with these thresholds and the
# 5.20% top rate. Held flat after 2026 -- vector families have no indexation
# precedent in any encoded state.
#
# THE 2017-ONLY ADDITIONAL TAX (77-2715.03(1)(b)) is a graduated-rate-benefit
# recapture keyed to federal AGI, and the NY supplemental-tax machinery is
# exactly the right shape for it. The identity confirms it: for a single filer
# the published maximum is 0.0684 x 29,830 - T(29,830) = 2,040.37 - 1,184.38 =
# 855.99, to the cent; for MFJ, 0.0684 x 59,660 - T(59,660) = 1,712.01 against
# a published 1,712.02 (one cent of rounding). The DOR chronology's footnote 12
# says the schedule "is not applicable for tax years 2018 through 2025", so it
# is Inf from 2018 with no reactivation -- it keys on the federal personal
# exemption, which OBBBA permanently repealed, so it should stay inapplicable
# (an inference, not a cited DOR statement).

filing_status_mapper:
  brackets:
    '1': brackets_single
    '2': brackets_joint
    '3': brackets_single
    '4': brackets_head
  recapture_agi_start:
    '1': recap_start_single
    '2': recap_start_joint
    '3': recap_start_mfs
    '4': recap_start_head
  recapture_width:
    '1': recap_width_single
    '2': recap_width_joint
    '3': recap_width_mfs
    '4': recap_width_head


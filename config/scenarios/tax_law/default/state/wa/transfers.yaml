---
# WFTC amounts and limits through 2025 are exact published values. Later years
# are held at 2025 pending the annual Washington DOR amount update.
wftc_min_age:
  value: 25
  reference: 'RCW 82.08.0206(2)(a), qualifying-child-free claimant age requirement: https://app.leg.wa.gov/Rcw/default.aspx?cite=82.08.0206'
wftc_max_age:
  value: 64
  reference: 'RCW 82.08.0206(2)(a), qualifying-child-free claimant age requirement'
wftc_mfs_eligible:
  value:
    '2017': 0
    '2023': 1
  reference: 'Washington Working Families Tax Credit eligibility, married filing separately eligible beginning in 2023: https://workingfamiliescredit.wa.gov/eligibility'
wftc_inv_inc_limit:
  value:
    '2017': 0
    '2022': 10300
    '2023': 11000
    '2024': 11600
    '2025': 11950
  reference: 'Washington DOR Working Families Tax Credit annual application instructions; mirrors federal EITC investment-income limit'
wftc_phaseout_width:
  value: [2500, 5000, 5000, 5000]
  reference: 'RCW 82.08.0206(4), phaseout width by number of qualifying children'
wftc_max_amount:
  value:
    '2017': [0, 0, 0, 0]
    '2022': [300, 600, 900, 1200]
    '2023': [315, 625, 940, 1255]

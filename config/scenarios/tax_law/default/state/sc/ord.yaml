---
# South Carolina: tax rate schedule (SC1040TT; S.C. Code 12-6-510). ONE schedule
# for every filing status (SC1040TT: "for any filing status"). SC publishes a
# subtraction-method schedule: tax = top_rate x TI - C. Encoded here as the
# equivalent graduated bracket schedule; brackets are multiples of the annually
# indexed 0% ceiling (12-6-520 chained-CPI indexing).
#
# Two regimes:
#   2017-2021: six brackets 0/3/4/5/6/7 %, thresholds at 1x..5x the 0% ceiling.
#   2022+ (2022 reform): three brackets 0 / 3 / top %, top rate cut annually on
#     a revenue trigger: 6.5% (2022) -> 6.4% (2023) -> 6.2% (2024, skipped 6.3)
#     -> 6.0% (2025 floor). For the reform years the 3%->top boundary (element 3)
#     is calibrated so the model reproduces the EXACT published constant C
#     ((top-0.03)*B1 + 0.03*B0 = C); the 0% ceiling B0 is the indexed value.
# 10-element uniform schedule; padded by repeating the top rate/threshold.
# No filing-status bracket mapper (single schedule).

rates:
  value:
    '2017': [0.0, 0.03, 0.04, 0.05, 0.06, 0.07, 0.07, 0.07, 0.07, 0.07]
    '2022': [0.0, 0.03, 0.065, 0.065, 0.065, 0.065, 0.065, 0.065, 0.065, 0.065]
    '2023': [0.0, 0.03, 0.064, 0.064, 0.064, 0.064, 0.064, 0.064, 0.064, 0.064]
    '2024': [0.0, 0.03, 0.062, 0.062, 0.062, 0.062, 0.062, 0.062, 0.062, 0.062]
    '2025': [0.0, 0.03, 0.060, 0.060, 0.060, 0.060, 0.060, 0.060, 0.060, 0.060]
  reference: 'SC1040TT rate schedules 2017-2025 (dor.sc.gov); S.C. Code 12-6-510; 2022 reform top rate 6.5% then annual trigger reductions to 6.0% floor by TY2025'

brackets:
  value:

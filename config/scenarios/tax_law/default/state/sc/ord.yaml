    '2023': [0.0, 3350.0, 16750.0, 16750.0, 16750.0, 16750.0, 16750.0, 16750.0, 16750.0, 16750.0]
    '2024': [0.0, 3460.0, 17350.0, 17350.0, 17350.0, 17350.0, 17350.0, 17350.0, 17350.0, 17350.0]
    '2025': [0.0, 3600.0, 17800.0, 17800.0, 17800.0, 17800.0, 17800.0, 17800.0, 17800.0, 17800.0]
  reference: 'SC1040TT 2017-2025; pre-2022 brackets = 1x..5x the indexed 0% ceiling; reform-year element-3 boundary calibrated to the exact published constant C (658/670/659/642). Reform-year 0% ceiling B0 is the indexed value [+/- $10-50, per SCDOR indexing]'

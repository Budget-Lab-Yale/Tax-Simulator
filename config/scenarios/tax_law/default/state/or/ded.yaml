documented_not_modeled:
  ty2021_refundable_credit_offsets:
    reference: 'In TY2021 the federally-refundable child tax credit and child and dependent care credit reduced the Oregon subtraction, as did the recovery rebate credits in TY2020 and TY2021. Those are one- and two-year items tied to temporary federal refundability and are not encoded [overstates the Oregon subtraction, so understates Oregon tax, for families with large 2021 credits]'
  accrual_and_amended_returns:
    reference: 'The subtraction is on the accrual basis and uses the liability shown on the ORIGINAL federal return; a later federal audit or amendment changes the Oregon subtraction for the year the additional tax is PAID, via a separate OR-17 worksheet. A cross-sectional model cannot see amendment history'
  special_oregon_medical_and_itemizing:
    reference: 'The special Oregon medical subtraction (ORS 316.693) interacts with itemizing, and Schedule OR-A''s medical line uses Oregon''s own floor. Only the federal post-floor medical amount is available [see agi.yaml]'
  mfs_itemizing_coupling:
    reference: 'A married-filing-separately filer whose spouse itemizes gets a $0 standard deduction, "even if the standard deduction is more than your itemized deductions". The spouse''s election is not observable, so the ordinary standard deduction is allowed [understates Oregon tax for the affected separate filers]'
  zero_standard_deduction_cases:
    reference: 'The standard deduction is $0 for non-citizens without permanent resident status (who may still itemize) and for short-period returns. Neither status is a model input'

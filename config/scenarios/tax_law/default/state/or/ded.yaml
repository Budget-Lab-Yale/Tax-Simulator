---
# Oregon: deductions (Form OR-40 lines 10, 16-18; Schedule OR-A).
#
# Oregon's standard deduction is small and INDEXED, and its itemize election
# is fully INDEPENDENT of the federal one: "You can claim Oregon itemized
# deductions even if you're claiming the standard deduction on your federal
# return" (OR-17 2025 p.94). Oregon's own schedule removes state and local
# income tax, which is why so many Oregon filers itemize for Oregon only.
#
# The FEDERAL TAX LIABILITY SUBTRACTION sits at line 10, among the
# subtractions rather than the deductions, but it reaches taxable income by
# the same route and is carried here through the shared fed_tax_ded
# component. Two things make Oregon's version distinct from Missouri's and
# Alabama's: the ceiling is a dollar cap that is itself CUT IN FIVE STEPS by
# federal AGI, and the federal EARNED INCOME CREDIT is the one refundable
# credit that does NOT reduce it.

filing_status_mapper:
  std_amount:
    '1': std_single
    '2': std_joint
    '3': std_single
    '4': std_head
  std_aged_addl:
    '1': aged_single
    '2': aged_other
    '3': aged_other
    '4': aged_single
  std_blind_addl:
    '1': aged_single
    '2': aged_other
    '3': aged_other
    '4': aged_single
  fed_tax_ded_band_upper1:
    '1': ftd_b1_single
    '2': ftd_b1_joint
    '3': ftd_b1_single
    '4': ftd_b1_joint
  fed_tax_ded_band_upper2:
    '1': ftd_b2_single
    '2': ftd_b2_joint
    '3': ftd_b2_single
    '4': ftd_b2_joint
  fed_tax_ded_band_upper3:
    '1': ftd_b3_single
    '2': ftd_b3_joint
    '3': ftd_b3_single
    '4': ftd_b3_joint
  fed_tax_ded_band_upper4:
    '1': ftd_b4_single
    '2': ftd_b4_joint
    '3': ftd_b4_single
    '4': ftd_b4_joint
  fed_tax_ded_band_upper5:
    '1': ftd_b5_single
    '2': ftd_b5_joint
    '3': ftd_b5_single
    '4': ftd_b5_joint
  fed_tax_ded_band_cap1:
    '1': ftd_cap_full
    '2': ftd_cap_full
    '3': ftd_cap_mfs
    '4': ftd_cap_full
  fed_tax_ded_band_cap2:
    '1': ftd_cap2_full
    '2': ftd_cap2_full
    '3': ftd_cap2_mfs
    '4': ftd_cap2_full
  fed_tax_ded_band_cap3:
    '1': ftd_cap3_full
    '2': ftd_cap3_full
    '3': ftd_cap3_mfs
    '4': ftd_cap3_full
  fed_tax_ded_band_cap4:
    '1': ftd_cap4_full
    '2': ftd_cap4_full
    '3': ftd_cap4_mfs
    '4': ftd_cap4_full
  fed_tax_ded_band_cap5:
    '1': ftd_cap5_full
    '2': ftd_cap5_full
    '3': ftd_cap5_mfs
    '4': ftd_cap5_full


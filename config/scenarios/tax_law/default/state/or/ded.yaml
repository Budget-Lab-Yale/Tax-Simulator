aged_single:
  value: 1200
  reference: 'OR-40 instructions, "Standard deduction -- Age 65 or older, or blind": "multiply the number of boxes checked by $1,200 if single or head of household filing status". Unchanged 2017-2025. The age test is turning 65 by January 1 of the following year, i.e. age 65 on December 31'
aged_other:
  value: 1000
  reference: 'Same note: "$1,000 for all other filers". Unchanged 2017-2025. A filer who is both 65+ and blind checks two boxes, and a joint return can reach four; the calculator counts aged and blind separately, reproducing that'

std_dependent_style:
  value: 1
  reference: 'OR-40 instructions, "Standard deduction -- Dependents who can be claimed on another taxpayer''s return": the larger of earned income plus the add-on (capped at the filing-status maximum) or the floor'
std_dependent_floor:
  value:
    '2017': 1050
    '2019': 1100
    '2022': 1150
    '2023': 1250
    '2024': 1300
    '2025': 1350
  reference: 'OR-40 instructions dependent standard deduction note, each year'
std_dependent_earned_add:
  value:
    '2017': 350
    '2022': 400
    '2024': 450
  reference: 'OR-40 instructions dependent standard deduction note, each year'

#-----------------------------------------------------------------------
# Itemized deductions (Schedule OR-A).
#-----------------------------------------------------------------------

item_allowed:
  value: 1
  reference: 'Schedule OR-A "Oregon Itemized Deductions" (Form OR-40 line 16); before TY2018 the same amounts were reported on a federal Schedule A completed for Oregon purposes'
item_coupling:
  value: 0
  reference: 'OR-17 2025 p.94: "You may claim either Oregon itemized deductions or Oregon''s standard deduction, whichever is larger... You can claim Oregon itemized deductions even if you''re claiming the standard deduction on your federal return." OR-40 Instr. 2017 p.14 says the same thing pre-Schedule OR-A. A genuinely independent, better-of election'
salt_addback:
  value: 1
  reference: 'Schedule OR-A removes state and local INCOME tax from the itemized total, because Oregon''s federal-tax-liability subtraction already accounts for income taxes paid; sales tax is likewise not deductible. Property taxes remain'

#-----------------------------------------------------------------------
# Federal tax liability subtraction (Form OR-40 line 10; ORS 316.680,
# 316.685, 316.695).
#-----------------------------------------------------------------------

fed_tax_ded:
  value: 1
  reference: 'ORS 316.680/316.685/316.695; OR-17 2025 p.71: "Oregon allows a subtraction for your current year''s federal income tax liability after credits... The subtraction is limited to income tax. This includes alternative minimum tax, tax on an IRA, and recapture taxes. You can''t include self-employment tax or Social Security (FICA) tax." The worksheet''s line 1 is Form 1040 line 22 -- "your federal tax liability after nonrefundable credits but before other taxes" -- so alternative minimum tax is IN and self-employment, tips FICA and household employment taxes are OUT. Accrual basis: the liability shown on the original return, regardless of when paid'
fed_tax_ded_less_excess_ptc:
  value: 1
  reference: 'Federal tax worksheet line 2 removes any advance premium tax credit repayment. It reaches 1040 line 22 through Schedule 2 Part I, but Oregon''s subtraction is "limited to income tax", so it comes back out -- unlike Missouri and Alabama, which both leave it in'
fed_tax_ded_less_rebate:
  value:
    '2017': 0
    '2020': 1
    '2022': 0
  reference: '2020 Form OR-40 instructions, line 10 worksheet step 8: "Enter any 2020 federal economic stimulus payments you received in 2020 or 2021, plus your recovery rebate credit, if any (Form 1040 or 1040-SR, line 30)", added into the total that reduces the deductible federal tax at step 9. The 2021 booklet carries the same line for the third payment ("Enter any 2021 federal economic stimulus payments you received in 2021 plus your recovery rebate credit ... Refer to your IRS Notice 1444-C"), and the 2020 booklet summary at p.5 states it plainly: "Your federal income tax subtraction may be reduced by any 2020 federal economic stimulus payments you received in 2020 or 2021." NOTE the base is the full ENTITLEMENT -- advance payments received PLUS any rebate credit still claimed on line 30 -- not just the line 30 credit, which is why the model reads it off the calculated `rebate` rather than a return line. Set only for TY2020-TY2021, the two years the worksheet carries the line; no economic stimulus existed in the other window years, and whether ORS 316.680 would reach a FUTURE rebate as a general refundable-credit offset is not something the booklets settle'
fed_tax_ded_less_ed_ref:
  value: 1
  reference: 'Federal tax worksheet lines 6-9 reduce the subtraction by refundable credits: OR-17 2025 p.71, "Federal income tax credits, except for the EITC, reduce your federal tax subtraction." The refundable American Opportunity credit is among them'
fed_tax_ded_less_ptc:
  value: 1
  reference: 'Same worksheet lines; the net premium tax credit (Form 8962 line 24) reduces the subtraction'
# fed_tax_ded_less_eitc is deliberately NOT set. The federal earned income
# credit is the single named EXCEPTION to the rule that federal credits reduce
# the subtraction (OR-17 2025 p.71). Missouri and Alabama both subtract it, so
# this is the one place Oregon's base is more generous than theirs.
# fed_tax_ded_less_ctc_ref is likewise not set for the ordinary years; the
# refundable child credit only reduced the subtraction in TY2021, when it was
# refundable federally, and that one year is documented rather than encoded.

fed_tax_ded_band_base:
  value: 1
  reference: 'OR-17 2025 p.71 and the booklets'' Table 4/5: the further limitation is "based on your AGI", federal AGI from Form OR-40 line 7'


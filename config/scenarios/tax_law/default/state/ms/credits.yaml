---
# Mississippi: credits (Form 80-105 line 20; Form 80-401).
#
# NO CREDIT IS REFUNDABLE IN ANY YEAR. Mississippi has no earned income
# credit -- a verified negative, not merely something unfound: the only
# "earned income" string in any of the nine booklets is the FEDERAL credit
# borrowed as an eligibility test inside the Reforestation Credit, and no
# earned income credit code appears in the TAX CREDIT CODES table in any
# year.

eitc_match:
  value: 0
  reference: 'Verified negative across all nine booklets TY2017-TY2025: no Mississippi earned income credit exists, and no credit code for one appears in the TAX CREDIT CODES table. Stated explicitly to record the finding rather than leave it to a default'

cdctc_match:
  value:
    '2017': 0.0
    '2023': 0.25
  reference: 'Mississippi had NO child care credit before TY2023 -- the pre-2023 "Business Child/Dependent Care Credit" is an EMPLOYER credit, and the TY2017 booklet warns in bold that it is not the federal one. From TY2023 the credit is 25% of the federal child and dependent care credit, subject to a hard federal-AGI cliff at $50,000 with no carryover'
cdctc_refundable:
  value: 0
  reference: 'Nonrefundable, like every other Mississippi credit'

documented_not_modeled:
  child_care_credit_income_cliff:
    reference: 'The TY2023+ child care credit is denied outright above $50,000 of FEDERAL AGI -- a hard cliff, not a phase-out, and one of only two places federal AGI appears on the Mississippi return. The cliff is not gated here [overstates the credit for filers above $50,000 of federal AGI with care expenses]'
  adoption_credit:
    reference: 'The Mississippi adoption credit runs $2,500 (TY2017), $5,000 (TY2018-TY2022), then from TY2023 $5,000 for an out-of-state adoption and $10,000 for a Mississippi one, with a five-year carryforward. Adoption is not a model input'
  pregnancy_resource_credit:
    reference: 'The pregnancy resource charitable contribution credit is BUSINESS-ENTERPRISE-only, despite often being described as an individual credit. Not applicable to household returns'
  gaming_withholding_not_creditable:
    reference: 'The 3% withholding on Mississippi casino winnings is a FINAL tax: the winnings are excluded from income and the withholding is not creditable against the income tax. It is therefore neither a credit nor a payment here -- see ord.yaml'
  certificated_credits:
    reference: 'Form 80-401 carries the credit for taxes paid to other states plus a long tail of certificated business credits. None is a broad income-conditioned credit reconstructible from the microdata'

---
# Hawaii rate schedule (HRS 235-51; N-11 line 27 via the Tax Table under
# $100,000 of taxable income and the Tax Rate Schedules at or above it) and
# the 7.25% alternative tax on net capital gain (HRS 235-51(f)).
#
# NOT inflation-indexed in any era: the 2018-2024 booklets print identical
# schedules dollar-for-dollar (row-by-row comparison of all 36 rows across
# the seven booklets), and 235-51 states fixed dollar tables.
#
# Eras: TY2017 has nine brackets (top 8.25%). Act 107 SLH 2017 reinstated
# the 9/10/11% brackets from TY2018 (twelve brackets). Act 46 SLH 2024
# (HB2404 CD1; DOTAX booklets cite it as "Act 45") widens the brackets in
# three enacted steps -- TY2025, TY2027, TY2029 -- with no rate change; the
# TY2025 step is cross-verified digit-for-digit against the printed 2025
# Tax Rate Schedules. NOTE the first Act 46 bracket step is TY2025, not
# TY2027 as the batch survey assumed.
#
# Twelve-element uniform schedules; the 2017 nine-bracket regime repeats
# its top bound so the 8.25% top rate runs to infinity. MFS uses the single
# schedule ("Schedule I: single taxpayers and married filing separate
# returns"); qualifying surviving spouses use the married schedule.
#
# The printed Tax Table (mandatory under $100,000) evaluates the schedule
# at the midpoint of $50-wide bands, rounded to whole dollars -- a
# documented rounding difference of at most ~$3 versus this continuous
# schedule (2017 booklet p.42 example verified).

filing_status_mapper:
  brackets:
    '1': brackets_single
    '2': brackets_joint
    '3': brackets_single
    '4': brackets_head
  kg_alt_floor:
    '1': kg_floor_single
    '2': kg_floor_joint
    '3': kg_floor_single
    '4': kg_floor_head

rates:
  value:
    '2017': [0.014, 0.032, 0.055, 0.064, 0.068, 0.072, 0.076, 0.079, 0.0825, 0.0825, 0.0825, 0.0825]
    '2018': [0.014, 0.032, 0.055, 0.064, 0.068, 0.072, 0.076, 0.079, 0.0825, 0.09, 0.10, 0.11]
  reference: 'HRS 235-51; 2017 Tax Rate Schedules (2017 booklet p.54, nine brackets to 8.25%); Act 107 SLH 2017 sec. 2 reinstates 9/10/11% from TY2018 (2018 booklet p.54); the rate ladder is unchanged by Act 46 (2025 booklet p.50 prints the same twelve rates)'

brackets_single:
  value:
    '2017': [0, 2400, 4800, 9600, 14400, 19200, 24000, 36000, 48000, 48000, 48000, 48000]
    '2018': [0, 2400, 4800, 9600, 14400, 19200, 24000, 36000, 48000, 150000, 175000, 200000]
    '2025': [0, 9600, 14400, 19200, 24000, 36000, 48000, 125000, 175000, 225000, 275000, 325000]
    '2027': [0, 14400, 19200, 24000, 36000, 48000, 125000, 175000, 225000, 275000, 325000, 400000]
    '2029': [0, 19200, 24000, 36000, 48000, 125000, 175000, 225000, 275000, 325000, 400000, 475000]
  reference: 'Schedule I (single and MFS): 2017 booklet p.54; 2018-2024 booklets (identical, e.g. 2018 p.54, 2024 p.48); TY2025 from Act 46 sec. 2, verified against the printed 2025 booklet p.50; TY2027 and TY2029 from Act 46 sec. 2 ("after December 31, 2026"/"after December 31, 2028") -- enacted future law, final step'
brackets_joint:
  value:
    '2017': [0, 4800, 9600, 19200, 28800, 38400, 48000, 72000, 96000, 96000, 96000, 96000]
    '2018': [0, 4800, 9600, 19200, 28800, 38400, 48000, 72000, 96000, 300000, 350000, 400000]
    '2025': [0, 19200, 28800, 38400, 48000, 72000, 96000, 250000, 350000, 450000, 550000, 650000]
    '2027': [0, 28800, 38400, 48000, 72000, 96000, 250000, 350000, 450000, 550000, 650000, 800000]
    '2029': [0, 38400, 48000, 72000, 96000, 250000, 350000, 450000, 550000, 650000, 800000, 950000]
  reference: 'Schedule II (married filing jointly and qualifying surviving spouses): same sources as brackets_single'
brackets_head:

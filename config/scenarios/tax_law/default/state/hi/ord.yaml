    '2017': [0, 3600, 7200, 14400, 21600, 28800, 36000, 54000, 72000, 72000, 72000, 72000]
    '2018': [0, 3600, 7200, 14400, 21600, 28800, 36000, 54000, 72000, 225000, 262500, 300000]
    '2025': [0, 14400, 21600, 28800, 36000, 54000, 72000, 187500, 262500, 337500, 412500, 487500]
    '2027': [0, 21600, 28800, 36000, 54000, 72000, 187500, 262500, 337500, 412500, 487500, 600000]
    '2029': [0, 28800, 36000, 54000, 72000, 187500, 262500, 337500, 412500, 487500, 600000, 712500]
  reference: 'Schedule III (heads of household): same sources as brackets_single'

# Alternative tax on capital gains (HRS 235-51(f); Tax on Capital Gains
# Worksheet, identical 2017-2025 apart from federal line references):
# ordinary-taxed income is the GREATER of (taxable income less Hawaii net
# capital gain) and the filing-status floor; the remainder is taxed at
# 7.25%, and the taxpayer pays the SMALLER of that total and the regular
# schedule tax. "Net capital gain" is the worksheet's smaller-of Hawaii net
# LTCG and Hawaii net capital gain (so short-term losses offset) --
# qualified dividends are NOT included (full-text-verified in the 2017,
# 2024 and 2025 booklets), which is exactly kg_pref. The worksheet's
# N-158 investment-interest offset (line 9) is unobservable and skipped
# (documented below). The floors were NOT changed by Act 46 (still printed
# in the 2025 booklet p.34)
kg_alt_rate:
  value: 0.0725
  reference: 'Tax on Capital Gains Worksheet line 16 "Multiply line 14 by 7.25%" (2017 booklet p.39; 2024 booklet p.33; 2025 booklet p.34); HRS 235-51(f)'
kg_floor_single:
  value: 24000
  reference: 'Worksheet line 12: $24,000 for single and married filing separately (all years 2017-2025)'
kg_floor_joint:
  value: 48000
  reference: 'Worksheet line 12: $48,000 for married filing jointly and qualifying surviving spouses (all years)'
kg_floor_head:
  value: 36000
  reference: 'Worksheet line 12: $36,000 for heads of household (all years)'

documented_not_modeled:
  kg_worksheet_n158_offset:
    reference: 'Worksheet line 9 subtracts the Form N-158 line 4e amount (net capital gain elected as investment income for the investment-interest deduction) from the alternative-rate base. The election is unobservable [overstates the alternative-rate benefit for electing filers; rare]'
  tax_table_midpoint_rounding:
    reference: 'Taxable income under $100,000 must use the printed Tax Table ($50 bands, schedule tax at the band midpoint rounded to whole dollars). The continuous schedule differs by at most ~$3 (2017 booklet p.42 example: MFJ $23,275 -> table $1,010 vs continuous $1,009.80)'

---
# Maine rate schedule (36 M.R.S. 5111 sub-secs 1-F/2-F/3-F; the annual MRS
# rate-schedule releases). Three brackets at 5.8% / 6.75% / 7.15% in every
# year 2017-2025 -- only the thresholds index (5403(4), chained CPI, lower
# and upper bounds carrying separate cumulative COLAs). MFS uses the single
# schedule; surviving spouses use the married schedule.
#
# The 2016 ballot-initiative 3% surcharge on income over $200,000 was
# repealed before taking effect (P.L. 2017 c. 284 Pt. D repealed 5111(6));
# the official 2017 schedule is titled "no surcharge" and none is encoded.
#
# TY2019 note: the standalone 2019 rate schedule is unobtainable (maine.gov
# 404, Wayback down at retrieval). The 2019 lower thresholds and all bases
# were verified against the official 2019 tax table; the HoH and MFJ UPPER
# thresholds ($77,550 / $103,400) are DERIVED from the verified single
# upper ($51,700) times the statutory 1.5/2.0 structure and the uniform
# top-bracket COLA -- flagged in the source packet.
#
# Thresholds are transcribed through TY2025 and held flat after (vector
# families carry no indexation; the VT convention) [understates ME tax in
# out-years as real income grows into the frozen brackets; revisit with
# each year's published schedule].

filing_status_mapper:
  brackets:
    '1': brackets_single
    '2': brackets_joint
    '3': brackets_single
    '4': brackets_head

rates:
  value: [0.058, 0.0675, 0.0715]
  reference: '36 M.R.S. 5111(1-F)/(2-F)/(3-F); every annual MRS rate schedule 2017-2025 (5.8%, 6.75%, 7.15%, unchanged)'


---
# Vermont rate schedule (32 V.S.A. 5822; IN-111 line 8, from the rate schedules
# in the instruction booklet). Five brackets in 2017; Act 11 of the 2018 special
# session cut to four and lowered every rate, and the four rates have not
# changed since. Thresholds are CPI-indexed annually per filing status.
#
# TRANSCRIPTION TRAP: from TY2023 the PRINTED married-filing-jointly schedule
# splits its first bracket at $75,000 -- an artifact of the tax TABLES covering
# income under $75,000, not a rate change. The economically distinct second
# threshold is 75,850 / 79,950 / 82,500, which is what is encoded here.
#
# Printed base-tax amounts are rounded to whole dollars, so a continuous
# schedule differs from the published one by at most $0.05 (test VT-1 lands
# $5,743.35 against the schedule's $5,743.30).
#
# Five-element uniform schedules; the four-bracket regimes repeat the top bound
# so the top rate still runs to infinity. Thresholds are transcribed through
# TY2025 and held flat after -- vector families have no indexation precedent in
# any encoded state [understates VT tax in out-years as real income grows into
# unindexed brackets; revisit with each year's published schedule].

filing_status_mapper:
  brackets:
    '1': brackets_single
    '2': brackets_joint
    '3': brackets_mfs
    '4': brackets_head

rates:
  value:
    '2017': [0.0355, 0.0680, 0.0780, 0.0880, 0.0895]
    '2018': [0.0335, 0.0660, 0.0760, 0.0875, 0.0875]
  reference: '32 V.S.A. 5822(a); IN-111 rate schedules 2017 (3.55/6.80/7.80/8.80/8.95%) and 2018-2025 (3.35/6.60/7.60/8.75%, unchanged across the eight years) following Act 11 of the 2018 special session'


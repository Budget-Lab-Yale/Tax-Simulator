---
# North Dakota: tax rate schedule (Form ND-1; N.D.C.C. 57-38-30.1). Rates apply
# to ND taxable income (line 18 = federal taxable income + additions
# - subtractions). Brackets are inflation-indexed annually (57-38-30.3 indexing)
# and are transcribed per year from the ND-1 rate schedules/tax tables.
#
# Two regimes:
#   2017-2022: five brackets 1.10 / 2.04 / 2.27 / 2.64 / 2.90 %
#   2023+ (HB1158, 68th Assembly): three tiers 0 / 1.95 / 2.50 %, large zero
#     bracket. Rate structure constant within each regime; only thresholds move.
# 10-element uniform schedule; padded by repeating the top rate/threshold.
# MFS has its own (non single/2) schedule, so brackets are filing-status mapped.

filing_status_mapper:
  brackets:
    '1': brackets_single
    '2': brackets_married
    '3': brackets_mfs
    '4': brackets_head

rates:
  value:
    '2017': [0.011, 0.0204, 0.0227, 0.0264, 0.029, 0.029, 0.029, 0.029, 0.029, 0.029]
    '2023': [0.0, 0.0195, 0.025, 0.025, 0.025, 0.025, 0.025, 0.025, 0.025, 0.025]
  reference: 'ND-1 rate schedules/tax tables 2017-2025 (tax.nd.gov); HB1158 (2023) three-tier 0/1.95/2.50% from TY2023; N.D.C.C. 57-38-30.1'


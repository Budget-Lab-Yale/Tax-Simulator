---
# North Dakota: credits. ND has NO state EITC and NO state CTC (never enacted).
# Its individual credits are all nonrefundable. Two are encoded -- the HB 1515
# resident tax relief credit and the MARRIAGE PENALTY CREDIT (both below) -- and
# the rest are not representable in a PUF:
#   - Family Member Care Credit (57-38-01.20): 20-30% of qualified care expense
#     for an elderly/disabled family member, cap $2,000/member, $4,000/return.
#   - Credit for tax paid to another state; Renaissance zone; planned-gift;
#     seed/angel investment; etc.
# See research/source_packets/nd.md for the known-differences rationale. Both
# encoded credits were originally recorded here as not representable and both
# calls were reversed after cross-model triage showed each to be the dominant
# residual of a failing window -- HB 1515 on 2026-08-11, the marriage penalty
# credit on 2026-08-22.

# Explicit no-op: ND has no earned-income credit (documents the absence)
eitc_match:
  value: 0
  reference: 'ND has no state EITC (no ND-1/ND-1TC EITC line, any year)'

# Resident tax relief credit (HB 1515, 2021 special session; N.D.C.C.
# 57-38-30.3 note): a nonrefundable $350 per taxpayer/spouse ($700 MFJ)
# credit against TY2021 and TY2022 tax, claimed on Form ND-1 — an
# on-return liability credit, NOT a mailed rebate, so it belongs in our
# liability concept. Originally documented-not-modeled as "one-time";
# reversed 2026-08-11 after cross-model triage showed it as the entire
# PE 2021-22 wedge (flat +350/700 masses; PE models it; clean 0.46-0.48
# vs 0.86-0.87 in 2023-24). Encoded via the KY exempt_credit machinery
exempt_credit_style:
  value: 1
  reference: 'HB 1515 (2021); Form ND-1 (2021/2022) tax relief credit line'
exempt_credit_personal:
  value:
    '2017': 0
    '2021': 350
    '2023': 0
  reference: 'HB 1515: $350 per taxpayer and spouse (MFJ $700), nonrefundable, residents, TY2021-2022 only'

# ---- Marriage penalty credit (N.D.C.C. 57-38-01.28, Form ND-1 line 22) ----
#
# Encoded 2026-08-22, reversing the "not PUF-representable" call. The Marriage
# Penalty Credit Worksheet in the Form ND-1 instructions is arithmetically the
# SAME mechanism as Minnesota's Schedule M1MA credit, so it reuses the generic
# mc_* family with no new calculator code:
#
#   line  1  ND taxable income                       -> st_txbl_inc
#   line  2  gate: line 1 more than T1               -> mc_min_joint_txbl
#   line  4  smaller of the two qualified incomes    -> pmin(ei1, ei2)
#   line  5  gate: line 4 more than T2               -> mc_min_lesser_income
#   line  6  line 4 less the single allowance        -> mc_share_offset
#   lines 7+9  SINGLE-schedule tax on each share     -> mc_single_brackets
#   line 10  MFJ-schedule tax on line 1              -> the unit's own brackets
#   line 12  line 10 less lines 7+9
#   line 13  maximum credit                          -> mc_max
#
# ND's ordinary rates do NOT vary by filing status in any year 2017-2025
# (verified against build_state_tax_law), which is the precondition for the
# shared-rates generic: only the brackets differ between the two schedules.
#
# Two documented deviations from the worksheet, both shared with Minnesota:
#   - The eligibility gates are applied INCLUSIVELY (>=) by the generic where
#     the worksheet says "more than" (>). It binds only on a unit landing
#     exactly on a whole-dollar threshold.
#   - Statutory "qualified income" is per-spouse wages and net self-employment
#     income PLUS the taxable portions of Social Security and IRA/pension/
#     annuity distributions. Only the first two are observable per spouse, so
#     ei1/ei2 proxies the concept and the credit is understated for couples
#     whose qualified income is substantially retirement income. TAXSIM-35 has
#     the same limitation (its crosswalk receives per-spouse WAGES only), which
#     is what made the credit representable at all. See
#     research/state_tax/cross_model/nd_marriage_credit_probe.md
mc_style:
  value: 1
  reference: 'N.D.C.C. 57-38-01.28; Marriage Penalty Credit Worksheet, Form ND-1 instructions, all years 2017-2025. NOT repealed (HB 1388 repeal failed 2025)'


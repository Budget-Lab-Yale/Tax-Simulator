---
# Minnesota: rate schedule (Form M1; Minn. Stat. 290.06 subd. 2c). Four
# rates all years: 5.35 / 7.05 (6.80 from TY2019) / 7.85 / 9.85 percent.
# Brackets chained-CPI-indexed annually (270C.22), transcribed per year from
# the booklet rate schedules (2018/2021 cross-checked against the DOR
# "Income Tax Calculations" algorithm sheets; 2024-2025 against the DOR
# inflation memos). MFS = exactly half the MFJ thresholds every year.
# The printed tax table's $100-midpoint rounding (and zero tax on the first
# $20) is a few-dollar artifact ignored by the continuous schedule.
# 10-element uniform schedule; padded by repeating the top rate/threshold.
# 2026+ carries 2025 (indexed in law; documented carry-forward).

filing_status_mapper:
  brackets:
    '1': brackets_single
    '2': brackets_married
    '3': brackets_mfs
    '4': brackets_head


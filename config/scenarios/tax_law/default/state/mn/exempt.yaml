---
# Minnesota: exemptions. 2017: federal exemptions flow through the
# federal-taxable-income start (the M1M high-income exemption addback at
# MN's lower thresholds is NOT modeled -- known-difference, 2017 only).
# 2018: MN's own $4,150 personal + dependent exemptions (pre-TCJA
# structure). 2019+: DEPENDENT exemptions only (Minn. Stat. 290.0121),
# phased out 2% per $2,500 ($1,250 MFS), or fraction, of AGI over the
# filing-status threshold (gone once the excess tops $122,500/$61,250).

filing_status_mapper:
  po_thresh:
    '1': po_thresh_single
    '2': po_thresh_joint
    '3': po_thresh_mfs
    '4': po_thresh_head
  po_step:
    '1': po_step_regular
    '2': po_step_regular
    '3': po_step_mfs
    '4': po_step_regular

personal_amount:
  value:
    '2017': 0
    '2018': 4150
    '2019': 0
  reference: '2018 Form M1 line 5: 4,150 per filer/spouse (pre-TCJA structure); none 2019+ (290.0121 dependent-only); 2017 federal exemptions embedded in the starting point'

dep_amount:
  value:
    '2017': 0
    '2018': 4150
    '2019': 4250
    '2020': 4300
    '2021': 4350
    '2022': 4450
    '2023': 4800
    '2024': 5050
    '2025': 5200
  reference: 'M1 Worksheet for Line 5 per-dependent amounts, 2018-2025 (DOR memos 290.0121 subd. 1-2)'

po_type:
  value: 1
  reference: 'M1 Worksheet for Line 5: stepped reduction (2% per step), 2018-2025'

po_share_per_step:
  value: 0.02
  reference: 'Minn. Stat. 290.0121 subd. 2: exemption reduced 2% for each $2,500 ($1,250 MFS), or fraction thereof, of excess AGI'

po_step_regular:
  value: 2500
  reference: 'Same provision'

po_step_mfs:
  value: 1250
  reference: 'Same provision, MFS step'

po_thresh_joint:
  value:

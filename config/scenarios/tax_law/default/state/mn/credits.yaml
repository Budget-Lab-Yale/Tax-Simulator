---
# Minnesota: credits.
#   - Working Family Credit 2017-2022 (290.0671, Schedule M1WFC): an
#     independent EITC-analog encoded with the CalEITC-style triangular
#     machinery -- phase-in rate x earned income up to a cap, phased out on
#     the GREATER of earned income or AGI (the machinery's min-of-curves).
#     Refundable. 2017-18 federal-EIC eligibility gate approximated by the
#     age window alone [known-difference]; childless 64+ upper age limit
#     unmodeled [known-difference].
#   - 2023+ (HF1938, Schedule M1CWFC): combined CTC ($1,750 per child
#     under 18) + WFC (4% of capped earned income + fixed older-child
#     amounts) with ONE 12% joint phase-out (9% ONLY for older-child-only
#     units, M1CWFC line 13; childless = 12%)
#     on max(earned income, AGI) -- the new cwfc machinery. Refundable;
#     older children proxied by dependents aged 18-23; advance-payment/
#     minimum-credit timing ignored [documented].
#   - Marriage credit (290.0892, M1MA): joint-schedule tax less each
#     spouse's single-schedule tax on imputed shares; nonrefundable.
#   - Dependent care (290.067, M1CD): federal-formula credit capped above
#     the income threshold at $600/person (max 2) less 5% of excess AGI;
#     refundable. MN did NOT adopt the 2021 ARPA expansion -- our federal
#     2021 credit is ARPA-law [known-difference, 2021 only].
#   - Not modeled: K-12 education credit, student loan credit, 529 credit,
#     past-military-service credit, long-term-care credit (data limits);
#     renter's credit (2024+ ON the M1 via M1RENT -- no rent data;
#     STRUCTURAL totals difference from 2024, PolicyEngine includes it).

filing_status_mapper:
  earned_credit_phaseout_start1:
    '1': wfc_po_start_other1
    '2': wfc_po_start_mfj1
    '3': wfc_po_start_other1
    '4': wfc_po_start_other1
  earned_credit_phaseout_start2:
    '1': wfc_po_start_other2
    '2': wfc_po_start_mfj2
    '3': wfc_po_start_other2
    '4': wfc_po_start_other2
  earned_credit_phaseout_start3:
    '1': wfc_po_start_other3
    '2': wfc_po_start_mfj3
    '3': wfc_po_start_other3
    '4': wfc_po_start_other3
  earned_credit_phaseout_start4:
    '1': wfc_po_start_other4
    '2': wfc_po_start_mfj4
    '3': wfc_po_start_other4
    '4': wfc_po_start_other4
  cwfc_po_thresh:
    '1': cwfc_po_thresh_other
    '2': cwfc_po_thresh_mfj
    '3': cwfc_po_thresh_other
    '4': cwfc_po_thresh_other


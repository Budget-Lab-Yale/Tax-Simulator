# High-income itemized deduction limitation, Tax Law 615(f)/(g) (IT-196 line
# 46; identical tiers 2017-2026, keyed to NY AGI):
#   - 25% reduction phased in over item_limit_po_width above
#     item_limit_po_thresh (by filing status)
#   - a second 25% phased in over tier2_width above tier2_thresh
#     (flat 50% reduction above 525k = tier2_thresh + tier2_width)
#   - NYAGI > char_only_thresh1: deduction = char_only_share1 x charitable only
#   - NYAGI > char_only_thresh2: deduction = char_only_share2 x charitable only
item_limit_po_single:
  value: 100000
  reference: 'Tax Law 615(f)(1); 2024 IT-196-I Worksheet 3'
item_limit_po_joint:
  value: 200000
  reference: 'Tax Law 615(f)(1); 2024 IT-196-I Worksheet 3'
item_limit_po_head:
  value: 150000
  reference: 'Tax Law 615(f)(1); 2024 IT-196-I Worksheet 3'
item_limit_po_width:
  value: 50000
  reference: 'Tax Law 615(f)(1)'
item_limit_share1:
  value: 0.25
  reference: 'Tax Law 615(f)(1)'
item_limit_tier2_thresh:
  value: 475000
  reference: 'Tax Law 615(f)(2); 2024 IT-196-I Worksheet 4'
item_limit_tier2_width:
  value: 50000
  reference: 'Tax Law 615(f)(2)'
item_limit_share2:
  value: 0.25
  reference: 'Tax Law 615(f)(2)'
char_only_thresh1:
  value: 1000000
  reference: 'Tax Law 615(g)(1); 2024 IT-196-I Worksheet 5'
char_only_share1:
  value: 0.5
  reference: 'Tax Law 615(g)(1); in effect every year 2017-2026'
char_only_thresh2:
  value: 10000000
  reference: 'Tax Law 615(g)(2); 2024 IT-196-I Worksheet 6'
char_only_share2:
  value: 0.25
  reference: 'Tax Law 615(g)(2); extended through TY2029 (statute text at nysenate.gov)'

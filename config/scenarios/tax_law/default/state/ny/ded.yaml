---
# New York: deductions (Tax Law §615; Form IT-201-D through 2017, IT-196
# from 2018). Standard deduction amounts live here alongside itemized rules.
#
# TCJA decoupling (2018+): NY itemized = pre-TCJA federal Schedule A rules
# (§615(a): deductions "as such deductions existed immediately prior to the
# enactment of Public Law 115-97"), elected INDEPENDENTLY of the federal
# choice. 2017: NY itemizing required itemizing federally. No $10k SALT cap
# for NY; state/local income (or sales) tax is subtracted (IT-196 line 41),
# property tax fully deductible.

filing_status_mapper:
  std_amount:
    '1': std_single
    '2': std_joint
    '3': std_mfs
    '4': std_head
  pease_thresh:
    '1': pease_single
    '2': pease_joint
    '3': pease_mfs
    '4': pease_head
  item_limit_po_thresh:
    '1': item_limit_po_single
    '2': item_limit_po_joint
    '3': item_limit_po_single
    '4': item_limit_po_head

# Standard deduction (Tax Law §614; IT-201 line 34). Frozen at these values
# in every published year 2017-2025 (verified per-year); statute unamended
# for 2026. Not indexed in practice
std_single:
  value: 8000
  reference: 'Tax Law 614; IT-201-I Standard deduction table, verified each year 2017-2025'
std_joint:
  value: 16050
  reference: 'Tax Law 614; IT-201-I Standard deduction table, verified each year 2017-2025'
std_mfs:
  value: 8000
  reference: 'Tax Law 614; IT-201-I Standard deduction table, verified each year 2017-2025'
std_head:
  value: 11200
  reference: 'Tax Law 614; IT-201-I Standard deduction table, verified each year 2017-2025'

# Standard deduction for a single filer claimable as a dependent on another
# return (IT-201 item C); also the dependent-filer filing threshold
std_dependent:
  value: 3100
  reference: 'Tax Law 614; IT-201-I Standard deduction table (single, item C = Yes)'

# Whether itemized deductions are allowed at the state level
item_allowed:
  value: 1
  reference: 'NY Tax Law 615; Form IT-196'

# Itemized/standard coupling: 0 = independent choice, 1 = must match federal.
# 2017: NY itemizing required federal itemizing; 2018+: decoupled
item_coupling:
  value:
    '2017': 1
    '2018': 0
  reference: '2017 IT-201-I line 34; 2018+ IT-196-I p.1; Tax Law 615(a)'

# Documentation-only entries: transcribed from the forms for completeness but
# NOT read by the calculator (the parser skips this block). Citations are
# still enforced by the conventions test.
documented_not_modeled:
  # Whether NY itemized components follow pre-TCJA federal rules (misc
  # 2%-floor deductions allowed, pre-TCJA mortgage limits, no SALT cap).
  # Data-limited components (misc 2%) flagged in known-differences
  item_base_pre_tcja:
    value:
      '2017': 0
      '2018': 1
    reference: 'Tax Law 615(a); IT-196-I ("IRC as it existed before ... Public Law 115-97")'
  # Whether the federal $10k SALT cap applies to state itemized (it does not)
  salt_cap_applies:
    value: 0
    reference: 'IT-196-I p.2 ("not subject to this federal limit")'

# Whether state/local income (or sales) tax is subtracted from state itemized
salt_addback:
  value: 1
  reference: 'IT-196 line 41 subtraction adjustment A; Tax Law 615(c)(1); pre-2018 IT-201-D line 9'

# Pre-TCJA IRC 68 (Pease) overall limitation with NY-indexed thresholds
# (federal AGI). 2017 = federal Rev. Proc. 2016-55 amounts (NY piggybacked on
# the live federal limitation that year); NY-specific indexing from 2018.
# All years 2017-2025 verified from year-specific IT-196-I / 2017 IT-201-D
# instructions; projected years indexed by CPI off 2025
pease:

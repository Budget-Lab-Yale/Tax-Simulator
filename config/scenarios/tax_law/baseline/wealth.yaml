---
#-------------------------------------------------------------------------------
# Annual net-worth (wealth) tax law parameters. LAW ONLY.
#
# Baseline = NO wealth tax under current law: the exemption is Inf, so the
# taxable base max(net_worth - exemption, 0) is 0 for every record and
# liab_wealth is identically 0. Adding this file therefore leaves all existing
# output byte-identical (the dormancy guarantee).
#
# Consumed by calc_wealth() (src/calc/functions/tax/wealth.R) via the
# materialized net_worth column (economic Sigma assets - Sigma debts, no
# valuation discount). The graduated schedule is applied to net worth in
# EXCESS of the exemption, so bracket lower bounds start at 0.
#
# Reforms override exemption_single / exemption_head / rates / brackets at the
# subparameter level under public/{name}/wealth.yaml. The filing_status_mapper
# and indexation_defaults here carry over unless a reform changes them
# (subparameter-level merge, build_tax_law()).
#-------------------------------------------------------------------------------

# Default indexation for the exemption. Chained CPI (year-keyed, as the parser
# requires) off a 2025 base year, rounded to the NEAREST $1M (i_direction 0) —
# the standalone Wealth-Tax-Simulator convention (round(brackets, -6)),
# deliberately different from estate's floor (-1). The base year is the prior
# year by the model's COLA convention (an anchor value specified at year t with
# i_base_year t-1 comes out exactly in year t; cf. estate.yaml's 2026 regime).
# rates/brackets are nominal (unindexed), like estate's tentative schedule.
indexation_defaults:
  i_measure:
    '2024': chained_cpi
  i_base_year: 2025
  i_direction: 0
  i_increment: 1000000

# Exemption keyed by filing status (1 single / 2 MFJ / 3 MFS / 4 HoH). MFJ
# doubles the single exemption (the std.yaml convention); MFS and singles get
# the single amount; HoH gets its own. Baseline Inf => no wealth tax. The
# calculator reads the resulting filing-status-specific wealth.exemption column.
filing_status_mapper:
  exemption:
    '1': exemption_single
    '2': exemption_single * 2
    '3': exemption_single
    '4': exemption_head

# Single-filer exemption (also the MFS amount and, doubled, the MFJ amount).
# Baseline Inf (parsed to R Inf by parse_inf(); precedent eitc.yaml max_age).
exemption_single:
  value: Inf
  i_measure: default
  i_base_year: default
  i_direction: default
  i_increment: default

# Head-of-household exemption. Baseline Inf.
exemption_head:
  value: Inf
  i_measure: default
  i_base_year: default
  i_direction: default
  i_increment: default

# Graduated tax schedule on net worth in EXCESS of the exemption. Baseline: a
# single 0% bracket => no tax. Bracket lower bounds are measured on the
# post-exemption base (so they start at 0), fixed in nominal terms. The
# calculator reads however many bracket/rate elements the scenario supplies.
rates:
  value: [0]

brackets:
  value: [0]

---
# Niskanen housing menu: Deemed realization at death of all real estate gains (primary SS121-net + other residential + nonresidential RE), effective 1/1/2026.
# Paired with SS121 exclusion doubled to 500k/1m in 2026, chained-CPI indexed.
# Death regimes: 0=step-up (current law), 1=carryover, 2=deemed realization.

kg_death_regime_equities:
  value: 0

kg_death_regime_pass_throughs:
  value: 0

kg_death_regime_primary_home:
  value:
    '2014': 0
    '2026': 2

kg_death_regime_other_home:
  value:
    '2014': 0
    '2026': 2

kg_death_regime_re_fund:
  value:
    '2014': 0
    '2026': 2

# SS121 exclusion doubled from 2026 and chained-CPI indexed thereafter
# (anchor value in 2026 dollars; i_base_year = 2025 so the 2026 value is
# exact, per the estate.yaml exemption convention). Round down to $100.
kg_sec121_excl_single:
  value:
    '2014': 250000
    '2026': 500000
  i_measure:
    '1987': cpi
    '2017': chained_cpi
  i_base_year:
    '2014': NA
    '2026': 2025
  i_direction: -1
  i_increment: 100

kg_sec121_excl_married:
  value:
    '2014': 500000
    '2026': 1000000
  i_measure:
    '1987': cpi
    '2017': chained_cpi
  i_base_year:
    '2014': NA
    '2026': 2025
  i_direction: -1
  i_increment: 100

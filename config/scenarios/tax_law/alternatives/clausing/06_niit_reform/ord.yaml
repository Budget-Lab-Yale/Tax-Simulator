---
# Clausing reform — Policy 01: Ordinary rates
# Hybrid schedule starting in 2030:
#   - Keep OBBBA's 10% and 12% brackets (with their 2016 reindexation)
#   - Above OBBBA's top-of-12% threshold, splice in the OBRA-93 (1997)
#     upper-bracket schedule {28, 31, 36, 39.6} with original statutory
#     base years (1992 for 28/31, 1993 for 36/39.6)
# 2030 result: 6-bracket schedule {10, 12, 28, 31, 36, 39.6}.

indexation_defaults:
  i_measure:
    '1986': cpi
    '2017': chained_cpi
  i_base_year:
    '2014': [1992, 2002, 1992, 1992, 1993, 1993, 2012]
    '2018': [2017, 2017, 2017, 2017, 2017, 2017, 2017]
    '2026': [2016, 2016, 2016, 2017, 2017, 2017, 2017]
    '2030': [2016, 2016, 2016, 1992, 1993, 1993]
  i_direction:
    '2014': [-1, -1, -1, -1, -1, -1, -1]
    '2030': [-1, -1, -1, -1, -1, -1]
  i_increment:
    '2014': [50, 50, 50, 50, 50, 50, 50]
    '2030': [50, 50, 50, 50, 50, 50]

filing_status_mapper:
  brackets:
    '1': brackets_single
    '2': brackets_married
    '3': brackets_married / 2
    '4': brackets_head

# Ordinary tax rate schedule
rates:
  value:
    '2014': [0.1, 0.15, 0.25, 0.28, 0.33, 0.35, 0.396]
    '2018': [0.1, 0.12, 0.22, 0.24, 0.32, 0.35, 0.37]
    '2030': [0.1, 0.12, 0.28, 0.31, 0.36, 0.396]

# Brackets for ordinary-rate income, single filers
# 2030 thresholds (nominal anchors, before indexation):
#   $0      10% start
#   $9,525  12% start  — OBBBA, 2016 base
#   $38,700 28% start  — OBBBA top-of-12%, 2016 base (the seam)
#   $53,500 31% start  — OBRA-93 statutory, 1992 base
#   $115,000 36% start — OBRA-93 statutory, 1993 base
#   $250,000 39.6% start — OBRA-93 statutory, 1993 base
brackets_single:
  value:
    '2014': [0, 7000, 22100, 53500, 115000, 250000, 400000]
    '2018': [0, 9525, 38700, 82500, 157500, 200000, 500000]
    '2030': [0, 9525, 38700, 53500, 115000, 250000]
  i_measure: default
  i_base_year: default
  i_direction: default
  i_increment:
    '2014': [25, 25, 25, 25, 25, 25, 25]
    '2030': [25, 25, 25, 25, 25, 25]

# Brackets for ordinary-rate income, joint filers
brackets_married:
  value:
    '2014': [0, 14000, 44200, 89150, 140000, 250000, 450000]
    '2018': [0, 19050, 77400, 165000, 315000, 400000, 600000]
    '2030': [0, 19050, 77400, 89150, 140000, 250000]
  i_measure: default
  i_base_year: default
  i_direction: default
  i_increment: default

# Brackets for ordinary-rate income, head of household filers
brackets_head:
  value:
    '2014': [0, 10000, 29600, 76400, 127500, 250000, 425000]
    '2018': [0, 13600, 51800, 82500, 157500, 200000, 500000]
    '2030': [0, 13600, 51800, 76400, 127500, 250000]
  i_measure: default
  i_base_year: default
  i_direction: default
  i_increment: default

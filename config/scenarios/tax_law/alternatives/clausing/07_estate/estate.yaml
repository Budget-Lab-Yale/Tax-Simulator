---
#-------------------------------------------------------------------------------
# Clausing-Sarin stack, layer 7: estate tax — $5M exemption with a 45% top
# rate, effective for decedents dying in 2030+ (the package's common
# effective year).
#
# The exemption is $5M AS OF 2030 — anchored at 2030 with a 2029 base year —
# chained-CPI indexed forward, rounded down to $10k. The joint both-die path
# gets 2x ($10M per couple); portability is untouched (stays on).
#
# Pre-2030 law is current law restated identically to baseline (reform YAMLs
# replace subparameters wholesale): pre-TCJA, TCJA, and OBBBA $15M regimes.
#
# The §2001(c) ladder below $1M is unchanged (brackets not overridden); only
# the top rate moves 40% -> 45% from 2030. Since the exemption exceeds $1M,
# liability is 45% of the excess over the exemption.
#-------------------------------------------------------------------------------

exemption:
  value:
    '2014': 5340000
    '2018': 11180000
    '2026': 15000000
    '2030': 5000000
  i_measure:
    '2013': cpi
    '2018': chained_cpi
  i_base_year:
    '2014': 2013
    '2018': 2017
    '2026': 2025
    '2030': 2029
  i_direction: -1
  i_increment: 10000

rates:
  value:
    '2014': [0.18, 0.20, 0.22, 0.24, 0.26, 0.28, 0.30, 0.32, 0.34, 0.37, 0.39, 0.40]
    '2030': [0.18, 0.20, 0.22, 0.24, 0.26, 0.28, 0.30, 0.32, 0.34, 0.37, 0.39, 0.45]

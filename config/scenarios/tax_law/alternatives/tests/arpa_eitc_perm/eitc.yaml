---
# Stage 3 policy: the American Rescue Plan Act's 2021 childless-EITC expansion
# made PERMANENT from 2022, i.e. never allowed to expire.
#
# The baseline already encodes the expansion as a one-year provision -- every
# parameter below steps up at '2021' and back down at '2022'. This scenario
# keeps the 2021 values from 2022 onward and changes nothing else. It is the
# ARPA provisions ONLY: unlike public/booker-kypa, it does not add the
# prior-year earned-income election, which is a separate policy and would
# confound the comparison.
#
# Effective 2022 rather than 2026 so that three of the four years the
# DINA-vs-design-C comparison reports (2022, 2025, 2030) show the effect.
#
# READ THE RESULT WITH THE FILING MARGIN IN MIND. The model has no filing
# elasticity and no EITC arm in become_filer_*, so this reform induces ZERO
# new filers by construction. The credit accrues only to records already
# carrying filer == 1. The `reach_eitc` column reports what it cannot see.

# Phase-in rate for filers with no qualifying children (doubled)
pi_rate_0:
  value:
    '2014': 0.0765
    '2021': 0.153

# Phase-out rate for filers with no children (doubled)
po_rate_0:
  value:
    '2014': 0.0765
    '2021': 0.153

# Earned income threshold at which the credit is maximized, no children
pi_end_0:
  value:
    '2014': 4220
    '2021': 9820
  i_measure: default
  i_base_year:
    '2014': 1995
    '2021': 2020
  i_direction: default
  i_increment: default

# AGI threshold at which the credit begins phasing out, no children
po_thresh_0:
  value:
    '2014': 5280
    '2021': 11610
  i_measure: default
  i_base_year:
    '2014': 1995
    '2021': 2020
  i_direction: default
  i_increment: default

# Maximum allowable investment income for eligibility
inv_inc_limit:
  value:
    '2014': 2200
    '2021': 10000
  i_measure: default
  i_base_year:
    '2014': 1995
    '2021': 2020
  i_direction: -1
  i_increment: 50

# Minimum age for eligibility (lowered to 19)
min_age:
  value:
    '2014': 25
    '2021': 19

# Maximum age for eligibility (cap removed)
max_age:
  value:
    '2014': 64
    '2021': Inf

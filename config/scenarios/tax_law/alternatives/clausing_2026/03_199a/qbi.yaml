# Clausing reform — Policy 03: Repeal of Section 199A (QBI deduction)
# Starting in 2026, set the deduction rate to 0 and zero out the OBBBA-era
# $400 minimum deduction (qbi_ded.R:171 applies pmax with min_value, so the
# minimum must also be repealed to fully eliminate the deduction).

# Deduction rate
rate:
  value:
    '2014': 0.0
    '2018': 0.2
    '2026': 0.0

# Minimum deduction amount
min_value:
  value:
    '2014': 0
    '2026': 0
  i_measure:
    '1987': cpi
    '2017': chained_cpi
  i_base_year: 2025
  i_direction: 0
  i_increment: 5

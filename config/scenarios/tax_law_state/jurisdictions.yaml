---
# Runtime registry for the state-tax module. `states = all` resolves only to
# enabled entries here, not to every directory under baseline/.
AK:
  profile: zero
  enabled: true
AZ:
  profile: broad_iit
  enabled: true
# CA is calculated correctly under the federal baseline, but its fixed/selective
# conformity groups (1, 2) have no reference-law bridge yet
# (conformity_groups.yaml: ready=false), so validate_state_federal_conformity()
# hard-stops any federal-reform run that requests CA. Excluded from `states=all`
# until the reference overlays land, per ca_p1_readiness_analysis.md. Direct
# `states=CA` selection still works for baseline-law runs.
CA:
  profile: broad_iit
  enabled: false
CO:
  profile: broad_iit
  enabled: true
# CT is rolling conformity (group 0): the CT base starts from current-law
# federal AGI, so no reference-law bridge is needed
CT:
  profile: broad_iit
  enabled: true
# DE is rolling conformity (30 Del. C. 1101/1105 reference federal AGI under
# the IRC with no fixed date), so group 0 with no reference-law bridge needed
DE:
  profile: broad_iit
  enabled: true
FL:
  profile: zero
  enabled: true
GA:
  profile: broad_iit
  enabled: true
# ID re-enacts IRC conformity every session, retroactively to Jan 1 of (or
# following) the tax year -- verified in every packet 2017-2025, incl. TY2025
# conforming to the Jan 1, 2026 IRC (capturing OBBBA). Unlike SC's frozen
# past date, Idaho never lags current law at filing time, so it is modeled
# as rolling (group 0); the one-session enactment lag is documented in
# baseline/id/agi.yaml documented_not_modeled
ID:
  profile: broad_iit
  enabled: true
IL:
  profile: broad_iit
  enabled: true
IN:
  profile: broad_iit
  enabled: true
# KS conforms to the IRC as in effect for the tax year (K.S.A. 79-32,109),
# i.e. rolling (group 0)
KS:
  profile: broad_iit
  enabled: true
KY:
  profile: broad_iit
  enabled: true
# MD state-level tax only; the county piggyback (2.25-3.3%) is deferred to
# the locality phase. Cross-model: TAXSIM's MD siitax EXCLUDES the county
# tax (probe-verified); PolicyEngine's state_income_tax INCLUDES it, so the
# harness requests PE's state-only md_income_tax (pe_state_tax.py)
MD:
  profile: broad_iit
  enabled: true
MI:
  profile: broad_iit
  enabled: true
# MN conformity is fixed-date but updated regularly (Dec 31 2018 by the
# 2019 act, May 1 2023 by the 2023 act); the current gap's AGI-level
# footprint on PUF individuals is minimal (OBBBA marquee items are
# below-AGI and MN carries its own deduction stack), so MN is modeled as
# rolling (group 0) with the M1NC caveat documented in baseline/mn/agi.yaml
MN:
  profile: broad_iit
  enabled: true
NH:
  profile: narrow_investment_iit
  enabled: true
NV:
  profile: zero
  enabled: true
NY:
  profile: broad_iit
  enabled: true
NC:
  profile: broad_iit
  enabled: true
ND:
  profile: broad_iit
  enabled: true
# OH conformity is fixed-date via ORC 5701.11 but updated at least annually
# with a taxpayer election for the prior version; treated as rolling
# (group 0) like KY/IN/MI
OH:
  profile: broad_iit
  enabled: true
# PA is an own-base state (start_point 0): its eight income classes have no
# IRC linkage at all, so conformity is moot (group 0 trivially). Federal
# credits feeding the PA CDCTC/WPTC matches are scenario outputs by design
PA:
  profile: broad_iit
  enabled: true
# RI starts from federal AGI as defined in the IRC with no fixed date
# (R.I.G.L. 44-30-12(a)), so rolling conformity (group 0)
RI:
  profile: broad_iit
  enabled: true
# SC uses fixed-date IRC conformity (updated annually; conformity_group 3,
# ready=false). Like CA, its reference-law bridge is not built, so it is
# excluded from states=all and blocked for federal-reform runs until the
# overlay lands. states=SC still works for baseline-law runs.
SC:
  profile: broad_iit
  enabled: false
SD:
  profile: zero
  enabled: true
TN:
  profile: narrow_investment_iit
  enabled: true
TX:
  profile: zero
  enabled: true
# UT starts from current federal AGI and its taxpayer tax credit references
# the deductions claimed on the current federal return (UC 59-10-1018), so
# rolling conformity (group 0) with no reference-law bridge needed
UT:
  profile: broad_iit
  enabled: true
# WI fixed-date conformity is updated by act with lags, but WI adopted TCJA
# whole from 2018 and the current gaps' AGI-level footprint is minimal;
# modeled rolling (group 0) with targeted items documented in
# baseline/wi/agi.yaml
WI:
  profile: broad_iit
  enabled: true
# VA was fixed-date annual conformity through TY2022 (group 3), rolling for
# TY2023-2025 (group 0), and re-fixed at Dec 31, 2025 by the 2026 GA (group
# 4). Groups 3/4 have no reference-law bridge, so VA is excluded from
# states=all and guarded for federal-reform runs (like SC/CA). Direct
# states=VA selection works for baseline-law runs.
VA:
  profile: broad_iit
  enabled: false
WA:
  profile: capital_gains_and_transfer
  enabled: true
# WV re-enacts its conformity date every session (W. Va. Code 11-21-9(a)),
# never lagging current law at filing time, so it is modeled as rolling
# (group 0) with the one-session enactment lag documented in
# baseline/wv/agi.yaml -- the ID treatment
WV:
  profile: broad_iit
  enabled: true
WY:
  profile: zero
  enabled: true

---
# New Mexico: entity-level tax election (NMSA 1978 7-3A-10, Oil and Gas
# Proceeds and Pass-Through Entity Withholding Tax Act).
#
# Law: HB 102 (Laws 2022 ch. 46, signed 3/8/2022) enacted 7-3A-10 for TY2022
# and, in sections 1-2 (NMSA 7-2-5.12 and 7-2A-4.1), made "Net income subject
# to the entity-level tax ... exempt from income tax" -- an owner EXCLUSION.
# HB 368 (2023, signed 4/5/2023) repealed 7-2-5.12 and 7-2A-4.1 and amended
# 7-3A-10(H) to give owners a REFUNDABLE CREDIT instead, adding the credit
# amount back into base income (7-2-2(B)), "for taxable years beginning on
# or after January 1, 2023" (HB 368 sec. 5). This resolves the credit-vs-
# exemption disagreement in ptet_state_law.md: exclusion in TY2022 only,
# credit from TY2023.
#
# Election: annual, by filing the entity-level tax return by the original or
# extended due date; binding on all owners (from 2023). No sunset found in
# either act. Not held by the parameters: 2022 exempt income was the entity's
# NM-apportioned distributed net income.
#

available:
  value:
    '2017': 0
    '2022': 1
  reference: 'NMSA 1978 7-3A-10(A) (Laws 2022 ch. 46 sec. 3, HB 102), https://nmlegis.gov/Sessions/22%20Regular/final/HB0102.PDF; as amended by HB 368 (2023), https://nmlegis.gov/sessions/23%20Regular/final/HB0368.PDF'
mandatory:
  value: 0
  reference: 'NMSA 7-3A-10(A): "may elect on an annual basis"'
method:
  value:
    '2017': 0
    '2022': 2
    '2023': 1
  reference: 'TY2022 exclusion: HB 102 (2022) secs. 1-2 ("Net income subject to the entity-level tax is exempt from income tax"). TY2023+ credit: HB 368 (2023) sec. 3 amending 7-3A-10(H) ("An owner ... may be allowed a tax credit in an amount equal to the owner''s share of the tax") and sec. 4 repealing NMSA 7-2-5.12 and 7-2A-4.1; sec. 5 applicability to taxable years beginning on or after 1/1/2023; TRD Bulletin B-300.24 (owners may claim a credit beginning with tax year 2023)'
rate:
  value:
    '2017': 0.049
    '2021': 0.059
  reference: 'NMSA 7-3A-10(C): "the higher of the maximum tax rate imposed pursuant to Section 7-2-7 NMSA 1978 [individual] or the maximum tax rate imposed pursuant to Section 7-2A-5 NMSA 1978 [corporate] for the taxable year" (HB 102 (2022) and HB 368 (2023) text). Both maxima are 5.9% for 2022+; equals max(st_ord.rates) in baseline/nm/ord.yaml. Pre-2022 values inert'
rate_tracks_top:
  value: 1
  reference: 'NMSA 7-3A-10(C) (higher of individual and corporate top rates; the individual 5.9% top is not below the corporate 5.9% top in any year encoded)'
# rate_scorp: omitted, so the schema default (NA) applies -- NA = same as rate (schema default)
#   reference: 'NMSA 7-3A-10(C)'
credit_share:
  value:
    '2017': 0
    '2023': 1
  reference: 'NMSA 7-3A-10(H) as amended by HB 368 (2023): credit equal to the owner''s share of the tax. 0 in TY2022 (exclusion year, method 2)'
credit_refundable:
  value:
    '2017': 0
    '2023': 1
  reference: 'NMSA 7-3A-10(H) as amended by HB 368 (2023): "If the amount of the credit exceeds the amount of the owner''s tax liabilities ... the excess shall be refunded to the owner"'
addback:
  value:
    '2017': 0
    '2023': 1
  reference: 'NMSA 7-2-2(B)(2)(b) as amended by HB 368 (2023) sec. 1: base income includes, for taxable years beginning on or after 1/1/2023, "an amount equal to the amount of credit claimed and allowed for that year pursuant to Section 7-3A-10". TY2022: no add-back, the income was exempt'
# Distributed net income is the amount allocated and apportioned to New
# Mexico under UDITPA for every owner -- no all-source base for residents
resident_scope:
  value: 2
  reference: 'NMSA 7-3A-10(D) (HB 102 (2022); HB 368 (2023)): distributed net income "shall equal the amount allocated and apportioned to New Mexico pursuant to the Uniform Division of Income for Tax Purposes Act"'
nonresident_scope:
  value: 2
  reference: 'NMSA 7-3A-10(D)'
# 7-2-13(A) credits tax a resident "is liable" for to another state; HB 368
# added only that the credit is computed without regard to the 7-3A-10
# credit. Whether an entity-paid tax of another state counts was not found
# in statute or TRD guidance
# resident_credit_for_other_state_ptet: omitted, so the schema default (NA) applies
#   reference: 'NMSA 7-2-13 as amended by HB 368 (2023) sec. 2 (silent on entity-paid taxes); TRD guidance not found'
surtax_rate:
  value: 0
  reference: 'No second entity-level layer'
surtax_credit_share:
  value: 0
  reference: 'No second entity-level layer'
local_rate:
  value: 0
  reference: 'No local income tax in New Mexico'
local_credit_share:
  value: 0
  reference: 'No local income tax in New Mexico'

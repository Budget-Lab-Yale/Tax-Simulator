---
# New Mexico: income base (PIT-1 lines 9-17, PIT-ADJ).
#
# START POINT CHANGES IN 2018, and the reason is load-bearing. PIT-1 builds
# base income as federal AGI, then subtracts the federal deduction ON THE
# RETURN (line 12) rather than inheriting it:
#   2017:  line 12 (deduction) AND line 13 (personal exemptions, post-PEP)
#          are both subtracted, which is exactly federal TAXABLE income, and
#          section 199A did not yet exist -- so start_point 2 is exact and
#          ded.yaml stays off.
#   2018+: line 12 is the standard/itemized deduction ONLY. The federal QBI
#          deduction and, from 2025, the OBBBA below-the-line deductions
#          (senior, tips, overtime, auto-loan interest) reduce federal
#          TAXABLE income but NOT New Mexico's base. A federal-taxable-income
#          start would silently grant all of them -- worth $304 (86% of the
#          liability) on test NM-3 alone and ~$980 for a filer with $100k of
#          QBI. So start_point 1 with the federal deduction rebuilt in
#          ded.yaml.
# Cost of the rebuild, stated plainly: ded.yaml duplicates a federal
# computation, so a federal STANDARD-deduction reform will not flow into NM
# (itemized reforms will, since components are calculated). ded.yaml mirrors
# std.yaml parameter-for-parameter including indexation, and
# test_nm_std_mirrors_federal() holds the two together.

start_point:
  value:
    '2017': 2
    '2018': 1
  reference: 'PIT-1 line 9 (federal adjusted gross income) less line 12 (federal standard or itemized deduction) and, in 2017 only, line 13 (federal exemption amount); NMSA 7-2-2(A) "base income". 2017 = federal taxable income exactly; 2018+ = federal AGI with the deduction rebuilt in ded.yaml'

conformity_group:
  value: 0
  reference: 'NMSA 7-2-2(A)/(S) define base income and net income by reference to the Internal Revenue Code with no fixed date -- rolling conformity -> conformity_groups.yaml group 0'

# Municipal bond interest: NM taxes interest on obligations of OTHER states
# and their subdivisions; New Mexico's own obligations stay exempt
add_exempt_int:
  value: 1
  reference: 'PIT-ADJ line 1 "Interest received on U.S. Government obligations" is a SUBTRACTION; NMSA 7-2-2(S) starts from federal taxable/AGI, which already excludes all municipal interest, so out-of-state interest is added back. PIT-ADJ instructions, 2017-2025'
own_state_exempt:
  value: 1
  reference: 'NMSA 7-2-2(S); New Mexico obligations remain exempt. The own-state share of exempt_int is unobserved -- the model applies the uniform 75% out-of-state convention (documented approximation, all states)'
sub_us_int:
  value: 1
  reference: 'PIT-ADJ line 1: interest on U.S. Government obligations is subtracted. The U.S.-obligation share of txbl_int is unobservable, so the flag is carried and no subtraction is taken [overstates NM tax for holders of Treasuries]'

# Social Security (7-2-5.14, HB 163 of 2022, TY2022+): federally taxable SS
# is FULLY exempt at or below the AGI limit and NOT AT ALL above it -- a hard
# cliff, not a phase-out. Verified in the 2022-2025 PIT-1 instructions
# (PIT-ADJ line 8 worksheet is a yes/no income test).
ss_full_sub_allages:
  value:
    '2017': 0
    '2022': 1
  reference: 'NMSA 7-2-5.14 (HB 163, Laws 2022 ch.47 s.3), effective TY2022; PIT-ADJ 2022-2025 instructions, Social Security income deduction'
# ss_allages_agi_limit is supplied by the filing_status_mapper below (the
# limit differs by status), so it is not declared here

# Net capital gains deduction (7-2-34): the GREATER of 100% of net capital
# gain up to a flat floor, or a share of net capital gain. Both legs are
# representable, so both are encoded (cap_gains_excl_flat is the greater-of
# alternative added 2026-08-12).
#   2017-2018: share 50%, floor $1,000
#   2019-2024: share 40%, floor $1,000
#   2025:      floor $2,500; the 40% survives ONLY for the sale of a New
#              Mexico business, an unobservable subset -> share 0
cap_gains_excl_share:
  value:
    '2017': 0.50
    '2019': 0.40
    '2025': 0.0
  reference: 'NMSA 7-2-34; PIT-ADJ instructions 2017/2018 ("50% of the net capital gain"), 2019-2024 ("40%"), 2025 (40% retained only for the sale of a New Mexico business, HB 547 Laws 2023 ch.211 s.4)'
cap_gains_excl_flat:
  value:
    '2017': 1000
    '2025': 2500
  reference: 'NMSA 7-2-34(A)(1): the taxpayer may deduct the greater of the flat amount or the percentage. $1,000 through TY2024, $2,500 from TY2025 (HB 547); PIT-ADJ instructions each year'

# Aged exemption (7-2-5.2): $8,000 per taxpayer 65 or older, allowed on a
# NINE-BAND AGI table that is bit-identical in the 2017, 2019 and 2025
# booklets. The calculator reduces the POOLED amount $1 per $1 above a
# threshold, so each threshold is anchored to put the pool at zero at the
# table's top bound -- for MFJ, at TWO qualifying spouses ($16,000 pooled,
# zero above $51,000).
# DOCUMENTED APPROXIMATION: a linear ramp replaces nine steps. Maximum error
# ~$1,500 of base (single) / $3,000 (joint) inside the band, and exactly zero
# outside $18,000-$51,000 of AGI. The joint anchor is a MODAL choice: a
# one-spouse-65 couple is understated by up to $3,000 of base. Re-anchoring to
# $43,000 would fix that case and overstate two-65+ couples by up to $8,000 of
# base, which is worse on the modal case.
age_ded_amount:
  value: 8000
  reference: 'NMSA 7-2-5.2; PIT-1 instructions "Exemption for persons 65 or older or blind", Table 2 (the $8,000 maximum per qualifying person). Table verified identical in the 2017, 2019 and 2025 booklets'
age_ded_min_age:
  value: 65
  reference: 'NMSA 7-2-5.2(A) (65 years of age or older). The BLIND branch of the same section is not modeled -- see documented_not_modeled'
# age_ded_po_thresh is supplied by the filing_status_mapper below
age_ded_po_base:
  value: 1
  reference: 'NMSA 7-2-5.2 Table 2 is keyed to federal adjusted gross income'

filing_status_mapper:
  ss_allages_agi_limit:
    '1': ss_limit_single
    '2': ss_limit_joint
    '3': ss_limit_mfs
    '4': ss_limit_joint
  age_ded_po_thresh:
    '1': age_po_single
    '2': age_po_joint
    '3': age_po_mfs
    '4': age_po_head

ss_limit_single:
  value:
    '2017': .inf
    '2022': 100000
  reference: 'NMSA 7-2-5.14(B)(1); PIT-ADJ 2022-2025 instructions (single, married filing separately excepted)'
ss_limit_joint:
  value:
    '2017': .inf
    '2022': 150000
  reference: 'NMSA 7-2-5.14(B)(3); married filing jointly, head of household, and surviving spouse'
ss_limit_mfs:
  value:
    '2017': .inf
    '2022': 75000
  reference: 'NMSA 7-2-5.14(B)(2); married filing separately'

age_po_single:
  value: 20500
  reference: 'Anchored so the $8,000 single pool reaches zero at $28,500, the top of the 7-2-5.2 Table 2 band for single filers (20,500 + 8,000). Not a form value -- see the approximation note above'
age_po_joint:
  value: 35000
  reference: 'Anchored so a two-65+ couple''s $16,000 pool reaches zero at $51,000, the top of the Table 2 married-filing-jointly band (35,000 + 16,000). Modal choice; not a form value'
age_po_mfs:
  value: 17500
  reference: 'Anchored so the $8,000 pool reaches zero at $25,500, the top of the Table 2 married-filing-separately band (half the joint band)'
age_po_head:
  value: 43000
  reference: 'Anchored so a single 65+ head of household''s $8,000 pool reaches zero at $51,000, the top of the Table 2 head-of-household band'

documented_not_modeled:
  lictr_low_income_comprehensive_tax_rebate:
    value: 819
    reference: 'NMSA 7-2-14; PIT-RC Table 1. Up to $819 REFUNDABLE (raised from $450 by HB 547, Laws 2023), keyed to a 25-band MODIFIED GROSS INCOME table crossed with exemption count. MGI (7-2-14(C)) adds TANF, SSI, general assistance, child support, gifts, inheritances, VA benefits and scholarships, and forbids netting losses -- none of which is observable, and it is not a tax-unit concept. Omitted [understates NM refunds for low-income filers by up to $819; EXPECT THIS TO DOMINATE the PolicyEngine comparison for low-income NM records]'
  medical_care_expense_deduction:
    reference: 'NMSA 7-2-37, sunset 12/31/2024. A deduction for a share of unreimbursed medical expenses (25% 2017-2018, 15% 2019-2021, 10% 2022-2024 per the PIT-ADJ instructions) whose base is unreimbursed expenses NOT limited by the federal AGI floor -- unobservable, since only the federal post-floor amount exists [overstates NM tax for filers with large medical expenses]'
  medical_credit_65plus:
    value: 2800
    reference: 'NMSA 7-2-18.11: a $2,800 credit for a taxpayer 65+ with $28,000 or more of unreimbursed medical expenses in the year. Same unobservable base as the deduction above'
  blind_branch_of_aged_exemption:
    reference: 'NMSA 7-2-5.2 grants the same $8,000 banded exemption to blind taxpayers of any age. blind1/blind2 are available but the calculator''s age_ded family has no blind branch, and st_exempt.blind_addl is a flat add-on with no income test [overstates NM tax for blind filers under 65]'
  armed_forces_retirement_exemption:
    reference: 'NMSA 7-2-5.11, TY2022+: $10,000 (2022), $20,000 (2023), $30,000 (2024+) of armed forces retirement pay. Military retirement is an unobservable subset of txbl_pens_dist'
  property_tax_rebate_and_child_day_care_credit:
    reference: 'NMSA 7-2-14.3 (property tax rebate for 65+, Los Alamos and Santa Fe county residents only) and 7-2-18.1 (child day care credit, keyed to provider payments and a per-child hourly cap). Neither base is observable; the property rebate is also sub-state'
  hundred_year_exemption:
    reference: 'NMSA 7-2-5.7: full exemption of income for taxpayers 100 years of age or older. Ages are top-coded well below 100'
  one_time_rebates_2021_2022_2023:
    reference: 'Laws 2021 ch.4, 2022 ch.47 s.1/ch.48, 2023 ch.211: mailed rebate checks, not credits against the return. Class P5 in cross_model/external_model_issues.md -- PolicyEngine books them into state_income_tax in the eligibility year. Pre-registered as an exclusion for the harness, not a difference in our encoding'

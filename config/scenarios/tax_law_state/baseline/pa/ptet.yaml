---
# Pennsylvania: NO pass-through entity tax. A PTET was dropped from SB 659
# (2024); SB 396 (2025, elective PTET) and SB 253 (2025, resident credit for
# other-state PTET paid by partnerships) were in Senate Finance in 2025;
# the 2024-25 budget did not include a PTET (BDO) and no enactment of either
# bill was found for the 2025-26 budget (signed 11/12/2025). Arkansas DFA's
# TY2026 list shows PA with no similar tax.
#
# All parameters are at their neutral no-PTET values except
# resident_credit_for_other_state_ptet, which matters for a Pennsylvania
# resident who owns an interest in another state's electing entity.
#

available:
  value: 0
  reference: 'No PTET: BDO, PA Budget ... Doesn''t Include PTET Election (2024), https://www.bdo.com/insights/tax/pa-budget-adjusts-nol-deduction-limits-sales-tax-exemptions-doesnt-include-ptet-election ; SB 396 (2025) not enacted as of search; Arkansas DFA TY2026 list https://www.dfa.arkansas.gov/wp-content/uploads/States_with_Similar_Tax_PET_2026.pdf'

mandatory:
  value: 0
  reference: 'No PTET'
method:
  value: 0   # none
  reference: 'No PTET'
rate:
  value: 0
  reference: 'No PTET'
rate_tracks_top:
  value: 0
  reference: 'No PTET'
# rate_scorp: omitted, so the schema default (NA) applies -- no PTET
#   reference: 'No PTET'
credit_share:
  value: 0
  reference: 'No PTET'
credit_refundable:
  value: 0
  reference: 'No PTET'
addback:
  value: 0
  reference: 'No PTET'
# resident_scope: omitted, so the schema default (NA) applies -- no PTET
#   reference: 'No PTET'
# nonresident_scope: omitted, so the schema default (NA) applies -- no PTET
#   reference: 'No PTET'

resident_credit_for_other_state_ptet:
  value: 0   # partnerships: no (DOR position); S corporations: see reference
  reference: 'PA DOR position (as described by PA Chamber memo supporting SB 253, 3/2025, https://www.pachamber.org/wp-content/uploads/2025/03/MEMO-to-Senate-Finance-Support-SB-253-and-SB-396-fixed.pdf, and PICPA): resident PARTNERS are not entitled to a resident credit (72 P.S. 7314) for entity-level taxes paid by a partnership to another state; SB 253 would allow it "similar to what is already allowed for S-corporation shareholders" -- so S-CORPORATION shareholders can receive a pass-through resident credit (PA-20S/PA-65 Statement of Resident Credits for Owners). Board of Finance and Revenue has granted the credit in individual TY2021 appeals. Encoded 0 for the partnership case; the S-corp case is 1. CORRECTION to ptet_state_law.csv, which says yes. Secondary sources only; no DOR bulletin was found'

surtax_rate:
  value: 0
  reference: 'No PTET'
surtax_credit_share:
  value: 0
  reference: 'No PTET'
local_rate:
  value: 0
  reference: 'PA local earned income taxes are not tied to any entity election'
local_credit_share:
  value: 0
  reference: 'PA local earned income taxes are not tied to any entity election'

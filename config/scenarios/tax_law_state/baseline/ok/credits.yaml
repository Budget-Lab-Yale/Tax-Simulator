---
# Oklahoma: credits (Form 511 lines 16-17; Schedules 511-F and 511-G).

# Earned income credit (68 O.S. 2357.43(A)): 5% of the federal credit,
# NONREFUNDABLE 2017-2021 and REFUNDABLE from TY2022 (HB 2962 of 2021 restored
# refundability).
eitc_match:
  value: 0.05
  reference: '68 O.S. 2357.43(A); Form 511 line 16 / Schedule 511-F instructions, 5% of the federal earned income credit in every year 2017-2025'
eitc_refundable:
  value:
    '2017': 0
    '2022': 1
  reference: 'Refundability was removed for TY2017-2021 and restored from TY2022 by HB 2962 (2021), which also froze the federal base (see documented_not_modeled)'

# Child care / child tax credit (68 O.S. 2357(B)(2); cite corrected 2026-10-07 from 2357.43, the EITC section): the GREATER of 20% of
# the federal child and dependent care credit and 5% of the federal child tax
# credit, denied outright above $100,000 of federal AGI. Both are
# nonrefundable.
#
# THE TWO LEGS ARE ALTERNATIVES, NOT A SUM. st_ctc and st_cdctc are added
# together by the calculator, so encoding both without the election would
# overstate every care-expense unit by min(20%CDCC, 5%CTC); encoding only the
# care leg would zero the credit for the far larger population of families with
# children and no care expenses. ctc_cdctc_greater_of zeroes the smaller leg,
# so both columns report what was actually claimed.
ctc_cdctc_greater_of:
  value: 1
  reference: '68 O.S. 2357(B)(2): "a credit equal to the GREATER of twenty percent (20%) of the credit for child care expenses or five percent (5%) of the child tax credit allowed on the federal return"'

# 5%-of-federal-CTC leg. Encoded through the tiered-share style with a SINGLE
# tier whose bound is the $100,000 cliff: a return at or under the bound takes
# the share, a return above it falls out of the tier ladder entirely and gets
# zero, which is exactly the statutory cliff. ctc_max_child_age 16 makes the
# style's under-age/under-17 ratio identically 1, so the credit is a clean 5%
# of the federal credit claimed rather than a share of it.
ctc_style:
  value: 1
  reference: '68 O.S. 2357(B)(2); Schedule 511-G. Style 1 = share of the federal child tax credit actually claimed'
ctc_tier1_bound:
  value: 100000
  reference: '68 O.S. 2357(B)(2): no credit is allowed where federal adjusted gross income exceeds $100,000. A single-tier ladder reproduces the cliff -- above the last bound the tier selector returns ineligible'
ctc_tier_shares:
  value: [0.05, 0.0, 0.0]
  reference: '68 O.S. 2357(B)(2): five percent of the federal child tax credit. Only the FIRST element is reachable -- one tier bound is declared, so an eligible return is always in tier 1 and an ineligible one is out of the ladder entirely. The trailing zeros exist because vector families are addressed by numbered element (shares1, shares2, ...), and a bare scalar would land in a suffix-less column the family reader cannot see'
ctc_max_child_age:
  value: 16
  reference: 'Matches the federal CTC qualifying-child age, so every CTC-qualifying child counts in both the numerator and the denominator of the style''s age ratio and the credit is exactly 5% of the federal amount'
ctc_refundable:
  value: 0
  reference: '68 O.S. 2357(B)(2): the credit may not exceed the tax, in every year'

# 20%-of-federal-CDCC leg, under the same $100,000 cliff. The cap machinery
# with a zero amount and a zero phase-out rate zeroes the credit above the
# threshold, which is the cliff.
cdctc_match:
  value: 0.20
  reference: '68 O.S. 2357(B)(2): twenty percent of the federal credit for child care expenses'
cdctc_refundable:
  value: 0
  reference: '68 O.S. 2357(B)(2): nonrefundable in every year'
cdctc_cap_thresh:
  value: 100000
  reference: '68 O.S. 2357(B)(2), the same $100,000 federal-AGI cliff that applies to the child-credit leg'
cdctc_cap_amount:
  value: 0
  reference: 'Zero above the threshold -- with cdctc_cap_po_rate also zero this is a cliff, not a phase-out, matching the statute'

# SALES TAX RELIEF CREDIT (68 O.S. 5010-5012; Form 538-S; Form 511
# "Oklahoma sales tax relief credit"): $40 REFUNDABLE per household member
# (taxpayer, spouse, dependents) when gross HOUSEHOLD income is $20,000 or
# less, or $50,000 or less for a household with a dependent, a member 65 or
# older, or a disabled member. Encoded 2026-10-13 on the generic per-person
# credit (decision S43). The income measure -- "the total amount of gross
# income received by ALL persons living in the same household whether the
# income was taxable or not", including public assistance, child support,
# workers' comp, VA disability, gross Social Security and dependents' income
# -- is approximated by federal AGI plus nontaxable Social Security plus
# exempt interest plus the hh_resources_inc optional data column (SSI/TANF/
# VA/child support; zero until a producer publishes it), so eligibility is
# OVERSTATED for households with nontaxable income and with non-unit
# household members [data-proxy; the crosswalk row carries it]. TANF
# receipt in any month disqualifies (unobserved). The disabled prong reads
# the disabled1/2 optional flag. Both external models grant the credit.
percap_amount:
  value: 40
  reference: '68 O.S. 5011: "Forty Dollars ($40.00) per exemption"; Form 538-S'
percap_refundable:
  value: 1
  reference: '68 O.S. 5011: refundable; Form 511 refundable-credits section'
percap_income_limit:
  value: 20000
  reference: '68 O.S. 5011: gross household income of $20,000 or less'
percap_income_limit_elig:
  value: 50000
  reference: '68 O.S. 5011: $50,000 or less if the taxpayer can claim a dependent, or is 65 or older, or is disabled'
percap_elig_age:
  value: 65
  reference: '68 O.S. 5011: "sixty-five (65) years of age or older"'
percap_elig_child_age:
  value: .inf
  reference: '68 O.S. 5011: any dependent qualifies for the $50,000 ceiling (no age limit)'
percap_elig_disabled:
  value: 1
  reference: '68 O.S. 5011: "disabled" -- reads the disabled1/2 optional data flag (S43)'
percap_add_nontax_ss:
  value: 1
  reference: 'Form 538-S instructions, gross household income includes Social Security payments (total including Medicare); the taxable part is already in AGI'
percap_add_exempt_int:
  value: 1
  reference: 'Form 538-S instructions: interest income whether taxable or not'
percap_unnet_losses:
  value: 1
  reference: 'Form 538-S instructions: gross household income is "the total amount of gross income received by all persons living in the same household", with negative amounts prohibited (source packet, Uncertainties 3), so a business, rental or capital loss cannot reduce it. Each loss is added back to federal AGI (shared unnetted_losses helper, Form 4797 ordinary losses included). PolicyEngine''s ok_gross_income likewise sums positive sources only. Encoded 2026-10-16 (cross-model triage, OK PE 2025: 12 loss records paid $40/person)'
percap_add_hh_resources:
  value: 1
  reference: 'Form 538-S instructions: public assistance, child support, workers compensation, VA disability -- the hh_resources_inc optional data column (S43)'

documented_not_modeled:
  property_tax_relief_credit_538h:
    value: 200
    reference: '68 O.S. 2904-2911; Form 538-H. Refundable, up to $200, for filers 65 or older or disabled with gross household income of $12,000 or less. Same household-gross-income measure as 538-S [understates Oklahoma refunds for low-income seniors; PolicyEngine models it]'
  frozen_ty2020_eitc_base:
    reference: 'HB 2962 (2021) restored refundability but froze the base at the federal credit "in effect for the 2020 income tax year". We apply 5% to the CURRENT federal credit instead of building reference-law machinery [OVERSTATES the Oklahoma EITC from TY2022. Plateau wedge = 5% x (current max - 2020 max): TY2022 $1.10/$7.45/$12.20/$13.75 for 0/1/2/3+ children, TY2023 $3.10/$20.55/$34.20/$38.50, TY2024 $4.70/$31.45/$52.00/$58.50, TY2025 $5.55/$37.20/$61.60/$69.30. Larger in the phase-out range since the frozen phase-out start is also unindexed, and the frozen $3,650 investment-income limit against $11,600 (2024) makes some federally eligible units entirely ineligible in Oklahoma where we pay the full 5%. Aggregate roughly 5-7% of a ~$42M/yr credit by 2024-2025]. TY2021 is deliberately NOT frozen -- no vintage clause existed then, so Oklahoma''s 5% applied to the ARPA-expanded credit'
  ok_agi_proration_of_eitc_and_child_credit:
    reference: 'Schedules 511-F and 511-G prorate both credits by the ratio of Oklahoma AGI to federal AGI, for FULL-YEAR residents, whenever Oklahoma AGI is lower -- i.e. anyone with a Social Security, retirement, military, tribal, 529 or out-of-state modification. No machinery scales a credit by a base ratio [overstates both credits for units with any Oklahoma subtraction. PolicyEngine models it; this is our-side]'
  credit_menu_511cr:
    reference: 'Credit for tax paid to another state, the Form 511-CR menu, the Parental Choice tax credit (TY2024+), the natural disaster credit, the Form 578 zero-emission credit, Form 573 farm income averaging, the HSA additional tax and IRC 965(h) installments: none modeled'

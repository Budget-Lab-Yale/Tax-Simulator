---
# Kansas credits (K-40 lines 13-18; 2025 renumbering).

# EITC: 17% of the federal credit, residents only, effectively fully
# refundable (the K-40 EITC worksheet splits a nonrefundable portion on
# line 17 and refunds the remainder on line 23)
eitc_match:
  value: 0.17
  reference: 'K.S.A. 79-32,205; 2017 booklet EITC worksheet ("multiply line 1 by 17%"); identical 17% worksheet in 2021/2024/2025 booklets'
eitc_refundable:
  value: 1
  reference: 'K-40 line 23 refundable portion of EITC; net benefit equals the full 17% match'

# CDCTC: match of the federal credit, nonrefundable, residents only.
# Repealed 2013-2017 (0%); SB 30 phase-in 12.5/18.75/25%; SB 1 sec. 21
# raises to 50% for TY2024+
cdctc_match:
  value:
    '2017': 0
    '2018': 0.125
    '2019': 0.1875
    '2020': 0.25
    '2024': 0.5
  reference: 'K.S.A. 79-32,111c; 2017 booklet has no care credit line; 2018 booklet "12.5%"; 2019 booklet "18.75%"; 2021/2023 booklets 25%; 2024/2025 booklets "multiply ... by 50%"; Notice 24-09'
cdctc_refundable:
  value: 0
  reference: 'K-40 line 14 reduces tax; no refundable line (unlike the EITC)'

# FOOD SALES TAX CREDIT (K.S.A. 79-32,271; K-40 "Food sales tax credit"
# line, 2017-2024 booklets): $125 per qualified exemption -- taxpayer,
# spouse and dependents UNDER 18 (no HoH extra exemption) -- NONREFUNDABLE,
# for full-year residents with federal AGI of $30,615 or less who are (a) 55
# or older all year, (b) blind or disabled, or (c) have a dependent child
# under 18 living in the home. Encoded 2026-10-13 on the generic per-person
# credit with its eligibility gate: percap_income_limit 0 makes eligibility a
# requirement, the eligible ceiling is the AGI limit, dependents count under
# 18, and the disabled prong reads the disabled1/2 optional data flag
# (decision S43; inert until a producer publishes it -- blind is a separate
# prong and is NOT used as a proxy, so blind-only claimants are missed).
# Age is year-end age, so "55 all year" is approximated by age >= 55 at
# year end [small overstatement for filers turning 55 during the year].
# Ends TY2025 (2025 booklet drops the line; food sales tax fully phased out
# 1/1/2025 per HB 2106). TAXSIM and PE model it.
percap_amount:
  value:
    '2017': 125
    '2025': 0
  reference: 'K.S.A. 79-32,271; K-40 food sales tax credit line and the 2017/2021/2024 booklet worksheets ($125 per qualified exemption); absent from the 2025 booklet'
percap_refundable:
  value: 0
  reference: 'K.S.A. 79-32,271 (2013+): nonrefundable, limited to tax liability; 2017-2024 booklets'
percap_income_limit:
  value: 0
  reference: 'K.S.A. 79-32,271: no credit unless the taxpayer is 55+, blind/disabled, or has a dependent child under 18 (the eligible ceiling below applies to those units; everyone else gets zero)'
percap_income_limit_elig:
  value: 30615
  reference: 'K.S.A. 79-32,271 and the 2017-2024 booklets: federal adjusted gross income of $30,615 or less (fixed in statute, not indexed)'
percap_elig_age:
  value: 55
  reference: 'K.S.A. 79-32,271: "55 years of age or older" (year-end age proxies "all year")'
percap_elig_child_age:
  value: 18
  reference: 'K.S.A. 79-32,271: a dependent child under 18 who resided with the taxpayer the entire year (residence unobserved; dependent status proxies it)'
percap_elig_disabled:
  value: 1
  reference: 'K.S.A. 79-32,271: totally and permanently disabled or blind -- reads the disabled1/2 optional data flag (S43); zero until published'
percap_dep_max_age:
  value: 18
  reference: 'K.S.A. 79-32,271: "qualified exemption" counts dependents under 18 only'
percap_after_eitc:
  value: 1
  reference: 'K-40 (2022 booklet ip22) lines 17-19: line 17 = the Kansas EITC up to the line 16 balance (remainder refunded on line 23), line 18 = food sales tax credit, line 19 = 16 - 17 - 18 "cannot be less than zero"; 79-32,271: taken after all other credits, nonrefundable, no carryforward. Cross-model 2026-10-13: every PE -250/-375 residual was an EITC claimant whose EITC exceeded the tax'

# Documented-not-modeled credits:
#   - Credit for taxes paid to another state (out-of-state income
#     unobservable); Pregnancy Resource Act credit (2024+); adoption,
#     historic preservation, community service (K-60), and other Schedule
#     K-xx business credits.
documented_not_modeled:

---
# Kansas: deductions (K.S.A. 79-32,119 standard; 79-32,120 itemized).
# Std vintages: 2013-2020 base; SB 50 (2021) raise; SB 1 (2024 s.s.) raise
# ("and all tax years thereafter"). MFS is half the joint amount per the
# forms (statute silent; PE notes the same). Aged/blind add-ons constant
# $850/$700 per instance (worksheet-verified 2017, 2021, 2024).

filing_status_mapper:
  std_amount:
    '1': std_single
    '2': std_married
    '3': std_married / 2
    '4': std_head
  std_aged_addl:
    '1': std_addl_single
    '2': std_addl_married
    '3': std_addl_married
    '4': std_addl_single
  std_blind_addl:
    '1': std_addl_single
    '2': std_addl_married
    '3': std_addl_married
    '4': std_addl_single

std_single:
  value:
    '2017': 3000
    '2021': 3500
    '2024': 3605
  reference: '2017/2019 booklets ($3,000); SB 50: 2021/2023 booklets ($3,500); SB 1 sec. 19 / Notice 24-08 / 2024-2025 booklets ($3,605); K.S.A. 79-32,119'
std_married:
  value:
    '2017': 7500
    '2021': 8000
    '2024': 8240
  reference: '2017/2019 booklets ($7,500); 2021/2023 booklets ($8,000); 2024-2025 booklets ($8,240); MFS = half joint per the K-40 ($3,750/$4,000/$4,120)'
std_head:
  value:
    '2017': 5500
    '2021': 6000
    '2024': 6180
  reference: '2017/2019 booklets ($5,500); 2021/2023 booklets ($6,000); 2024-2025 booklets ($6,180)'
std_addl_single:
  value: 850
  reference: 'K-40 65-or-older/blind worksheet, single/HoH $850 per box: 2017 ($3,850/$4,700; HoH $6,350), 2021 ($4,350), 2024 ($4,455/$5,305; HoH $7,030); K.S.A. 79-32,119(b)'
std_addl_married:
  value: 700
  reference: 'K-40 65-or-older/blind worksheet, MFJ/MFS $700 per box: 2017 ($8,200-$10,300), 2021 ($8,700-$10,800), 2024 ($8,940-$11,040)'

# Dependent filers: std = greater of $500 or earned income, capped at the
# filing-status base amount (2017 booklet "minor dependents" + Worksheet II;
# printed through 2019, statutory rule assumed continuing -- see packet
# uncertainty note)
std_dependent_style:
  value: 1
  reference: '2017 booklet Worksheet II - Standard Deduction for People Claimed as a Dependent; "standard deduction of $500 or the amount of their earned income ... whichever is greater"'
std_dependent_floor:
  value: 500
  reference: '2017 booklet Worksheet II line 2 minimum standard deduction $500'
std_dependent_earned_add:
  value: 0
  reference: 'Worksheet II uses earned income with no dollar addition'

# Itemized deduction (K.S.A. 79-32,120): component style. Kansas allows ONLY
# medical (post-7.5%-AGI-floor), real estate taxes, personal property taxes,
# qualified residence interest, and charitable gifts. State/local
# income/sales taxes are NEVER deductible; investment interest, casualty,
# and misc are not KS components. The federal $10,000 SALT cap does NOT
# apply to the KS property-tax components (2024 Schedule A instructions).
# SB 30 (2017) phase-in: charity always 100%; mortgage/property 50% (2017,
# 2018), 75% (2019), 100% (2020+); medical 0% (2017), then 50/75/100%.
# Fractional item_include_* shares deliberately encode the phase-in (the
# calculator multiplies component amounts by these values).
item_allowed:
  value: 1
  reference: 'K-40 line 4; Schedule S Part C (2017-2020) / Kansas Schedule A (2021+); K.S.A. 79-32,120'
item_coupling:
  value: 0
  reference: 'Independent best-of election; the federal-itemizer gate below restricts 2017-2020'
item_fed_gate:
  value:
    '2017': 1
    '2021': 0
  reference: '2017 booklet: "You may itemize ... ONLY if you itemized your deductions on your federal return" (79-32,120 pre-SB 50); SB 50 (2021): "You may itemize your deductions on your Kansas return even if you did not itemize your deductions on your federal return" (2021/2024 booklets)'
item_component_style:
  value: 1
  reference: 'K.S.A. 79-32,120(a): enumerated components only; 2017 Sch S Part C lines C1-C4; 2018 Part C lines C1-C5; 2021+ Kansas Schedule A'
item_include_medical:
  value:
    '2017': 0
    '2018': 0.5
    '2019': 0.75
    '2020': 1
  reference: 'SB 30 (2017) phase-in: 2017 Part C has NO medical line; 2018 booklet "50% qualified medical expenses" (C1, post-floor); 2019 booklet "75%"; 100% from 2020 (2024 Sch A)'
item_include_mortgage:
  value:
    '2017': 0.5
    '2018': 0.5
    '2019': 0.75
    '2020': 1
  reference: '2017 Part C line C3 "Enter 50% of this amount" (qualified residence interest); 2019 booklet 75%; 2024 Sch A 100% of 163(h) interest'
item_include_prop_tax:
  value:
    '2017': 0.5
    '2018': 0.5
    '2019': 0.75
    '2020': 1
  reference: '2017 Part C line C1 real estate taxes 50%; 2019 booklet "75% real and personal"; 2024 Sch A 100% of 164(a) property taxes'
item_include_pers_tax:
  value:
    '2017': 0.5
    '2018': 0.5
    '2019': 0.75
    '2020': 1
  reference: '2017 Part C line C2 personal property taxes 50%; same phase-in as real estate'
item_include_charity:
  value: 1
  reference: '2017 Part C line C4 gifts to charity (100%, all years); 2024 Sch A "100% of the charitable contributions" (IRC 170)'
item_include_income_sales_tax:
  value: 0
  reference: 'K.S.A. 79-32,120 has no state/local income or sales tax component (only property taxes)'
item_include_investment:
  value: 0
  reference: 'Not a Kansas itemized component (79-32,120)'
item_include_casualty:
  value: 0
  reference: 'Not a Kansas itemized component (79-32,120)'
item_include_misc:
  value: 0
  reference: 'Not a Kansas itemized component (79-32,120)'
item_include_other:
  value: 0
  reference: 'Not a Kansas itemized component (79-32,120)'
item_prop_tax_cap:
  value: .inf
  reference: '2024 Kansas Schedule A instructions: the federal $10,000 SALT cap "does not apply for Kansas purposes"'
salt_addback:
  value: 0
  reference: 'n/a: component-style itemized deduction (income/sales taxes excluded via the component flags)'

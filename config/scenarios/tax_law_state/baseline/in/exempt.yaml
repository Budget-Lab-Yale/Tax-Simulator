---
# Corrected 2026-08-11 (cross-model triage): the dependent exemption is
# $1,000 PER DEPENDENT plus an ADDITIONAL $1,500 per dependent CHILD
# (under 19 or full-time student under 24) -- $2,500 total per child, not
# a flat $1,500 -- and the $1,000 65+/blind exemptions are UNIVERSAL (only
# the extra $500 for 65+ under $40,000 federal AGI is income-tested, and
# that piece remains omitted). TAXSIM probe confirms all three components.
personal_amount:
  value: 1000
  reference: 'IC 6-3-1-3.5(a)(1); Indiana IT-40 Schedule 3 line 1, 2017-2025'
dep_amount:
  value: 1000
  reference: 'IC 6-3-1-3.5(a)(1); Indiana IT-40 Schedule 3 line 1 ($1,000 per exemption incl. dependents), 2017-2025'
dep_child_addl:
  value: 1500
  reference: 'IC 6-3-1-3.5(a)(5); Indiana IT-40 Schedule 3 line 2: additional $1,500 per dependent child (under 19 or full-time student under 24)'
dep_child_max_age:
  value: 23
  reference: 'Tracked dependents through age 23 proxy the under-19-or-student-under-24 test (19-23 PUF dependents are student-dominated by federal QC rules; documented approximation)'
aged_addl:
  value: 1000
  reference: 'IC 6-3-1-3.5(a)(3); IT-40 Schedule 3 line 4: $1,000 per person 65+ (universal; the ADDITIONAL income-tested $500 for 65+ under $40,000 federal AGI remains omitted)'
blind_addl:
  value: 1000
  reference: 'IC 6-3-1-3.5(a)(2); IT-40 Schedule 3 line 4: $1,000 per blind person (universal)'
po_thresh:
  value: .inf
  reference: 'Indiana personal and dependent exemptions have no broad AGI phaseout, 2017-2025'
po_type:
  value: 0
  reference: 'n/a for Indiana (no broad AGI phaseout)'

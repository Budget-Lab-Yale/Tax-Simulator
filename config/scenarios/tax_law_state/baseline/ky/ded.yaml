---
filing_status_mapper:
  std_amount:
    '1': std_regular
    '2': std_regular
    '3': std_regular
    '4': std_regular
std_regular:
  value:
    '2017': 2480
    '2018': 2530
    '2019': 2590
    '2020': 2650
    '2021': 2690
    '2022': 2770
    '2023': 2980
    '2024': 3160
    '2025': 3270
  reference: 'Kentucky Form 740 standard deduction: 2017 packet ($2,480); KY DOR annual adjustment announcements 2018-2022 ($2,530/$2,590/$2,650/$2,690/$2,770); 2023-2025 Form 740 packets. Filing status 2 (combined return) takes one amount PER SPOUSE via st_ord.combined_sep; the mapped per-return value here is the single/joint amount'
item_allowed:
  value: 1
  reference: 'Kentucky Form 740 Schedule A, standard or itemized deduction election, 2017-2025'
# From TY2018 (HB 487) Schedule A is its own short list -- interest (home
# mortgage, points, investment interest), contributions, gambling losses and
# a few listed miscellaneous items; no taxes, no medical -- and the election
# is independent of the federal one. TY2017 keeps the federal-amount proxy
# (no 2017 form re-read; the TAXSIM 2017 cell clears on it). Fixed
# 2026-10-15: the federal total had been carrying SALT and medical
item_coupling:
  value:
    '2017': 1
    '2018': 0
  reference: '2023 Form 740 Schedule A instructions: "You may itemize your deductions for Kentucky even if you do not itemize for federal purposes" (married couples must both itemize or both not); 2017 retains the earlier federal-election proxy'
item_component_style:
  value:
    '2017': 2
    '2018': 1
  reference: 'Form 740 Schedule A 2018-2025 (2023 form re-read 2026-10-15): lines 1-6 interest, 7-11 contributions, 12-14 gambling losses and other miscellaneous -- components, not the federal total'
item_include_medical:
  value: 0
  reference: 'Schedule A 2018-2025 has no medical line'
item_include_mortgage:
  value: 1
  reference: 'Schedule A lines 1-3 (home mortgage interest and points)'
item_include_investment:
  value: 1
  reference: 'Schedule A line 5 (investment interest, federal Form 4952)'
item_include_charity:
  value: 1
  reference: 'Schedule A lines 7-11 (contributions)'
item_include_casualty:
  value: 0
  reference: 'Schedule A 2018-2025 has no casualty line'
item_include_misc:
  value: 0
  reference: 'Line 13 allows only the listed miscellaneous expenses, not the pre-TCJA 2%-floor class'
item_include_other:
  value: 1
  reference: 'Schedule A line 12 (gambling losses to the extent of winnings) and line 13 listed items -- the federal Schedule A line 16 class'
item_include_prop_tax:
  value: 0
  reference: 'Schedule A 2018-2025 has no taxes section'
item_include_pers_tax:
  value: 0
  reference: 'Schedule A 2018-2025 has no taxes section'
item_include_income_sales_tax:
  value: 0
  reference: 'Schedule A 2018-2025 has no taxes section'
salt_addback:
  value: 0
  reference: 'Kentucky Schedule A adjustments are not separately observable in the PUF and no generic salt addback is imposed'

---
# Kentucky: pass-through entity tax election, KRS 141.209 (HB 5, 2023 Ky. Acts ch. 148),
# retroactive to TY2022 (TY2022 elections allowed 3/31/2023-8/31/2024). Annual election on Form
# 740-PTET, irrevocable for the year and binding on all owners; base = ordinary income plus separately
# stated items under KRS 141.206, apportioned. C-corporation partners' shares are excluded from the base.
# Owners claim a refundable 100% credit (Form PTET-CR; Form 740/740-NP).
# Codes: method 0 none / 1 credit / 2 exclusion; *_scope 1 all-source / 2 state-source (apportioned).

available:
  value:
    '2017': 0
    '2022': 1
  reference: 'KRS 141.209 (2023 Ky. Acts ch. 148 sec. 9, HB 5), https://apps.legislature.ky.gov/law/statutes/statute.aspx?id=53597 (2)(a): "For taxable years beginning on or after January 1, 2022"; no end date or IRC 164(b)(6) tie in the section'
mandatory:
  value: 0
  reference: 'KRS 141.209 (2023 Ky. Acts ch. 148 sec. 9, HB 5), https://apps.legislature.ky.gov/law/statutes/statute.aspx?id=53597 (2)(a), (f): annual election, irrevocable for the year and binding on all owners'
method:
  value:
    '2017': 0
    '2022': 1
  reference: 'KRS 141.209 (2023 Ky. Acts ch. 148 sec. 9, HB 5), https://apps.legislature.ky.gov/law/statutes/statute.aspx?id=53597 (3): refundable pass-through entity tax credit'
rate:
  value:
    '2017': 0.0
    '2022': 0.05
    '2023': 0.045
    '2024': 0.04
    '2026': 0.035
  reference: 'KRS 141.209 (2023 Ky. Acts ch. 148 sec. 9, HB 5), https://apps.legislature.ky.gov/law/statutes/statute.aspx?id=53597 (2)(a): "the tax under KRS 141.020" (individual flat rate); Kentucky Form 740-PTET instructions TY2024, https://revenue.ky.gov/Forms/PKG%20INSTR%20PTET%202024.pdf "The tax rate for 2024 is 4.0% (.04)". 2022 5.0%, 2023 4.5%, 2025 4.0%, 2026 3.5% = KRS 141.020 as encoded in baseline/ky/ord.yaml'
rate_tracks_top:
  value: 1
  reference: 'KRS 141.209 (2023 Ky. Acts ch. 148 sec. 9, HB 5), https://apps.legislature.ky.gov/law/statutes/statute.aspx?id=53597 (2)(a) (tax under KRS 141.020)'

#   reference: 'KRS 141.209 (2023 Ky. Acts ch. 148 sec. 9, HB 5), https://apps.legislature.ky.gov/law/statutes/statute.aspx?id=53597 (2)(a): one rate for all pass-through entities'
credit_share:
  value:
    '2017': 0.0
    '2022': 1.0
  reference: 'KRS 141.209 (2023 Ky. Acts ch. 148 sec. 9, HB 5), https://apps.legislature.ky.gov/law/statutes/statute.aspx?id=53597 (3)(a): "one hundred percent (100%) of the entity owner''s proportionate share of the tax paid"'
credit_refundable:
  value: 1
  reference: 'KRS 141.209 (2023 Ky. Acts ch. 148 sec. 9, HB 5), https://apps.legislature.ky.gov/law/statutes/statute.aspx?id=53597 (3): "a refundable pass-through entity tax credit"'

---
# Kentucky's family-size credit equals a table-selected share of preliminary
# tax. The final bound is deliberately a finite sentinel for YAML portability.
# Family-size tax credit (KRS 141.066; Schedule ITC Section C): a
# percentage of tax by family size (1-4+) and modified gross income.
# DENSE TABLE in credit_tables.csv beside this file (credit_id
# family_size_tax_credit, key_concept = family size, two vintages 2017
# and 2025 from the Schedule ITC Table C for 2018 and 2025; income
# rounded to whole dollars before the lookup; the 0% top band is
# omitted per the zero-outside convention)
family_credit_style:
  value: 1
  reference: 'KRS 141.066; Kentucky Schedule ITC, Section C, 2017-2025'

# Personal tax credits (Form 740 line 17; 2017 Form 740 Section B, then
# Schedule ITC Section B from 2018). 2017: $10 per credit box — one regular
# box each for taxpayer/spouse/dependents, four additional boxes ($40) for
# 65+, four for blind. HB 366 repealed the regular/dependent credits for
# TY2018+ but kept 65+/blind at the same $40. The $20 Kentucky National
# Guard credit is unobservable in the PUF and omitted (see packet).
# Applied BEFORE the family-size credit per the Form 740 line ordering.
exempt_credit_style:
  value: 1
  reference: '2017 Form 740 Section B personal tax credits; 2018-2025 Schedule ITC Section B'
exempt_credit_personal:
  value:
    '2017': 10
    '2018': 0
  reference: '2017 Form 740 Section B line 4: $10 per regular credit (taxpayer, spouse); repealed for TY2018+ by HB 366'
exempt_credit_dep:
  value:
    '2017': 10
    '2018': 0
  reference: '2017 Form 740 Section B line 2: $10 per dependent credit; repealed for TY2018+ by HB 366'
exempt_credit_aged:
  value: 40
  reference: '2017 Form 740 Section B: four additional $10 boxes if 65 or over; 2018-2025 Schedule ITC Section B: $40 if 65 or over'
exempt_credit_blind:
  value: 40
  reference: '2017 Form 740 Section B: four additional $10 boxes if blind; 2018-2025 Schedule ITC Section B: $40 if blind'
cdctc_match:
  value: 0.20
  reference: 'Kentucky Form 740, line 24; Kentucky child and dependent care credit, 2017-2025'
cdctc_refundable:
  value: 0
  reference: 'Kentucky Form 740, line 24 reduces income tax liability and is not refundable'
cdctc_fed_base:
  value:
    '2017': 1
    '2019': 0
    '2021': 2
    '2022': 0
  reference: 'Form 740: "from federal Form 2441, line 9 x 20%" (2017-2018, the tentative credit); "line 11 x 20%" (2019-2020, 2022-2025, the claimed credit). TY2021: Kentucky conforms to the IRC as of 12/31/2018 and "does not conform to Section 9631 of the federal American Rescue Plan"; Form 2441-K recomputes the pre-ARPA credit ($3,000/$6,000, .35-.20), limits it by federal tax ("Tax liability limit ... smaller of line 9(c) or line 10") and takes 20% (2441-K line 12). Encoded 2026-10-07: every year had used the claimed (ARPA in 2021) credit'
cdctc_base_liab_limit:
  value:
    '2017': 0
    '2021': 1
    '2022': 0
  reference: 'Form 2441-K (2021) line 10: credit limit = federal Form 1040 line 18 less Schedule 3 line 1 (tax before credits less the foreign tax credit)'
cdctc_rate_max:
  value: 0.35
  reference: 'Form 2441-K (2021): the federal decimal, .35 at federal AGI of $15,000 or less (pre-ARPA IRC 21(a)(2))'
cdctc_rate_floor:
  value: 0.20
  reference: 'Form 2441-K (2021): .20 over $43,000'
cdctc_rate_po_start:
  value: 15000
  reference: 'Form 2441-K (2021): the decimal falls above $15,000'
cdctc_rate_po_step:
  value: 2000
  reference: 'Form 2441-K (2021): .01 per $2,000 band or fraction'
cdctc_rate_po_per_1k:
  value: 0.01
  reference: 'Read as the per-step decrement because a step is encoded'
cdctc_rate_income_base:
  value: 1
  reference: 'Form 2441-K (2021): the decimal is read on federal AGI'
cdctc_expense_ei_limit:
  value: 1
  reference: 'Form 2441-K (2021): expenses limited to the lower-earning spouse''s earned income (IRC 21(d))'
cdctc_expense_caps:
  value:
    '2017': [3000.0, 6000.0, 6000.0, 6000.0, 6000.0]
  reference: 'Form 2441-K (2021): $3,000 for one qualifying person, $6,000 for two or more (pre-ARPA IRC 21(c)); read only in TY2021 (cdctc_fed_base = 2)'

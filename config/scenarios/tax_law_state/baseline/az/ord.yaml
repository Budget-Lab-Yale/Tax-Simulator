---
# Arizona resident rate schedules.  The 2021 final bracket combines the 1.00%
# regular rate (Tax Tables X/Y above $250,000 / $500,000; SB 1828) and the 3.5%
# Prop. 208 surcharge (Form 140 line 46b) for a 4.5% total -- the same marginal
# rate as the bracket below it.  Prop. 208 was struck in March 2022 and ADOR
# reprocessed TY2021 returns with no change in total liability.  (Corrected
# 2026-10-20 from 8%, which stacked the surcharge on the 4.5% rate.)

filing_status_mapper:
  brackets:
    '1': brackets_single
    '2': brackets_joint
    '3': brackets_single
    '4': brackets_joint

rates:
  value:
    '2017': [0.0259, 0.0288, 0.0336, 0.0424, 0.0454, 0.0454, 0.0454, 0.0454, 0.0454, 0.0454]

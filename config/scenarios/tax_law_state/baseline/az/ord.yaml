  reference: 'Arizona Form 140 Tax Tables X and Y, 2017-2025; https://azdor.gov/forms/individual/form-140-arizona-resident-personal-income-tax-booklet. TY2021: 2021 Form 140 booklet p.59 (regular 1.00% over $250,000/$500,000 plus 3.5% surcharge on line 46b = 4.5%); https://azdor.gov/sites/default/files/2023-03/FORMS_INDIVIDUAL_2021_140BOOKLET.pdf; ADOR, Guidance to taxpayers following Prop 208 ruling (2022): no change in overall liability'

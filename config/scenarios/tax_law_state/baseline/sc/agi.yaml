---
# South Carolina: base and additions/subtractions (SC1040; S.C. Code 12-6-1110
# et seq.). SC tax = rate x (federal TAXABLE income + additions - subtractions),
# so the federal standard/itemized deduction flows through. SC uses FIXED-DATE
# annual IRC conformity (12-6-40): each year adopts the IRC amended through
# Dec 31 of the prior year.
#
# NOTE: TY2026 (H.4216/Act 110) is a STRUCTURAL reform -- starting point becomes
# federal AGI plus a new SC Income Adjusted Deduction, with a 1.99%/5.21% two-
# bracket schedule and a $200 EITC cap. Forms are not yet published; this file
# encodes 2017-2025 only. Do NOT rely on projected 2026 values.

# Starting point: 2 = federal taxable income (SC1040 line 1), TY2017-2025
start_point:
  value: 2
  reference: 'SC1040 line 1 federal taxable income (TY2017-2025); S.C. Code 12-6-560'

# IRC conformity: fixed-date, updated annually (amended-through Dec 31 prior).
# Mapped to reference-law group 3 (fixed_date_annual, ready=false) so federal-
# reform runs are guarded until the SC reference overlay is built (like CA).
conformity_year:
  value:
    '2017': 2016
    '2018': 2018
    '2019': 2018
    '2020': 2019
    '2021': 2020
    '2022': 2021
    '2023': 2022
    '2024': 2023
    '2025': 2024
  reference: 'S.C. Code 12-6-40(A)(1)(a); annual conformity Acts (2017 Act 4 ... 2025 Act 63). TY2018 = IRC amended through Feb 9, 2018'
conformity_group:
  value: 3
  reference: 'Fixed-date annual conformity -> reference-law group 3 (conformity_groups.yaml)'

# Out-of-state municipal bond interest added back (SC1040 line d); SC own-state
# obligations stay exempt
add_exempt_int:
  value: 1
  reference: 'S.C. Code 12-6-1120 (modifies IRC 103); SC1040 additions line d'
own_state_exempt:
  value: 1
  reference: 'S.C. Code 12-6-1120 (SC and SC-political-subdivision obligations excluded from addback)'

# US government obligation interest subtraction (SC1040 line m; Treasuries/
# savings bonds, NOT Fannie/Freddie/Ginnie). Carried as a flag; PUF share
# unobserved so no subtraction is taken (model-wide known-difference)
sub_us_int:
  value: 1
  reference: 'S.C. Code 12-6-1120; SC1040 line m; PUF share unobserved [known-difference]'

# State income tax refund included in federal taxable income subtracted (line f)
sub_state_ref:
  value: 1
  reference: 'SC1040 subtraction line f (state income tax refund in federal income)'

# Social Security / railroad retirement fully exempt (SC1040 line o): SC does
# not conform to IRC 86, so the federally-taxable portion is fully subtracted
ss_sub_share:
  value: 1
  reference: 'S.C. Code 12-6-1120; SC1040 line o (full subtraction of federally-taxable SS/RR)'

# 44% net long-term capital gain deduction (SC1040 line i; 12-6-1150). No SC
# dividend exclusion.
cap_gains_excl_share:
  value: 0.44
  reference: 'S.C. Code 12-6-1150; SC1040 line i: 44% of SC net capital gain (net LT gain over net ST loss)'

# Retirement income deduction per taxpayer (SC1040 line p; 12-6-1170(A)):
# $3,000 under 65, $10,000 at 65+, on qualified pension/IRA income. Applies at
# any age. NOTE: the SEPARATE age-65 deduction ($15,000/person, reduced by this
# retirement deduction; 12-6-1170(B)) and the military-retirement deduction are
# NOT modeled here -- documented known-differences (needs the p/q offset logic
# and military-retirement identification).
pension_excl_under65:
  value: 3000
  reference: 'S.C. Code 12-6-1170(A); SC1040 line p (under 65 retirement deduction)'
pension_excl_65plus:
  value: 10000
  reference: 'S.C. Code 12-6-1170(A); SC1040 line p (age 65+ retirement deduction)'
pension_excl_min_age:
  value: 0
  reference: 'SC retirement deduction has no minimum age ($3,000 at any age, $10,000 at 65+)'
pension_cap_incl_ss:
  value: 0
  reference: 'SC Social Security is separately fully exempt (line o); not counted within the retirement cap'

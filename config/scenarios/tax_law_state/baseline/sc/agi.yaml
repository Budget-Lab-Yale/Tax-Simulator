---
filing_status_mapper:
  add_std_above:
    '1': std_pre_obbba_single
    '2': std_pre_obbba_joint
    '3': std_pre_obbba_single
    '4': std_pre_obbba_head

# South Carolina: base and additions/subtractions (SC1040; S.C. Code 12-6-1110
# et seq.). SC tax = rate x (federal TAXABLE income + additions - subtractions),
# so the federal standard/itemized deduction flows through. SC uses FIXED-DATE
# annual IRC conformity (12-6-40): each year adopts the IRC amended through
# Dec 31 of the prior year.
#
# NOTE: TY2026 (H.4216/Act 110) is a STRUCTURAL reform -- starting point becomes
# federal AGI plus a new SC Income Adjusted Deduction, with a 1.99%/5.21% two-
# bracket schedule and a $200 EITC cap. Forms are not yet published; this file
# encodes 2017-2025 only. Do NOT rely on projected 2026 values.

# Starting point: 2 = federal taxable income (SC1040 line 1), TY2017-2025
start_point:
  value: 2
  reference: 'SC1040 line 1 federal taxable income (TY2017-2025); S.C. Code 12-6-560'

# IRC conformity: fixed-date, updated annually (amended-through Dec 31 prior).
# Mapped to reference-law group 3 (fixed_date_annual, ready=false) so federal-
# reform runs are guarded until the SC reference overlay is built (like CA).
# The dated series below is documentation-only (parser skips the block);
# conformity behavior is modeled via conformity_group.
documented_not_modeled:
  conformity_year:
    value:
      '2017': 2016
      '2018': 2018
      '2019': 2018
      '2020': 2019
      '2021': 2020
      '2022': 2021
      '2023': 2022
      '2024': 2023
      '2025': 2024
    reference: 'S.C. Code 12-6-40(A)(1)(a); annual conformity Acts (2017 Act 4 ... 2025 Act 63). TY2018 = IRC amended through Feb 9, 2018'
conformity_group:
  value: 3
  reference: 'Fixed-date annual conformity -> reference-law group 3 (conformity_groups.yaml)'

# TY2025 OBBBA nonconformity. South Carolina conforms to the IRC as amended
# through December 31, 2024 (2025 SC1040 instructions, Before You Begin), so
# P.L. 119-21's deductions are not adopted and SC1040 line e adds back "any
# federal deductions resulting from IRC sections that South Carolina does not
# adopt": the Schedule 1-A tips, overtime, vehicle-loan interest and enhanced
# senior deductions, and for federal non-itemizers the OBBBA increase in the
# standard deduction over the pre-OBBBA TY2025 amounts (Rev. Proc. 2024-40:
# $15,000 / $30,000 / $22,500). The conformity bridge (group 3, S44) points at
# enacted federal law, so the departure is carried here. Added 2026-10-21;
# tips/overtime/vehicle-loan use the Tax-Data tips1/2, ot1/2 and auto_int_exp
# imputations through the federal calculator (JI approved first state use
# 2026-10-21). Not modeled: the itemizer SALT-cap increase to $40,000.
# Carried to TY2026+ by S45 pending SC's next conformity act.
add_overtime_ded:
  value:
    '2017': 0
    '2025': 1
  reference: '2025 SC1040 instructions p.2 ("South Carolina conforms to the Internal Revenue Code as amended through December 31, 2024") and line e ("Add back any federal deductions resulting from IRC sections that South Carolina does not adopt"); IRS Schedule 1-A line 21; https://dor.sc.gov/sites/dor/files/forms/SC1040Instr_2025.pdf'
add_fed_tip_ded:
  value:
    '2017': 0
    '2025': 1
  reference: '2025 SC1040 instructions line e (IRC sections not adopted); IRS Schedule 1-A line 13'
add_fed_senior_ded:
  value:
    '2017': 0
    '2025': 1
  reference: '2025 SC1040 instructions line e (IRC sections not adopted); IRS Schedule 1-A line 37'
add_fed_auto_int_ded:
  value:
    '2017': 0
    '2025': 1
  reference: '2025 SC1040 instructions line e (IRC sections not adopted); IRS Schedule 1-A line 30'
std_pre_obbba_single:
  value:
    '2017': .inf
    '2025': 15000
  reference: 'Rev. Proc. 2024-40 (TY2025 inflation adjustments): TY2025 standard deduction before P.L. 119-21, single and married filing separately $15,000; the OBBBA increase above it is added back on SC1040 line e'
std_pre_obbba_joint:
  value:
    '2017': .inf
    '2025': 30000
  reference: 'Rev. Proc. 2024-40 (TY2025 inflation adjustments): married filing jointly $30,000'
std_pre_obbba_head:
  value:
    '2017': .inf
    '2025': 22500
  reference: 'Rev. Proc. 2024-40 (TY2025 inflation adjustments): head of household $22,500'

# Out-of-state municipal bond interest added back (SC1040 line d); SC own-state
# obligations stay exempt
add_exempt_int:
  value: 1
  reference: 'S.C. Code 12-6-1120 (modifies IRC 103); SC1040 additions line d'
own_state_exempt:
  value: 1
  reference: 'S.C. Code 12-6-1120 (SC and SC-political-subdivision obligations excluded from addback)'

# US government obligation interest subtraction (SC1040 line m; Treasuries/
# savings bonds, NOT Fannie/Freddie/Ginnie). Carried as a flag; PUF share
# unobserved so no subtraction is taken (model-wide known-difference)
sub_us_int:
  value: 1
  reference: 'S.C. Code 12-6-1120; SC1040 line m; PUF share unobserved [known-difference]'

# State income tax refund included in federal taxable income subtracted (line f)
sub_state_ref:
  value: 1
  reference: 'SC1040 subtraction line f (state income tax refund in federal income)'

# Social Security / railroad retirement fully exempt (SC1040 line o): SC does
# not conform to IRC 86, so the federally-taxable portion is fully subtracted
ss_sub_share:
  value: 1
  reference: 'S.C. Code 12-6-1120; SC1040 line o (full subtraction of federally-taxable SS/RR)'

# 44% net long-term capital gain deduction (SC1040 line i; 12-6-1150). No SC
# dividend exclusion.
cap_gains_excl_share:
  value: 0.44
  reference: 'S.C. Code 12-6-1150; SC1040 line i: 44% of SC net capital gain (net LT gain over net ST loss)'

# Retirement income deduction per taxpayer (SC1040 line p; 12-6-1170(A)):
# $3,000 under 65, $10,000 at 65+, on qualified pension/IRA income. Applies at
# any age. The military-retirement deduction (12-6-1171) is NOT modeled
# (military-retirement identification unobserved; known-difference).
pension_excl_under65:
  value: 3000
  reference: 'S.C. Code 12-6-1170(A); SC1040 line p (under 65 retirement deduction)'
pension_excl_65plus:
  value: 10000
  reference: 'S.C. Code 12-6-1170(A); SC1040 line p (age 65+ retirement deduction)'
pension_excl_min_age:
  value: 0
  reference: 'SC retirement deduction has no minimum age ($3,000 at any age, $10,000 at 65+)'
pension_cap_incl_ss:
  value: 0
  reference: 'SC Social Security is separately fully exempt (line o); not counted within the retirement cap'

# Age-65 deduction (SC1040 lines q-1/q-2; 12-6-1170(B)): $15,000 per
# taxpayer 65+, against ANY income, reduced dollar-for-dollar by amounts
# claimed under the 12-6-1170(A) retirement deduction. Encoded 2026-08-11
# (was a documented known-difference; elderly survey recommendation #3).
# The offset applies at the unit level -- exact for singles and both-65+
# couples; over-offsets by up to $3,000 when only an under-65 spouse
# claims (A) (documented approximation).
age_ded_amount:
  value: 15000
  reference: 'S.C. Code 12-6-1170(B); SC1040 lines q-1/q-2 (age 65 and older deduction), 2017-2025'
age_ded_min_age:
  value: 65
  reference: 'S.C. Code 12-6-1170(B): resident individuals 65 or older'
age_ded_less_pension_sub:
  value: 1
  reference: 'S.C. Code 12-6-1170(B)(1): reduced by amounts deducted under 12-6-1170(A)'

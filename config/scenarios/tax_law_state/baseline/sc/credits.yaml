---
# South Carolina: credits (SC1040; SC1040TC).
# Encoded: the SC Earned Income Tax Credit (12-6-3632) -- NONREFUNDABLE, a
# percentage of the federal EITC, phased in over six equal steps from TY2018
# (20.83%) to 125% at TY2023.
#
# KNOWN-DIFFERENCES (not modeled):
#   - Tuition Tax Credit (12-6-3385, refundable): needs student tuition data.
#   - Nursing-home/family-care, motor-fuel (2018-2022), excess-premium credits.

# SC EITC: nonrefundable % of the federal EITC (no credit before TY2018)
eitc_match:
  value:
    '2017': 0
    '2018': 0.2083
    '2019': 0.4167
    '2020': 0.625
    '2021': 0.8333
    '2022': 1.0417
    '2023': 1.25
  reference: 'S.C. Code 12-6-3632; Form TC-60. Six-step phase-in from 20.83% (TY2018) to 125% (TY2023+)'
eitc_refundable:
  value: 0
  reference: 'S.C. Code 12-6-3632 (nonrefundable, full-year residents)'

# Two Wage Earner Credit (12-6-3330; SC1040 line 17 area): 0.7% of the
# lesser-earning spouse's earned income, with the qualifying-income cap
# phased from $30,000 to $50,000 in six equal steps by Act 266 of 2018
# (the same act as the EITC phase-in). Encoded as the capped credit
# (rate x cap). TAXSIM's 2019 value (256.67 = 0.7% x 36,667) matches.
# Encoded 2026-08-11 (was a documented known-difference). Earned income
# proxies SC-source qualified earned income (known-difference)
twoearner_rate:
  value: 0.007
  reference: 'S.C. Code 12-6-3330(A); SC1040 instructions two wage earner credit, 2017-2025'
twoearner_max:
  value:
    '2017': 210.0
    '2018': 233.33
    '2019': 256.67
    '2020': 280.0
    '2021': 303.33
    '2022': 326.67
    '2023': 350.0
  reference: 'S.C. Code 12-6-3330 as amended by Act 266 of 2018: qualifying-income cap 30,000 phased to 50,000 in six equal annual steps from TY2018; credit max = 0.7% of the cap'

# Child and Dependent Care Credit (12-6-3380; SC1040TC), NONREFUNDABLE: 7% of
# the expenses on which the federal credit is figured (IRC 21: at most $3,000
# per qualifying child under 13, two at most, and the lesser earner's earned
# income), so $210 / $420 at most. Encoded 2026-10-21 on the generic care
# credit (care_credit = the 7% rate on capped expenses; the flat-amount prong
# is off). care_exp is the Tax-Data CPS-ASEC SPM child care imputation. Was
# documented-not-modeled; the PolicyEngine 2022-24 residual's modal +210/+420
# misses were this credit.
care_credit:
  value: 0.07
  reference: 'S.C. Code 12-6-3380; 2025 SC1040 instructions line 11: "the credit is calculated at 7% of the federal child and dependent care expense ... The maximum credit allowed is $210 for one child or $420 for two or more children"; https://dor.sc.gov/sites/dor/files/forms/SC1040Instr_2025.pdf'
care_credit_per_dep_cap:
  value: 3000
  reference: 'IRC 21(c) expense limit $3,000 per qualifying individual, as adopted by SC (the $210 / $420 SC maxima are 7% of $3,000 / $6,000)'
care_credit_dep_limit:
  value: 2
  reference: 'IRC 21(c): the $6,000 limit for two or more qualifying individuals'
care_credit_age_limit:
  value: 12
  reference: 'IRC 21(b)(1)(A): qualifying child under 13 (year-end age 12 or less)'
care_credit_refundable:
  value: 0
  reference: 'S.C. Code 12-6-3380: nonrefundable credit against SC income tax (SC1040TC)'
care_credit_mfs_ineligible:
  value: 1
  reference: '2025 SC1040 instructions line 11: "You cannot claim this credit if your filing status is Married Filing Separately"'


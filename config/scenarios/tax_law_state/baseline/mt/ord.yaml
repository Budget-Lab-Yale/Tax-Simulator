# Preferential schedule on net long-term capital gains, from TY2024.
kg_pref_rate_low:
  value:
    '2017': 0.0
    '2024': 0.030
  reference: 'HB 221 (2023), from TY2024: "net long-term capital gains are now taxed at lower rates than Montana ordinary income" (2024 booklet p.i). Form 2 page 2 lines 1-13 give the algorithm -- ordinary income fills the low bracket first, long-term gain takes whatever room remains at 3.0%, and the excess is taxed at 4.1%. The old 2% capital gains CREDIT was repealed in the same act'
kg_pref_rate_high:
  value:
    '2017': 0.0
    '2024': 0.041
  reference: 'Same source; the rate on long-term gain stacked above the bracket threshold'
kg_thresh_single:
  value:
    '2017': 0.0
    '2024': 20500
    '2025': 21100
  reference: 'Form 2 page 2 line 5: the stacking threshold is the taxpayer''s own ordinary-income bracket bound, so it equals brackets_single above. Stated separately here rather than inferred from the ladder'
kg_thresh_joint:
  value:
    '2017': 0.0
    '2024': 41000
    '2025': 42200
  reference: 'Same line, married filing jointly and qualifying surviving spouse'
kg_thresh_head:
  value:
    '2017': 0.0
    '2024': 30750
    '2025': 31700
  reference: 'Same line, head of household'

documented_not_modeled:
  ty2026_and_ty2027_rates:
    reference: 'HB 337 (2025) enacts a 5.65% top rate for TY2026 and 5.4% for TY2027, with the low bracket widening to $47,500/$71,250/$95,000 and then $65,000/$97,500/$130,000. Not encoded pending the published TY2026 tables -- note that 5.65% is a TY2026 figure, NOT a TY2024 or TY2025 one, which secondary summaries have got wrong'
  ty2017_pease_limitation:
    reference: 'TY2017 alone carried a Pease-style limitation on Montana itemized deductions. Not encoded [overstates TY2017 itemized deductions for high-income filers]'
  collectibles_and_other_gain_types:
    reference: 'The preferential schedule reaches net long-term capital gain as reported on federal Schedule D line 15. Any federal-side distinctions below that line are not separable in the model'

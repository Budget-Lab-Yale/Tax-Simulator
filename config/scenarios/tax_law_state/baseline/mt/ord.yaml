    '2018': [0.0, 3000.0, 5200.0, 8000.0, 10800.0, 13900.0, 17900.0]
    '2019': [0.0, 3100.0, 5400.0, 8200.0, 11100.0, 14300.0, 18400.0]
    '2020': [0.0, 3100.0, 5500.0, 8400.0, 11300.0, 14500.0, 18700.0]
    '2021': [0.0, 3100.0, 5500.0, 8400.0, 11400.0, 14600.0, 18800.0]
    '2022': [0.0, 3300.0, 5800.0, 8900.0, 12000.0, 15400.0, 19800.0]
    '2023': [0.0, 3600.0, 6300.0, 9700.0, 13000.0, 16800.0, 21600.0]
    '2024': [0.0, 20500.0, 20500.0, 20500.0, 20500.0, 20500.0, 20500.0]
    '2025': [0.0, 21100.0, 21100.0, 21100.0, 21100.0, 21100.0, 21100.0]
  reference: 'DOR rate sheets, one per year. Through TY2023 these bounds applied to EVERY filing status, which is why the joint and head-of-household series below repeat them. Indexed annually from a statutory base and rounded to the nearest $100 (MCA 15-30-2103). From TY2024 the single and married-filing-separately bracket is $20,500, indexed to $21,100 for TY2025 (Form 2 page 2 line 5; 2025 rate sheet)'
brackets_joint:
  value:
    '2017': [0.0, 2900.0, 5200.0, 7900.0, 10600.0, 13600.0, 17600.0]
    '2018': [0.0, 3000.0, 5200.0, 8000.0, 10800.0, 13900.0, 17900.0]
    '2019': [0.0, 3100.0, 5400.0, 8200.0, 11100.0, 14300.0, 18400.0]
    '2020': [0.0, 3100.0, 5500.0, 8400.0, 11300.0, 14500.0, 18700.0]

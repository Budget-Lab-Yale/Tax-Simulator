---
# Alabama: adjusted gross income (Form 40 lines 5-10; Ala. Code 40-18-14).
#
# Alabama does NOT start from federal AGI. It builds its own gross income from
# scratch (Form 40 page 1 lines 5-8) and subtracts its own above-the-line
# adjustments (page 2 Part II) to reach Alabama AGI on line 10. So this is an
# own-base state, encoded with the PA/NJ ob_* class shares.
#
# LOSSES ARE NOT RING-FENCED BY CLASS. Unlike Pennsylvania, Alabama lets a loss
# in one class offset income in another -- and is in fact more generous than
# federal law on capital losses: "Under Alabama law the entire gain is taxable,
# and the entire loss is deductible in the year in which it occurs" (Schedule D
# instructions). So ob_class_floor stays 0.
#
# Conformity: Alabama defines its own income concept rather than referencing
# the IRC wholesale, and the exclusion catalogue below is statutory. Rolling
# for the items it does borrow (IRA, HSA and self-employed health insurance
# limits track the federal ones by reference).

start_point:
  value: 0
  reference: 'Form 40 page 1 builds Alabama income from wages (line 5), interest and dividends (line 6), other income from page 2 Part I (line 7) and totals at line 8; Ala. Code 40-18-14 defines Alabama gross income independently of federal AGI. There is no federal-AGI line on Form 40'

ob_class_floor:
  value: 0
  reference: 'Form 40 Schedule D instructions: "Under Alabama law the entire gain is taxable, and the entire loss is deductible in the year in which it occurs". Alabama has no gross-income-class loss ring-fence of the Pennsylvania kind'

ob_comp_share:
  value: 1
  reference: 'Form 40 line 5, wages/salaries/tips from Schedule W-2'
ob_int_share:
  value: 1
  reference: 'Form 40 line 6 and Schedule B; interest is fully taxable except the exclusions listed below'
ob_div_share:
  value: 1
  reference: 'Form 40 line 6 and Schedule B; dividends fully taxable, with no preferential treatment'
ob_bus_share:
  value: 1
  reference: 'Form 40 page 2 Part I; Schedules C, E and F flow in at their federal amounts'
ob_gains_share:
  value: 1
  reference: 'Form 40 Schedule D: capital gains are ordinary income taxed at 2/4/5%, with no preferential rate and no separate computation'
ob_rent_share:
  value: 1
  reference: 'Form 40 page 2 Part I via Schedule E, rents and royalties'
ob_retirement_share:
  value: 1
  reference: 'Pension and annuity distributions are taxable EXCEPT distributions from a defined benefit plan under IRC 414(j), which Alabama exempts entirely ("Examples of Income You DO NOT Report", every booklet 2017-2025 p.7). The defined-benefit share of txbl_pens_dist is unobserved in the PUF, so the whole pool is taxed -- see documented_not_modeled.defined_benefit_pension_exclusion, Alabama''s largest known difference'
ob_ira_share:
  value: 1
  reference: 'Traditional IRA distributions are taxable: an IRA is by definition not a defined benefit plan, so the IRC 414(j) exclusion cannot reach it. Subject only to the age-65 $6,000 exclusion below'
ob_ss_share:
  value: 0
  reference: '"Federal Social Security benefits" and "Federal Railroad Retirement benefits" are on the do-not-report list in every booklet 2017-2025 p.7. Alabama exempts them in full, with no provisional-income test'
ob_ui_share:
  value: 0
  reference: '"Unemployment compensation" is on the do-not-report list in every booklet 2017-2025 p.7. Fully taxable federally, fully exempt in Alabama'
ob_alimony_share:
  value: 1
  reference: 'Form 40 page 2 Part I line 6, alimony received'
ob_other_share:
  value: 1
  reference: 'Form 40 page 2 Part I "Other Income", residual category'

# Act 2022-294 age-65 retirement exclusion, effective TY2023. Covers the
# taxable defined-contribution and IRA distributions the IRC 414(j) exclusion
# above does not reach.
pension_excl_65plus:
  value:
    '2017': 0
    '2023': 6000
  reference: 'Act 2022-294, quoted in the TY2023 booklet''s "What''s New For 2023" [23f40bk p.2]: "Effective Jan 1, 2023, exempts the first $6,000 of taxable retirement income for those 65 years of age or older." Absent from the TY2022 booklet, so TY2023 is the first year. UNVERIFIED whether the $6,000 is per person or per return, which distribution types qualify, and whether any income test applies -- the detail sits in the Schedule RS instructions, which are not bound into the Form 40 booklet. Encoded PER PERSON as the natural reading of an individual age test; revisit against Schedule RS'
pension_excl_min_age:
  value: 65
  reference: 'Act 2022-294 as quoted above: "those 65 years of age or older"'
pension_excl_incl_ira:
  value: 1
  reference: 'The act refers to "taxable retirement income" without restricting the source; IRA distributions are the main category left taxable after the defined-benefit exclusion. UNVERIFIED pending Schedule RS'

documented_not_modeled:
  defined_benefit_pension_exclusion:
    reference: 'Alabama exempts ALL distributions from a defined benefit plan under IRC 414(j), plus every named public system by name -- United States Retirement System, Alabama Teachers''/Employees''/Judicial Retirement Systems, TVA, military retirement, federal Railroad Retirement, and firefighter and peace officer retirement ("Examples of Income You DO NOT Report", every booklet p.7). Federal 1040 line 5b is a single "taxable pensions and annuities" figure that pools defined-benefit with 401(k)-type distributions, and 1099-R box 7 codes do not separate them either. The whole pool is therefore taxed [OVERSTATES Alabama tax for defined-benefit retirees, which in Alabama is most retirees with pension income -- the largest single dollar difference between federal and Alabama income for retiree records. Clears with the Tier 1 pension-source imputation; same data limit as the New York government-pension exclusion and the Missouri public pension exemption]'
  us_obligation_interest:
    reference: 'Interest on obligations of the United States or its possessions is exempt (booklet p.7), as is Alabama and Alabama-local municipal interest. The U.S.-obligation share of txbl_int is unobservable, so no subtraction is taken [overstates Alabama tax for Treasury holders] -- the Hawaii convention'
  out_of_state_muni_interest:
    reference: 'Alabama exempts only its OWN municipal interest, so out-of-state municipal interest is taxable in Alabama while federal AGI excludes it entirely. The own-base build starts from taxable interest and never sees exempt_int, so this income is missed [understates Alabama income for holders of other states'' municipal bonds]'
  gross_capital_losses:
    reference: 'Alabama allows the ENTIRE capital loss in the year it occurs, with no $3,000 cap and no carryforward. The model carries the federally capped net, so a record with a loss carryforward is overstated in Alabama [overstates Alabama tax for filers with large realized losses]'
  alabama_state_employee_retirement_contributions:
    reference: 'Contributions to the Alabama State Retirement System are deferred federally but NOT deferred in Alabama, so state and local government employees'' Alabama wages exceed their federal wages (booklet p.8 NOTE). The difference lives between W-2 boxes 1 and 16 and is invisible on a federal record [understates Alabama wages for Alabama public employees]'
  severance_exclusion:
    reference: 'Up to $50,000 of severance, termination or supplemental-income-plan pay received on administrative downsizing is exempt (TY2020 forward; $25,000 for TY2019 and prior). NOTE the TY2020 booklet still prints $25,000 -- the increase was enacted after it went to press, and the TY2021 booklet corrects the record retroactively ("$50,000 for Tax Years 2020 and forward and $25,000 for Tax Years 2019 and prior"). Severance is not separately identified in the microdata; it sits inside wages'
  own_above_the_line_adjustments:
    reference: 'Alabama''s page 2 Part II adjustments differ from the federal set: it HAS an Alabama 529/PACT deduction ($5,000, $10,000 joint), an ABLE deduction ($5,000), adoption expenses, wind/flood retrofit (lesser of 50% or $3,000), catastrophe savings deposits, a small-employer health insurance deduction, a first-time home buyer savings account deduction and a firefighter cancer-premium deduction -- and it has NO student loan interest deduction, NO educator expense deduction and NO deduction for half of self-employment tax. The Alabama-specific items are unobserved contribution- and status-based amounts; the missing federal ones are not subtracted because the own-base build never applied them'
  narrower_dependent_definition:
    reference: 'An Alabama dependent must be a listed relative receiving over 50% support, with no multiple-support agreement and no foster children or cousins, but with no age limit and no gross-income test. The federal dependent count is used [can err in either direction]'

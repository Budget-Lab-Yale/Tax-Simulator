---
# Alabama: Electing Pass-Through Entity tax (Act 2021-423; owner credit Ala. Code 40-18-24.5;
# Ala. Admin. Code r. 810-3-36-.01). Form PTE-E election filed through My Alabama Taxes by the 15th
# day of the 3rd month after year-end; binding until revoked. Eligible: S corporations (40-18-160)
# and Subchapter K entities (40-18-1); one rate for all owners. Entity may not use an NOL
# carryforward. Owners report income and take a refundable credit for their share.
# Codes: method 0 none / 1 credit / 2 exclusion; *_scope 1 all-source / 2 state-source (apportioned).

available:
  value:
    '2017': 0
    '2021': 1
  reference: 'Act 2021-423 (credit at Ala. Code 40-18-24.5); Ala. Admin. Code r. 810-3-36-.01 (Electing Pass-Through Entity Returns), https://www.revenue.alabama.gov/wp-content/uploads/2025/11/810-3-36-.01.pdf (2)(a): "Effective for taxable years beginning on or after January 1, 2021, a Pass-Through Entity may elect"; the rule states no end date and no tie to IRC 164(b)(6), so it runs through 2030'
mandatory:
  value: 0
  reference: 'Ala. Admin. Code r. 810-3-36-.01 (Electing Pass-Through Entity Returns), https://www.revenue.alabama.gov/wp-content/uploads/2025/11/810-3-36-.01.pdf (2)(a)-(d): elective, binding until revoked on Form PTE-E'
method:
  value:
    '2017': 0
    '2021': 1
  reference: 'Ala. Admin. Code r. 810-3-36-.01 (Electing Pass-Through Entity Returns), https://www.revenue.alabama.gov/wp-content/uploads/2025/11/810-3-36-.01.pdf (2)(h): owners report their share of income and receive "a refundable credit ... equal to its pro rata or distributive share of the Alabama income tax paid by the Electing Pass-Through Entity"'
rate:
  value:
    '2017': 0.0
    '2021': 0.05
  reference: 'Ala. Admin. Code r. 810-3-36-.01 (Electing Pass-Through Entity Returns), https://www.revenue.alabama.gov/wp-content/uploads/2025/11/810-3-36-.01.pdf (2)(f)1: "must apply the maximum tax rate provided in 40-18-5"; Alabama Form EPT instructions TY2022, https://www.revenue.alabama.gov/wp-content/uploads/2023/02/22feptinstr.pdf Schedule EPT-K1 column (F) = column (E) "multiplied by 5%". Equals max(st_ord.rates) for AL (5%) every year'
rate_tracks_top:
  value: 1
  reference: 'Ala. Admin. Code r. 810-3-36-.01 (Electing Pass-Through Entity Returns), https://www.revenue.alabama.gov/wp-content/uploads/2025/11/810-3-36-.01.pdf (2)(f)1 (maximum rate in Ala. Code 40-18-5, the individual schedule)'
# null = same as rate
# rate_scorp: omitted, so the schema default (NA) applies
#   reference: 'Ala. Admin. Code r. 810-3-36-.01 (Electing Pass-Through Entity Returns), https://www.revenue.alabama.gov/wp-content/uploads/2025/11/810-3-36-.01.pdf (1)(a), (2)(f): one rate for S corporations and Subchapter K entities'
credit_share:
  value:
    '2017': 0.0
    '2021': 1.0
  reference: 'Alabama Form EPT instructions TY2022, https://www.revenue.alabama.gov/wp-content/uploads/2023/02/22feptinstr.pdf p.1 (Act 2021-423: credit "equal to its pro rata or distributive share of the Alabama income tax paid"); Ala. Admin. Code r. 810-3-36-.01 (Electing Pass-Through Entity Returns), https://www.revenue.alabama.gov/wp-content/uploads/2025/11/810-3-36-.01.pdf (2)(h)'
credit_refundable:
  value: 1
  reference: 'Ala. Admin. Code r. 810-3-36-.01 (Electing Pass-Through Entity Returns), https://www.revenue.alabama.gov/wp-content/uploads/2025/11/810-3-36-.01.pdf (2)(h) "A refundable credit"; Ala. Code 40-18-24.5 heading "Refundable Credit for Certain Owners ... of Electing Pass-Through Entities" (Justia 2024 code index)'
# NA: searched the EPT rule, Form EPT instructions and DOR FAQs; none says whether owners add back the entity's deduction for the Alabama tax
# addback: omitted, so the schema default (0) applies
#   reference: 'Not stated in Ala. Admin. Code r. 810-3-36-.01 (Electing Pass-Through Entity Returns), https://www.revenue.alabama.gov/wp-content/uploads/2025/11/810-3-36-.01.pdf or Alabama Form EPT instructions TY2022, https://www.revenue.alabama.gov/wp-content/uploads/2023/02/22feptinstr.pdf; Ala. Code 40-18-24.5 full text not read (justia 403)'
resident_scope:
  value: 2
  reference: 'Ala. Admin. Code r. 810-3-36-.01 (Electing Pass-Through Entity Returns), https://www.revenue.alabama.gov/wp-content/uploads/2025/11/810-3-36-.01.pdf (1)(b): taxable income "must be apportioned in accordance with 40-27-1" -- one apportioned base for every owner'
nonresident_scope:
  value: 2
  reference: 'Ala. Admin. Code r. 810-3-36-.01 (Electing Pass-Through Entity Returns), https://www.revenue.alabama.gov/wp-content/uploads/2025/11/810-3-36-.01.pdf (1)(b) (apportioned base); electing entities are exempt from the 40-18-24.2 nonresident composite payment, (2)(d)1'
# NA: no source found on whether the AL resident credit covers another state's PTET
# resident_credit_for_other_state_ptet: omitted, so the schema default (NA) applies
#   reference: 'Ala. Code 40-18-21 (credit for taxes paid other states) not checked against PTET; no ALDOR guidance found'
surtax_rate:
  value: 0
  reference: 'No surtax-layer entity tax in AL (searched the PTET statute and revenue-department guidance cited above)'
surtax_credit_share:
  value: 0
  reference: 'No surtax-layer entity tax in AL'
local_rate:
  value: 0
  reference: 'No local entity-level income tax tied to the AL election'
local_credit_share:
  value: 0
  reference: 'No local entity-level income tax tied to the AL election'

# The YCTC is one refundable credit per eligible return, not an amount for
# each young child. A claimant needs a CalEITC-qualifying child under age six.
# The 2022 zero/negative-earned-income expansion uses a current-year loss proxy
# because Form 540 loss components are not completely available in the PUF.

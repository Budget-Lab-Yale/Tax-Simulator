  reference: 'Tax Rate Chart, Section A, each booklet as cited under brackets ("$X plus Y% of excess over $Z"), and Section B line 6 "Enter the tax from your tax bracket - before applying the percent". Band 2 for 2017-2022 is 1.5% times that year''s first taxable dollar (2017: 1.5% x $101 = 1.515), which reproduces the chart''s "1.5% of the Missouri taxable income" exactly. TY2026 IS PROJECTED, not transcribed: the chart is unpublished, so the bases are the cumulative tax integrated over the 2026 withholding-formula brackets and rounded to whole dollars. Missouri''s own printed bases do not always round that way (TY2023 prints $180 at $7,242 against $181.05 integrated), so expect sub-$2 deviations for TY2026 until the booklet appears'

# Married filing combined: deductions are pooled at the return level, the
# remainder is split between spouses by their shares of Missouri AGI, and
# the schedule is run on each share. See st_tax.R for the construction.
combined_split:
  value: 1
  reference: 'MO-1040 lines 7Y/7S (income percentages), 26 (subtotal after total deductions), 27Y/27S (Line 26 x the percentages), 29Y/29S (taxable income) and 30Y/30S; the tax chart page states "A separate tax must be computed for you and your spouse" in every booklet 2017-2025. RSMo 143.031 requires a combined return for spouses filing jointly for federal purposes, so this is mandatory rather than an election'
combined_split_round:
  value: 0.01
  reference: 'MO-1040 instructions, "Line 7 - Income Percentages": "The total entered on Line 7 must equal 100 percent - round to the nearest percentage. For example, 84.3 percent would be shown as 84 percent and 97.5 percent would be shown as 98 percent" (2024 booklet p.7, identical wording each year)'

documented_not_modeled:
  lump_sum_distribution_tax:
    reference: 'MO-1040 line 34 adds a tax of 10% of the federal Form 4972 tax on a lump sum distribution, because that income never entered Missouri AGI (2024 booklet p.10). Form 4972 elections are not modeled'
  low_income_housing_recapture:
    reference: 'MO-1040 line 34 also carries recapture of the Missouri low income housing credit. Certificated credit histories are not modeled'
  trigger_rate_reductions:
    reference: 'RSMo 143.011.4 permits two further top-rate reductions of 0.1pp each (to 4.6% and then 4.5%) once net general revenue exceeds both the highest of the three preceding fiscal years by $200 million and the fifth preceding year adjusted for inflation. Enacted rates only are encoded, per the North Carolina and Mississippi trigger precedent'

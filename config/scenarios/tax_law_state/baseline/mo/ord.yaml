---
# Missouri: rate schedule (MO-1040 line 30; the "Tax Rate Chart", Section A
# of the tax chart page in each booklet).
#
# THREE THINGS MAKE THIS SCHEDULE UNUSUAL.
#
# (1) It is a PUBLISHED BASE-AMOUNT schedule, not a smooth marginal one.
# Section B of the chart page ("Tax Calculation Worksheet") has the taxpayer
# take the bracket's printed base amount and add the rate times the excess
# over the bracket floor -- and the printed bases are NOT always the
# continuous cumulative tax. TY2023 prints $180 at $7,242 where integrating
# the rates gives $181.05, and $234 at $8,449 where integration gives
# $235.37. Encoding this as a smooth schedule would be wrong by up to about
# $1.40 for every Missourian above the second-to-top bracket, so the
# base_amounts family (Ohio precedent) carries the printed values.
#
# (2) Through TY2022 the second band taxes the WHOLE taxable income at 1.5%,
# not the excess: "At least $101 but not over $1,008 ... 1.5% of the
# Missouri taxable income". The base amount for that band is therefore the
# tax at its own first dollar (1.5% x 101 = 1.515), which makes
# base + rate x (TI - 101) identically equal to 1.5% x TI. From TY2023 the
# first bracket is a true zero bracket and the 1.5% rung is gone.
#
# (3) Brackets are equal-width and indexed annually (RSMo 143.011.2), so
# every value below is transcribed from that year's own chart rather than
# indexed by the model.
#
# The rate ladder shortened over the window -- eleven bands (incl. the zero
# band) in 2017-2018, ten in 2019-2022 after HB 2540 deleted the 5.5% rung,
# eight from TY2023 after SB 3. Shorter years are padded by repeating the
# top band, the KY convention: the padded entries can never be selected
# because their bracket floor equals the top band's.

# Bracket floors. Band 2's floor is the first taxable dollar (chart: "At
# least $101"), which pairs with the derived base amount described above.
brackets:
  value:
    '2017': [0.0, 101.0, 1008.0, 2016.0, 3024.0, 4032.0, 5040.0, 6048.0, 7056.0, 8064.0, 9072.0]

  reference: 'SB405: residents age 65+'

senior_credit_income_base:
  value: 1
  reference: 'FAGI cliffs'

senior_limit_single:
  value:
    '2017': 0
    '2022': 100000
  reference: 'FAGI <= $100,000 (single tier)'

senior_limit_joint:
  value:
    '2017': 0
    '2022': 150000
  reference: 'FAGI <= $150,000 (joint/HoH tier)'

# Child and dependent care credit (Tax-Gen 10-716; Form 502CR Part B), added
# 2026-10-09. Was missing entirely: the source packet's "undiagnosed" care
# residual (care records matching 0.447 against 0.740) and the PolicyEngine
# 2021 care misses were this credit
cdctc_style:
  value: 3
  reference: 'Form 502CR Part B line 3: a decimal from the CREDIT FOR CHILD AND DEPENDENT CARE EXPENSES CHART times the federal credit (line 2); Tax-Gen 10-716(c)-(d)'

cdctc_fed_base:
  value: 0
  reference: 'Form 502CR Part B line 2: "your federal Child and Dependent Care Credit from federal Form 2441" -- the credit claimed (10-716(a)(2): "properly claimed ... under section 21"); TY2021 that is the refundable ARPA credit'

cdctc_rate_income_base:
  value: 1
  reference: 'Form 502CR Part B line 1: federal adjusted gross income from Form 502 line 1'

cdctc_rate_max:
  value:
    '2017': 0.325
    '2019': 0.32
  reference: 'TY2017-18: 32.5% (10-716(c)(1) before Laws of Maryland 2019 ch. 432, SB 870, struck text; DLS fiscal note SB 422 of 2018). TY2019+: 32% (10-716(c) as amended by 2019 ch. 432, "applicable to all taxable years beginning after December 31, 2018"; 2023-2025 502CR instructions: "The credit starts at 32% of the federal credit allowed")'

cdctc_rate_floor:
  value: 0
  reference: 'No floor: the decimal steps down until the AGI cap'

cdctc_rate_po_per_1k:
  value:
    '2017': 0.0325
    '2019': 0.0032
  reference: 'Read as the per-step decrement (cdctc_rate_po_step is finite). TY2017-18: "reduced by 10% for each $1,000 or fraction of $1,000" over $41,000 = 0.0325 of the 32.5% share (pre-2019 10-716(d)(1)). TY2019+: "reduced by 1% for each $2,000 (joint: $3,000) or fraction thereof" = 0.0032 of the 32% share (10-716(d)); the 2024 chart steps 0.3200, 0.3168, 0.3136, ...'

care_po_start_individual:
  value:
    '2017': 41000
    '2019': 30000
  reference: 'TY2017-18: $41,000 (pre-2019 10-716(d)(1); the separate-filer $20,500 / $500 steps never bind because a separate filer cannot claim the federal credit). TY2019+: $30,000 (10-716(d); 2024 chart first reduced band $30,001-$32,000 at 0.3168). Not indexed'

care_po_start_joint:
  value:
    '2017': 41000
    '2019': 50000
  reference: 'TY2017-18: $41,000, same as individuals (pre-2019 law has no joint schedule). TY2019+: $50,000 (10-716(d); 2024 joint chart first reduced band $50,001-$53,000). Not indexed'

care_po_step_individual:
  value:
    '2017': 1000
    '2019': 2000
  reference: 'TY2017-18 $1,000; TY2019+ $2,000 "or fraction thereof" (10-716(d)). The 2024 individual chart tightens to $1,000 bands from $103,001 up to the cap (0.1984 ... 0.1792), at odds with the statute; the statute is encoded and the chart quirk documented (at most ~$10 on the affected band)'

care_po_step_joint:
  value:
    '2017': 1000
    '2019': 3000
  reference: 'TY2017-18 $1,000; TY2019+ $3,000 "or fraction thereof" (10-716(d); 2024 joint chart bands of $3,000 throughout)'


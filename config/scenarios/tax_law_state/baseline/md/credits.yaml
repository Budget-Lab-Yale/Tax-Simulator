    '2022': 1750
  reference: '$1,750 MFJ/QSS/HoH with both spouses 65+'

senior_credit_one65_amount:
  value:
    '2017': 0
    '2022': 1000
  reference: 'Joint returns where only one spouse is 65+: $1,000'

senior_credit_min_age:

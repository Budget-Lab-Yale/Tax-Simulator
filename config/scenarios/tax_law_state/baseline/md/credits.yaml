# Poverty level credit (Tax-Gen 10-709; Form 502 line 23, Worksheet 18B),
# added 2026-10-09
pov_credit_rate:
  value: 0.05
  reference: 'Worksheet 18B line 5: "Multiply Line 2 by 5% (.05). This is your State Poverty Level Credit" (2023-2025 booklets; 10-709). Line 2: wages, tips and net self-employment profit, no farm or business loss. Nonrefundable ("This is not a refundable credit"); dependent filers (status 6) ineligible'

pov_credit_income_base:

---
# Maryland: credits (state lines only; local EITC/poverty credits ride the
# county tax and are out of scope).
#   - EITC (Tax-Gen 10-704): 50% of the federal EIC nonrefundable, OR the
#     refundable option (p x federal EIC less state tax) -- the VA-style
#     dual-option machinery reproduces the worksheet outcomes exactly.
#     Childless non-joint filers (2021+): 100% of the federal EIC, capped,
#     fully refundable, replacing both options (Worksheet 18A.1).
#   - CTC (10-751): $500/child under 6 for FAGI <= $15,000 from 2023
#     (SB552), 2025 phase-out $50 per $1,000 (BRFA). The 2021-2022
#     disabled-child-only version (FAGI <= $6,000) is unobservable and
#     de-minimis; omitted [documented].
#   - Senior tax credit (SB405, 2022+): $1,000 single / $1,750 joint
#     (joint with one 65+ spouse: $1,000), FAGI cliffs 100k/150k,
#     nonrefundable.
#   - Child and dependent care credit (10-716, Form 502CR Part B): a share
#     of the federal credit that steps down with federal AGI, zero above an
#     AGI cap; refundable below a lower cap from TY2019 (Worksheet 21B).
#     "Individual" thresholds cover single, separate and head-of-household
#     filers; only married couples filing jointly get the joint ones.
#   - Poverty level credit (10-709): 5% of earned income for sub-poverty
#     households, nonrefundable (Worksheet 18B). Encoded 2026-10-09: it was
#     omitted as de minimis on the view that it binds only when tax exceeds
#     50% of the federal EIC, but that is every sub-poverty household with
#     no EIC child -- adult dependents, childless filers over the EIC's
#     income or age limits -- and those were PolicyEngine misses.

filing_status_mapper:
  senior_credit_amount:
    '1': senior_amount_single
    '2': senior_amount_joint
    '3': senior_amount_single
    '4': senior_amount_joint
  senior_credit_income_limit:
    '1': senior_limit_single
    '2': senior_limit_joint
    '3': senior_limit_single
    '4': senior_limit_joint
  cdctc_rate_po_start:
    '1': care_po_start_individual
    '2': care_po_start_joint
    '3': care_po_start_individual
    '4': care_po_start_individual
  cdctc_rate_po_step:
    '1': care_po_step_individual
    '2': care_po_step_joint
    '3': care_po_step_individual
    '4': care_po_step_individual
  cdctc_cap_thresh:
    '1': care_agi_cap_individual
    '2': care_agi_cap_joint
    '3': care_agi_cap_individual
    '4': care_agi_cap_individual
  cdctc_ref_agi_limit:
    '1': care_ref_agi_limit_individual
    '2': care_ref_agi_limit_joint
    '3': care_ref_agi_limit_individual
    '4': care_ref_agi_limit_individual

# 50% nonrefundable option
eitc_match:
  value: 0.5
  reference: 'Form 502 line 22: 50% of the federal EIC, nonrefundable, all years 2017-2025'

eitc_refundable:
  value: 0
  reference: 'Line 22 credit is nonrefundable (the refundable piece is the alt option)'

# Refundable option (Worksheet 18A): p x federal EIC less state tax
eitc_match_alt:
  value:
    '2017': 0.27
    '2018': 0.28
    '2020': 0.45
  reference: 'Refundable EIC percentage: 27% (2017), 28% (2018-19), 45% TY2020-2022 (RELIEF Act SB496, retroactive), 45% permanent from 2023 (Family Prosperity Act SB552)'

eitc_refundable_alt:
  value: 1
  reference: 'Worksheet 18A refundable option'

eitc_alt_excess:
  value: 1
  reference: 'Not a choice: Form 502 line 22 (50% of the federal EIC, limited to tax) stacks with the line 23-24 nonrefundable credits, and the refundable EIC (line 42, Worksheet 18A) is the refundable percentage of the federal EIC less the Maryland tax (lines 21-21a, before credits). Same EIC benefit as the choice model; differs only when other nonrefundable credits (care, senior) exist. Changed 2026-10-09 (test MD-11f, PolicyEngine record 12337)'

# Childless non-joint filers, 2020+ (Worksheet 18A.1)
eitc_childless_match:
  value:
    '2017': 0
    '2020': 1
  reference: 'Tax-General 10-704(b)(3)(ii)-(iv) as enacted by Laws of Maryland 2021 ch. 39 (SB 496, the RELIEF Act, approved February 15, 2021): "for a taxable year beginning after December 31, 2019, but before January 1, 2023, the credit ... for an individual without a qualifying child is equal to 100% of the earned income credit allowable ... under section 32", capped and refundable; continued from TY2023 by later law (Worksheet 18A.1 in the 2021+ booklets). Corrected 2026-10-07: had started in TY2021 ("TY2020 applicability UNVERIFIED"); the statute text itself covers TY2020, although the 2020 booklet predates the act (State-EITC-Align packet MD-2020-01 raised it; verified here against the chapter law)'

eitc_childless_cap:
  value:
    '2017': .inf
    '2020': 530
    '2023': 600
    '2024': .inf
  reference: 'Caps: $530 TY2020-2022 (10-704(b)(3)(iii) as enacted by 2021 ch. 39: "may not exceed $530 for a taxable year"), $600 (2023), none 2024+ (booklets)'

eitc_childless_min_age_disregard:
  value:
    '2017': 0
    '2018': 1
  reference: 'Tax-General 10-704(b)(3) (Laws of Maryland 2018 ch. 612, HB 856, "applicable to all taxable years beginning after December 31, 2017"): for an individual without a qualifying child the IRC 32 credit "is calculated without regard to the minimum age requirement under section 32(c)(1)(A)(ii)(II)". 2018 and 2020 Resident Booklets, Instruction 18: "If you do not meet the minimum age requirement under the federal credit and are otherwise eligible for the federal credit for those without a qualifying child, you may claim the state earned income credit (calculate federal earned income credit disregarding the minimum age requirement)". Applies to every state EITC computation for such filers (50% nonrefundable, refundable percentage, and the 2020+ 100% childless credit). Added 2026-10-07: under-25 childless filers had received nothing'

# MD CTC (10-751), modelable from 2023
ctc_style:
  value:
    '2017': 0
    '2023': 3
  reference: 'Family Prosperity Act (SB552, 2023): $500 per child under 6, FAGI <= $15,000; refundable (502CR Part CC). 2021-22 disabled-child version omitted [unobservable, de-minimis]'

ctc_young_amount:
  value:
    '2017': 0
    '2023': 500
  reference: '10-751: $500 per qualified child'

ctc_min_child_age:
  value: 0
  reference: '10-751 (2023+): child under 6'

ctc_max_child_age:
  value: 5
  reference: '10-751 (2023+): under 6 (the over-5 disabled category is unobservable; omitted)'

ctc_po_thresh:
  value:
    '2017': .inf
    '2023': 15000
  reference: 'FAGI limit $15,000 (cliff 2023-24; phase-out start 2025)'

ctc_po_rate:
  value:
    '2017': 0
    '2023': 500
    '2025': 0.05
  reference: '2023-24: cliff (encoded as an immediate full reduction above the threshold); 2025 (BRFA): $50 per $1,000 of excess, gone at $24,001 (continuous approximation of the rounded-up step [documented])'

ctc_po_base:
  value: 1
  reference: 'Phase-out on federal AGI'

ctc_refundable:
  value: 1
  reference: '10-751: refundable (Worksheet 21C)'

# Senior tax credit (SB405 of 2022), nonrefundable
senior_amount_single:
  value:
    '2017': 0
    '2022': 1000
  reference: '2022+ booklets Instr. 18: $1,000 for 65+ single (MFS inclusion UNVERIFIED; encoded eligible)'

senior_amount_joint:

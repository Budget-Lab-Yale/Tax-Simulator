---
# Oregon: Pass-Through Entity Elective (PTE-E) tax, a "business alternative
# income tax" (BAIT).
#
# Law: SB 727 (2021; Or Laws 2021 ch. 589) for tax years beginning on or
# after 1/1/2022 and before 1/1/2024. SB 1524 (2022; Or Laws 2022 ch. 82)
# section 3: members add back the PTE-E tax deducted federally. HB 2083
# (2023; Or Laws 2023 ch. 399) extended the sunsets to tax years beginning
# before 1/1/2026 (OLIS catchline "Extends sunsets for pass-through business
# alternative income tax and related personal income tax credit"). SB 1526
# (2024; Or Laws 2024 ch. 52) made technical changes (trusts as qualifying
# members from TY2024, per legislative testimony; not read in the act).
# SB 1510 (2026; Or Laws 2026 ch. 75) "Extends the applicability of the
# pass-through business alternative income tax and tax credit through the
# 2027 tax year" (OLIS summary); DOR: "through tax years beginning before
# January 1, 2028". Signing date not confirmed: OLIS shows chapter 75
# assigned (i.e. enacted) without the date on the overview page.
# The program also ends if the federal SALT limitation expires or is
# repealed (DOR page).
#
# Election: annual, by filing Form OR-21 by the due date including
# extensions. Qualifying members: individuals (and grantor trusts; other
# trusts from TY2024). Not held by the parameters:
#   - Graduated entity schedule (rates/brackets below) applies to the
#     ENTITY's total distributive proceeds of qualifying members, not to the
#     owner's share
#   - Composite-return filers may claim the credit on the OR-OC
#

available:
  value:
    '2017': 0
    '2022': 1
    '2028': 0
  reference: 'Or Laws 2021 ch. 589 (SB 727) sec. 1-2, TY beginning 1/1/2022-12/31/2023; Or Laws 2023 ch. 399 (HB 2083) extended to TY beginning before 1/1/2026; Or Laws 2026 ch. 75 (SB 1510) extended through TY2027 (OLIS SB 1510 overview, https://olis.oregonlegislature.gov/liz/2026R1/Measures/Overview/SB1510); Oregon DOR PTE-E page ("Senate Bill 1510 in the 2026 legislative session extends the PTE-E program through tax years beginning before January 1, 2028"; "The law will expire if the federal SALT deduction limitation expires or is repealed"), https://www.oregon.gov/dor/programs/businesses/Pages/Pass-Through-Entity-Elective-Tax.aspx'
mandatory:
  value: 0
  reference: 'Oregon DOR PTE-E page: entities "may elect annually"'
method:
  value:
    '2017': 0
    '2022': 1
  reference: 'Or Laws 2021 ch. 589 (SB 727): member credit for pro rata share of PTE-E tax; Oregon DOR PTE-E FAQ 32 (credit code 900 on OR-ASC / OR-ASC-NP)'
# Top rate of the entity schedule; see rates/brackets
rate:
  value: 0.099
  reference: 'Or Laws 2021 ch. 589 (SB 727) sec. 2; Oregon DOR PTE-E page: "9 percent tax on the first $250,000 of distributive proceeds and 9.9 percent tax on any amount exceeding $250,000"'
# Own statutory schedule. It equals the individual 9%/9.9% top two rates
# in baseline/or/ord.yaml but is not defined by reference to ORS 316.037
rate_tracks_top:
  value: 0
  reference: 'Or Laws 2021 ch. 589 (SB 727) sec. 2 sets the 9%/9.9% schedule directly'
# rate_scorp: omitted, so the schema default (NA) applies -- NA = same as rate (schema default); one schedule for partnerships and S corporations
#   reference: 'Oregon DOR PTE-E page'
rates:
  value: [0.09, 0.099]
  reference: 'Oregon DOR PTE-E page and FAQ 24 (multiply by 9 percent up to $250,000; 9.9 percent above, plus $22,500)'
brackets:
  value: [0, 250000]
  reference: 'Oregon DOR PTE-E FAQ 24; brackets are on the ENTITY''s total distributive proceeds, not indexed'
credit_share:
  value: 1
  reference: 'Or Laws 2021 ch. 589 (SB 727): credit equal to the member''s pro rata share of the tax paid; Oregon DOR PTE-E page'
credit_refundable:
  value: 1
  reference: 'Oregon DOR PTE-E FAQ 32 ("Claim the credit on the Form OR-ASC or OR-ASC-NP as a refundable credit using the code 900") and FAQ 34 ("Is the PTE elective tax credit Refundable? Yes")'
addback:
  value: 1
  reference: 'Or Laws 2022 ch. 82 (SB 1524) sec. 3, quoted in Oregon DOR PTE-E FAQ 31 ("a member of a pass-through entity shall add back any amount of Oregon tax imposed under this chapter and deducted by the pass-through entity at the entity level for federal income tax purposes"); FAQ 33 (addition code 167)'
# The tax base is distributive proceeds FROM OREGON SOURCES for every
# member, resident or not
resident_scope:
  value: 2
  reference: 'Oregon DOR PTE-E FAQ 16 ("The PTE-E tax is based on distributive proceeds from Oregon sources") and FAQ 27 (apportionment); Form OR-21 instructions'
nonresident_scope:
  value: 2
  reference: 'Oregon DOR PTE-E FAQ 16 and 27'
resident_credit_for_other_state_ptet:
  value: 1
  reference: 'OAR 150-316-0082 ("An individual who owns an interest in a pass-through entity may claim a credit for tax paid to another state by the entity if (a) The individual is an Oregon resident; (b) [the tax] is computed upon the proportionate share of the entity''s income which is taxable to the individual under ORS 316.048; and (c) An addition is made ... for the individual''s share of any tax paid ... deducted ... in determining federal taxable income"); ORS 316.082'
surtax_rate:
  value: 0
  reference: 'No second entity-level layer'
surtax_credit_share:
  value: 0
  reference: 'No second entity-level layer'
local_rate:
  value: 0
  reference: 'Local income taxes (Portland Metro SHS, Multnomah PFA) have no tie to the PTE-E election (not researched further)'
local_credit_share:
  value: 0
  reference: 'See local_rate'

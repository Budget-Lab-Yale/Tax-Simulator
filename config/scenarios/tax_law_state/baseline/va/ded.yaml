  reference: '2017 booklet; Va. Schedule A instructions 2019-2025, HoH column (federal filing status governs the limitation)'

# Child and dependent care expenses DEDUCTION (Schedule ADJ code 101): the
# expenses on which the federal CDCTC is based, capped at $3,000 one /
# $6,000 two-plus qualifying dependents in every year INCLUDING TY2021
# (booklet retained the caps despite ARPA's federal $8k/$16k; booklet
# treated as controlling). Qualifying dependents counted by age <= 12
# (disabled dependents/spouses unobserved; known-difference)
care_exp_ded:
  value: 1
  reference: 'Schedule ADJ deduction code 101 (2017-2025 booklets); Va. Code 58.1-322.03(4)'
care_exp_ded_per_dep_cap:
  value: 3000
  reference: 'Code 101 instructions: "up to $3,000 for one dependent and $6,000 for two or more" (verbatim in every 2017-2025 booklet, incl. 2021)'
care_exp_ded_dep_limit:
  value: 2
  reference: 'Code 101 instructions ($6,000 maximum = two qualifying dependents)'
care_exp_ded_age_limit:
  value: 12
  reference: 'IRC 21 qualifying-person definition (under age 13), referenced by Va. Code 58.1-322.03(4)'

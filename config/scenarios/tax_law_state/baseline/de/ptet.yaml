---
# Delaware: NO pass-through entity tax. HB 489 (2022) died. Arkansas DFA's
# list for TY2026 (6/3/2026) lists DE as having no similar tax. The DE source
# packet (research/source_packets/de.md line 18) agrees: "no PTET".
# Wilmington's city earned income tax does not reach pass-through profits
# in a way relevant here.
#
# All parameters are at their neutral no-PTET values except
# resident_credit_for_other_state_ptet, which matters for a Delaware
# resident who owns an interest in another state's electing entity.
#

available:
  value: 0
  reference: 'No PTET: HB 489 (2022) not enacted; Arkansas DFA TY2026 list https://www.dfa.arkansas.gov/wp-content/uploads/States_with_Similar_Tax_PET_2026.pdf (DE: no similar tax); research/source_packets/de.md'

mandatory:
  value: 0
  reference: 'No PTET'
method:
  value: 0   # none
  reference: 'No PTET'
rate:
  value: 0
  reference: 'No PTET'
rate_tracks_top:
  value: 0
  reference: 'No PTET'
# rate_scorp: omitted, so the schema default (NA) applies -- no PTET
#   reference: 'No PTET'
credit_share:
  value: 0
  reference: 'No PTET'
credit_refundable:
  value: 0
  reference: 'No PTET'
addback:
  value: 0
  reference: 'No PTET'
# resident_scope: omitted, so the schema default (NA) applies -- no PTET
#   reference: 'No PTET'
# nonresident_scope: omitted, so the schema default (NA) applies -- no PTET
#   reference: 'No PTET'

# resident_credit_for_other_state_ptet: omitted, so the schema default (NA) applies -- no DE guidance found on other-state entity-level taxes
#   reference: 'Unresolved. 30 Del. C. 1111 (resident credit for taxes paid to another state) -- no Division of Revenue guidance found on whether an entity-paid PTET of another state qualifies. Searched revenue.delaware.gov and practitioner summaries'

surtax_rate:
  value: 0
  reference: 'No PTET'
surtax_credit_share:
  value: 0
  reference: 'No PTET'
local_rate:
  value: 0
  reference: 'Wilmington city wage/net-profits tax is not tied to any entity election'
local_credit_share:

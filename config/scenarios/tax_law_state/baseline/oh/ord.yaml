# Ohio: rate schedule on taxable NONBUSINESS income (ORC 5747.02; IT 1040
# line 8a), transcribed from each year's instruction booklet rate table and
# verified against ORC 5747.02(A)(2)-(3) for 2023-2026. Ohio publishes
# statutory BASE AMOUNTS (tax = base + rate x excess over the bracket lower
# bound) with a cliff at the zero-bracket top from 2019 (the first taxed
# dollar owes the full base) and an internal discontinuity at $100,000 in
# 2025 ($2,394.32 statutory base vs $2,375.63 continuation) -- encoded via
# the base_amounts family, which preserves the published discontinuities.
# 10-element uniform schedule padded by repeating the top bracket/rate/base.
# Bracket indexing (GDP deflator, nearest $50) applied 2018/2020/2022 and
# suspended 2019 (HB 166 s.757.160), 2021 (HB 110 s.803.97(B)), 2023-24
# (HB 33 s.757.50), 2025-26 (HB 96 s.757.120(A)); 2027+ carries the 2026
# flat schedule forward (projection: indexing scheduled to resume under
# continuing law).


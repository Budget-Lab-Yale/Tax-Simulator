---
# Illinois: exemption allowance (IL-1040 Step 4; 35 ILCS 5/204)
# Values 2017-2026 transcribed from each year's IL-1040 instructions /
# Bulletin FY 2026-15; projected after 2026 by statute's CPI rule (COLA vs
# 2011 CPI, rounded DOWN to $25 -- approximated here as CPI growth off the
# 2026 published value). 2023 was statutorily frozen at $2,425 (COLA
# suspended for that year only).

filing_status_mapper:
  po_thresh:
    '1': po_thresh_single
    '2': po_thresh_joint
    '3': po_thresh_single
    '4': po_thresh_single

# Personal exemption per allowable exemption (taxpayer, spouse, dependents)
personal_amount:
  value:
    '2017': 2175
    '2018': 2225
    '2019': 2275
    '2020': 2325
    '2021': 2375
    '2022': 2425
    '2023': 2425
    '2024': 2775
    '2025': 2850
    '2026': 2925
  reference: '35 ILCS 5/204(b),(d-5); IL-1040 Instr. Step 4 each year; Bulletin FY 2026-15; IL DOR Q&A 851'
  i_measure:
    '2017': cpi
  i_base_year:
    '2017': NA
    '2026': 2025
  i_direction: -1
  i_increment: 25

# Dependent exemption (same amount per dependent as personal)
dep_amount:
  value:
    '2017': 2175
    '2018': 2225
    '2019': 2275
    '2020': 2325
    '2021': 2375
    '2022': 2425
    '2023': 2425
    '2024': 2775
    '2025': 2850
    '2026': 2925
  reference: '35 ILCS 5/204; IL-1040 Step 4 Line 10d'
  i_measure:
    '2017': cpi
  i_base_year:
    '2017': NA
    '2026': 2025
  i_direction: -1
  i_increment: 25

# Additional exemption per person aged 65+ and per legally blind person
# (not indexed)
aged_addl:
  value: 1000
  reference: '35 ILCS 5/204(c),(d); IL-1040 Lines 10b/10c'
blind_addl:
  value: 1000
  reference: '35 ILCS 5/204(c),(d); IL-1040 Lines 10b/10c'

# High-income exemption disallowance: full cliff (not a phase-out) when
# federal AGI exceeds threshold; not indexed
po_thresh_single:
  value: 250000
  reference: '35 ILCS 5/204(g) (P.A. 100-0022), TY2017+'
po_thresh_joint:
  value: 500000
  reference: '35 ILCS 5/204(g) (P.A. 100-0022), TY2017+'

# Phase-out type: 0 = cliff (full disallowance above threshold)
po_type:
  value: 0
  reference: '35 ILCS 5/204(g); cliff, no gradual phase-out'

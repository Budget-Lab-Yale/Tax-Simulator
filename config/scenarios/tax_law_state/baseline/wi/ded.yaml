---
# Wisconsin: SLIDING standard deduction (71.05(22)): max less a fixed
# per-status rate (12% single, 19.778% MFJ/MFS, 22.515% HoH) times WI
# income over the phase-out start, floored at zero; HoH floors at the
# single-filer schedule (second sliding pair). No WI itemized deduction --
# the itemized-deduction CREDIT lives in credits.yaml. Maxima/starts
# indexed (71.05(22)(ds)); odd-year phase-out starts recovered from the
# published tables [flagged (t) in the research notes]. 2026+ carries 2025.

filing_status_mapper:
  std_amount:
    '1': std_max_single
    '2': std_max_married
    '3': std_max_mfs
    '4': std_max_head
  std_po_thresh:
    '1': po_start_single
    '2': po_start_married
    '3': po_start_mfs
    '4': po_start_single
  std_po_rate:
    '1': rate_single
    '2': rate_married
    '3': rate_married
    '4': rate_head
  std_amount2:
    '1': zero2
    '2': zero2
    '3': zero2
    '4': std_max_single
  std_po_rate2:
    '1': zero2
    '2': zero2
    '3': zero2
    '4': rate_single


---
# Wisconsin: base (Form 1; raw/wi_research_core.md). Federal AGI start with
# Schedule I fixed-date conformity (IRC as of 12/31/2016 for 2017;
# 12/31/2017 for 2018-20 via 2017 Act 231, TCJA adopted whole; 12/31/2020
# for 2021-22; 12/31/2022 for 2023-25, OBBBA not adopted but its marquee
# items are below-AGI). Modeled rolling (group 0) with the targeted
# nonconformity items documented.

start_point:
  value: 1
  reference: 'Form 1 line 1 = federal adjusted gross income, 2017-2025'

documented_not_modeled:
  conformity:
    value: 0
    reference: 'Wis. Stat. 71.01(6) fixed-date conformity updated by acts (2017 Act 231 adopted TCJA whole for 2018+); modeled rolling. Targeted gaps documented: 2020-21 above-the-line charitable addback, pre-ARPA federal EITC base 2021-22, 10% medical floor in the itemized credit 2017/2019/2020'
  ui_partial_exclusion:
    value: 0
    reference: 'WI 71.05(6)(b)8: pre-1987-federal-style partial UI exclusion (50% over a base); worksheet-dependent, small at PUF incomes; omitted [known-difference]'
  capital_loss_limit:
    value: 0
    reference: 'WI net capital loss limit $500/year through 2022 ($3,000/$1,500 from 2023, 71.05(10)(c)); the PUF gain concept embeds the federal $3,000 limit; not separable [known-difference 2017-2022]'
  military_and_exempt_pensions:
    value: 0
    reference: 'Military retirement fully exempt ALL years (71.05(1)(a)), plus pre-1964 federal/WI government pensions; pension source unobservable [known-difference, one-sided]'
  retirement_2025_election:
    value: 0
    reference: '2025 Act 15: $24,000 ($48,000 MFJ both 67+) retirement subtraction with NO income limit but total forfeiture of credits (min-liability election); TY2025 only in window; omitted pending election machinery [known-difference, 2025]'

add_exempt_int:
  value: 1
  reference: 'Form 1 line 2 addition: non-Wisconsin state/municipal bond interest; WI-source exempt; own-state share unobserved, 75% convention [known-difference]'

own_state_exempt:
  value: 1
  reference: 'Same provision'

sub_us_int:
  value: 1
  reference: 'US-obligation interest subtraction; PUF share unobserved [known-difference]'

sub_state_ref:
  value: 1
  reference: 'State income tax refunds in FAGI subtracted (Form 1 subtractions), all years'

ss_sub_share:
  value: 1
  reference: 'Form 1: Social Security benefits fully exempt (subtraction of the federally taxable amount), all years 2017-2025'

# 30% net long-term capital gain exclusion (60% farm assets -- farm share
# unobservable, 30% used)
cap_gains_excl_share:
  value: 0.30
  reference: 'Wis. Stat. 71.05(6)(b)9; Schedule WD: 30% exclusion of net LTCG (60% for farm assets [known-difference]), all years'

# $5,000 retirement income exclusion at 65+ with an FAGI cliff
filing_status_mapper:
  pension_excl_agi_limit:
    '1': pension_agi_limit_single
    '2': pension_agi_limit_joint
    '3': pension_agi_limit_single
    '4': pension_agi_limit_single

pension_excl_65plus:
  value: 5000
  reference: 'Wis. Stat. 71.05(1)(ae): up to $5,000 of retirement plan/IRA income per person 65+, all years'

pension_excl_min_age:
  value: 65
  reference: 'Same provision'

pension_excl_under65:
  value: 0
  reference: '65+ only'

pension_agi_limit_single:
  value: 15000
  reference: 'FAGI < $15,000 (single) cliff, unindexed, all years'

pension_agi_limit_joint:
  value: 30000
  reference: 'FAGI < $30,000 (married) cliff'

documented_not_modeled:
  mfs_no_income_spouse_two_exemptions:
    reference: '5126-A(1) as amended by P.L. 2019 c. 659 (TY2020+): an MFS filer whose spouse has no Maine-source income and is not claimed by another may claim 2 exemptions. Spouse income of MFS units is unobservable [understates the exemption for the affected MFS filers]'
  worksheet_ratio_rounding:
    reference: 'The 2018+ phase-out ratio is rounded to 4 decimal places on the worksheet; the $1-step machinery differs by at most 0.00005 x the exemption (~25 cents)'

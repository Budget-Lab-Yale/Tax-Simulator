---
# Maine: personal exemption (Form 1040ME lines 13/18; 36 M.R.S. 5126-A).
#
# TY2017 is structurally different: the Maine exemption equals the FEDERAL
# exemption as claimed (federal 1040 line 42) -- $4,050 per exemption
# INCLUDING dependents, already net of the federal high-income PEP
# phase-out (encoded here as the 2017 stepped 2%-per-$2,500 reduction at
# the federal 2017 thresholds, on federal AGI).
#
# From TY2018, 5126-A grants the exemption for the TAXPAYER AND SPOUSE ONLY
# (dependents moved to the dependent exemption tax credit in credits.yaml),
# indexed annually, with a LINEAR phase-out over $125,000 ($62,500 MFS) of
# Maine AGI above the threshold (4-decimal worksheet ratio; the $1-step
# machinery is within half a basis point).

filing_status_mapper:
  po_thresh:
    '1': po_thresh_single
    '2': po_thresh_joint
    '3': po_thresh_mfs
    '4': po_thresh_head
  po_step:
    '1': po_step_full
    '2': po_step_full
    '3': po_step_half
    '4': po_step_full
  po_share_per_step:
    '1': po_share_full
    '2': po_share_full
    '3': po_share_half
    '4': po_share_full

personal_amount:
  value:
    '2017': 4050
    '2018': 4150
    '2019': 4200
    '2020': 4300
    '2022': 4450
    '2023': 4700
    '2024': 5000
    '2025': 5150
  i_measure:
    '2017': .na
    '2025': cpi
  i_base_year:
    '2017': .na
    '2025': 2025
  i_direction: 0
  i_increment: 50
  reference: '2017: federal exemption amount as claimed ($4,050; 2017 booklet p.2 quick facts and line 18 instruction). 2018-2025: 5126-A amounts from each booklet''s p.4 chart ($4,150 -> $5,150; $4,300 published for both 2020 and 2021). Indexed per 5403(8)'
dep_amount:
  value:
    '2017': 4050
    '2018': 0
  reference: '2017 only: the federal line-42 amount counts dependents. From 2018, 5126-A grants no dependent exemption -- dependents are carried by the dependent exemption tax credit (credits.yaml)'

po_type:
  value: 1
  reference: 'Stepped/linear reduction rather than a cliff in both regimes'
po_agi_base:
  value:
    '2017': 1
    '2018': 2
  reference: '2017: the federal PEP ran on federal AGI. 2018+: the 5126-A(2) worksheet uses Maine adjusted gross income (Form 1040ME line 16)'

  i_measure:
    '2017': .na
    '2025': cpi
  i_base_year:
    '2017': .na
    '2025': 2025
  i_direction: 0
  i_increment: 50
  reference: 'Schedule 2 line 5 maximum allowable itemized deduction (statutory $28,350 base, 5125(4), indexed): printed on each year''s Schedule 2 / quick facts -- $28,600 (2017, NOT the unindexed $28,350) through $36,300 (2025)'
item_flat_cap_excl_medical:
  value: 1
  reference: 'Schedule 2 pulls medical/dental (line 2d) out before the cap and adds it back after (line 7 = line 6 + medical) -- only medical escapes the cap; charitable does NOT (the 5125(5) carve-out was repealed by P.L. 2015 c. 267)'
# The include flag normally declares a component of an item_component_style-1
# base. Maine builds its base the default way, so it does not affect the base
# here -- but the cap exemption reads it to size the exempt medical amount,
# and medical IS in the Maine base (the OK convention)
item_include_medical:
  value: 1
  reference: 'Federal Schedule A medical rides into the Schedule 2 total (line 1) and is pulled out of the cap via line 2d'

# Deduction phase-out (5124-C(2)/5125(7); the line-17 worksheet): BOTH the
# standard and itemized deduction phase out linearly to zero over the
# width above the Maine-AGI threshold. The standard side uses the stepped
# machinery at a $1 step (the worksheet's 4-decimal ratio, within half a
# basis point); the itemized side is the share-based limitation with
# share1 = 1 over the same thresholds
std_po_base:
  value: 2
  reference: 'Worksheet line 1 is Form 1040ME line 16, Maine adjusted gross income'
std_po_step:
  value: 1.0
  reference: 'Continuous approximation of the 4-decimal worksheet ratio'

# Itemized deductions (Schedule 2): only federal itemizers may itemize,
# taking the better of the Maine standard and Maine itemized amounts
item_allowed:
  value: 1
  reference: 'Schedule 2, all years; 36 M.R.S. 5125'
item_fed_gate:
  value: 1
  reference: '5125(1): "an individual who has claimed itemized deductions from federal adjusted gross income" may claim Maine itemized deductions; a federal standard-deduction taker MUST use the Maine standard deduction, and a federal itemizer falls back to it when Schedule 2 line 7 is smaller (2025 general instructions p.4; identical rule 2017-2024)'
salt_addback:
  value: 1
  reference: 'Schedule 2 line 2a backs out ALL federal Schedule A taxes paid; lines 3b/3c add back real-estate and personal-property taxes PAID -- so income/sales taxes are disallowed and property taxes are allowed WITHOUT the federal $10,000 cap (5125(3)(A-1)), which is exactly the model''s default state itemized base'

---
# Maine: deductions (Form 1040ME line 17; Schedule 2; 36 M.R.S. 5124-B/
# 5124-C/5125). Three interacting pieces, all encoded:
#
#  1. STANDARD deduction = the federal basic + additional (aged/blind)
#     amounts (2025 uses the pre-OBBBA federal amounts because Maine
#     conforms to the IRC as of December 31, 2024).
#  2. ITEMIZED (Schedule 2): federal itemized less ALL federal taxes-paid,
#     plus real-estate and personal-property taxes PAID (so property taxes
#     escape the federal $10,000 SALT cap, 5125(3)(A-1)); capped at the
#     indexed line-5 maximum with ONLY MEDICAL exempt from the cap
#     (charitable is NOT exempt -- the pre-2016 carve-out was repealed by
#     P.L. 2015 c. 267). Only federal itemizers may itemize, taking the
#     better of the two (the MD item_fed_gate election).
#  3. The DEDUCTION PHASE-OUT (every year 2017-2025): whichever deduction
#     is taken phases out linearly to zero over $75,000 / $112,500 /
#     $150,000 of Maine AGI above the filing-status threshold (worksheet
#     ratio rounded to 4 decimals -- the continuous slide here differs by
#     at most ~half a basis point of the deduction). The itemized cap
#     applies BEFORE the phase-out (Schedule 2 line 5 versus the line-17
#     worksheet), matching the calculator's ordering.


# ---------------------------------------------------------------------------
# Retirement/pension subtraction (Form 4884; MCL 206.30(9)-(11)), encoded as
# per-return age bands on the OLDER spouse (the statutory birth-year tiers
# expressed as year-keyed ages: a cohort born in year b is age t - b in year
# t). Bands are lower age bounds; a return takes the amount of the highest
# band its older-spouse age reaches; band 1 is age 0/amount 0 by convention.
#
# Structure per year (full derivation in raw/mi_retirement_research.md):
#   2017-2022: [Tier 3 under-67: 0][Tier 2 (born 1946-52): 20,000/40,000]
#              [Tier 1 (born <1946): indexed cap, e.g. 50,509/101,019 in
#              2017]. Tier-2 67+ filers' $20k/$40k Michigan Standard
#              Deduction (against ALL income) is approximated by the
#              pension-only band; the Tier-3 67+ netted standard deduction
#              (reduced by taxable SS and exemptions, tiny 2020-22 cohort)
#              is omitted [known-differences].
#   2023-2025 (PA 4 of 2023 phase-in, elective vs the tier rules; the bands
#              take the better option per age): 25/50/75% of that year's
#              Tier-1 cap for the expanding birth-year windows (2023: born
#              1946-58 = ages 65-77; 2024: 1946-62 = ages 62-78; 2025:
#              1946-66 = ages 59-79), printed amounts 15,380/30,759 ->
#              32,020/64,040 -> 49,423/98,846; Tier-2 ages keep the better
#              20,000/40,000 in 2023; Tier 1 keeps the full cap.
#   2026+:     100% phase-in, everyone -- encoded from age 59 (the IRA
#              59.5 rule and the retire-under-plan-provisions test make
#              younger distributions non-qualifying), at the 2025 cap
#              carried forward (CPI-indexed in law; published amounts
#              transcribed through 2025) [known-difference].
#
# Known-differences (documented in mi.md): public pensions (unlimited for
# Tier 1) treated as private/capped -- source unobservable; 457/TSP and
# unmatched-401(k) amounts in the PUF pension concept would not qualify;
# military/railroad cap reductions unobserved (offsetting: military
# retirement is also not separately exempted); SSA-exempt, fire/police
# (2023+), and surviving-spouse elections unobservable.

filing_status_mapper:
  pension_excl_band_amounts:
    '1': pension_excl_band_amounts_single
    '2': pension_excl_band_amounts_joint
    '3': pension_excl_band_amounts_single
    '4': pension_excl_band_amounts_single
  senior_inv_cap:
    '1': senior_inv_cap_single
    '2': senior_inv_cap_joint
    '3': senior_inv_cap_single
    '4': senior_inv_cap_single
  senior_std_amount:
    '1': senior_std_amount_single
    '2': senior_std_amount_joint
    '3': senior_std_amount_single
    '4': senior_std_amount_single


# Michigan Standard Deduction (Schedule 1 line 25/26; MCL 206.30(9)(b),(e)):
# $20,000/$40,000 against ALL income for returns whose older spouse is 67+
# and born after 1945 (born-before-1946 filers use Form 4884 instead). Tier 2
# ages (born 1946-1952, at/above the no-net age) take the full amount; Tier 3
# ages net taxable Social Security (suspended by PA 4 for 2026-2028) and the
# exemption amounts per the Worksheet 2 netting. Mutually exclusive with the
# Form 4884 subtraction -- the calculator takes the better. Cross-model
# evidence this is material: pre-encoding MI mismatches showed +$850/+$1,700
# point masses = 20k/40k x 4.25% on 67+ records without pension income.

senior_std_amount_single:
  value: 20000
  reference: 'MCL 206.30(9)(b),(e): $20,000 single/MFS, frozen (not indexed), 2017-2025; Schedule 1 line 25/26 worksheets'

senior_std_amount_joint:

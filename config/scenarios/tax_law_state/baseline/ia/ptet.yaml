---
# Iowa: elective pass-through entity tax, Iowa Code 422.16C (2023 Acts ch 78,
# retroactive to tax years beginning on or after 1/1/2022; amended 2024 Acts
# ch 1094 secs 8-9, applying from TY2025). Partnerships (not PTPs) and S
# corporations; separate annual election, irrevocable, binding on all owners.
# 422.16C(2): "This section only applies to tax years for which the
# limitation on individual deductions applies under section 164(b)(6)" -- the
# OBBBA keeps that limit permanent, so the PTET runs through 2030.
# The owner credit is DELIBERATELY below 100%: credit = owner share of entity
# tax x (100% - the individual rate). This replaces an owner add-back from
# TY2023; TY2022 had BOTH the add-back and the reduced credit.
# Insurance companies and credit unions exempt under 422.34 cannot claim it.

available:
  value:
    '2017': 0
    '2022': 1
  reference: 'Iowa Code 422.16C(2) (2026 ed.), https://www.legis.iowa.gov/docs/code/422.16C.pdf; 2023 Acts ch 78 sec 7 (retroactive to 1/1/2022); applies only while IRC 164(b)(6) applies'
mandatory:
  value: 0
  reference: 'Iowa Code 422.16C(2)-(3)(a): elective, annual'
method:
  value: 1
  reference: 'Iowa Code 422.16C(5)(a)'
rate:
  value:
    '2017': 0.0853
    '2023': 0.0600
    '2024': 0.0570
    '2025': 0.0380
  reference: 'Iowa Code 422.16C(4)(a): through TY2024 "the maximum rate under section 422.5A" (Iowa Code 2024 ed., https://www.legis.iowa.gov/docs/code/2024/422.16C.pdf); from TY2025 "the rate under section 422.5" (2024 Acts ch 1094 sec 8, 17). Values equal max(st_ord.rates) in baseline/ia/ord.yaml (8.53% TY2022, 6.0% TY2023, 5.7% TY2024, 3.8% TY2025+). 2017-2021 value is inert (available = 0)'
rate_tracks_top:
  value: 1
  reference: 'Iowa Code 422.16C(4)(a) (2024 and 2026 eds.)'
# rate_scorp: omitted, so the schema default (NA) applies -- same as rate
#   reference: 'Iowa Code 422.16C(4)(a): one rate'
credit_share:
  value:
    '2017': 0
    '2022': 0.9147
    '2023': 0.9400
    '2024': 0.9430
    '2025': 0.9620
  reference: 'Iowa Code 422.16C(5)(a)(2): through TY2024 "the difference between one hundred percent and the highest individual income tax rate in effect for the tax year" (2024 ed.); from TY2025 "...the individual income tax rate in effect" (2024 Acts ch 1094 sec 9, 17). = 1 - rate. IDR PTET guidance confirms 91.47% for TY2022 and a 6% reduction for TY2023, https://revenue.iowa.gov/taxes/tax-guidance/business-income-tax/pass-through-entity-tax-ptet'
credit_refundable:
  value: 1
  reference: 'Iowa Code 422.16C(5)(c): "Any credit in excess of the tax liability is refundable"'
addback:
  value:
    '2017': 0
    '2022': 1
    '2023': 0
  reference: 'IDR PTET guidance https://revenue.iowa.gov/taxes/tax-guidance/business-income-tax/pass-through-entity-tax-ptet: for TY2022 Iowa income tax deducted in computing federal taxable income is added back (IA 1065 / IA 1120S Schedule A line 8, flowing to owners); for TY2023 and later the add-back no longer applies'
resident_scope:
  value: 2
  reference: 'Iowa Code 422.16C(4)(a): taxable income "allocated and apportioned to the state"; IDR guidance: computed on Iowa-source items "without regard to the residency or entity type of any particular owner"'
nonresident_scope:
  value: 2
  reference: 'Iowa Code 422.16C(4)(a)'
# resident_credit_for_other_state_ptet: omitted, so the schema default (NA) applies -- searched IDR PTET guidance and 422.16C; neither addresses the IA 130 out-of-state credit for other states' entity taxes
#   reference: 'Not found: Iowa Code 422.16C and IDR PTET guidance are silent; Iowa Code 422.8 / Form IA 130 not checked'
surtax_rate:
  value: 0
  reference: 'No surtax-layer entity tax in Iowa law'
surtax_credit_share:
  value: 0
  reference: 'No surtax-layer entity tax in Iowa law'
local_rate:
  value: 0
  reference: 'Iowa school district surtax is not part of the PTET; not modeled'
local_credit_share:
  value: 0
  reference: 'Not applicable'

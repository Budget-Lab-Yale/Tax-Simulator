combined_sep:
  value:
    '2017': 1
    '2023': 0
  reference: 'Iowa filing status 3, married filing separately ON A COMBINED RETURN: two columns of one return, the same nine-bracket ladder applied to each spouse''s income with a per-spouse standard deduction and per-spouse exemption credits, federal-tax items prorated between the columns. Since the ladder does not vary by status, this was near-universally better than filing jointly for a two-earner couple. HF 2317 abolished it -- Iowa Code 422.5(11) from TY2023 requires the state status to match the federal one, and the status codes were renumbered in the same change'
combined_sep_std_amount:
  value:
    '2017': 2000
    '2018': 2030
    '2019': 2080
    '2020': 2110
    '2021': 2130
    '2022': 2210
    '2023': 0
  reference: 'IA 1040 Expanded Instructions, each year: the married-separate standard deduction is a per-spouse amount, and it is NOT half the joint figure -- $2,210 each against $5,450 joint in TY2022 -- so the column amount is stated outright rather than derived as a share. Corroborated by the IDR annual press releases, which print the amounts per status'

documented_not_modeled:
  iowa_alternative_minimum_tax:
    reference: 'Iowa ran its own AMT through TY2022 at 6.7% (TY2017-18) and 6.4% (TY2019-22), read directly off Form IA 6251, with exemptions of $26,000 for single/HoH/QW, $35,000 joint and $17,500 for the separate statuses, phased out at 25% above $112,500/$150,000/$75,000. It was NOT an election. Repealed effective TY2023 by SF 2417, along with the 422.11B minimum tax credit which died 1/1/2023 and was usable on the TY2023 return only. Encoding it would need an Iowa AMTI base built from federal AMTI plus Iowa nonconformity adjustments, which the model has no plumbing for [understates Iowa tax through TY2022 for high-income filers with large preference items, and misses the minimum tax credit for those who paid it]'
  alternate_tax_married_separate_proration:
    reference: 'Under the combined return the alternate tax is computed on the couple''s combined income and then prorated between spouses in the ratio of each spouse''s adjusted Iowa taxable income to the total. The model applies the ceiling at the return level, which reaches the same total'
  alternate_tax_addbacks:
    reference: 'The alternate tax base (form 41-145) is Iowa taxable income plus the federal itemized or standard deduction, the federal personal exemption deduction, the QBI deduction, the pre-2023 NOL carryover and lump-sum distributions from federal Form 4972. Pre-2023 it was Iowa net income plus the pension exclusion and reportable Social Security. The model uses federal AGI as the single stand-in for both constructions, which agrees on the large items and misses the NOL and lump-sum add-backs'
  lump_sum_tax:
    reference: 'Iowa levies a separate tax on lump-sum distributions taxed federally on Form 4972, in every year, and a filer subject to it must file regardless of income. Lump-sum elections are not a model input'
  school_district_and_ems_surtaxes:
    reference: 'Iowa school districts and emergency medical services districts levy a surtax as a percentage of state income tax, varying by district and year. Deferred to the locality phase, like the Maryland county piggyback'
  nol_disqualifiers:
    reference: 'A spouse electing an NOL carryback or carryforward disqualifies the other from the low-income exemption unless the loss spouse waives it, and likewise disqualifies the alternate tax. NOL elections are not a model input'

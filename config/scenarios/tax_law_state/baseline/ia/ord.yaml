  value:
    '2017': [0.0036, 0.0072, 0.0243, 0.0450, 0.0612, 0.0648, 0.0680, 0.0792, 0.0898]
    '2019': [0.0033, 0.0067, 0.0225, 0.0414, 0.0563, 0.0596, 0.0625, 0.0744, 0.0853]
    '2023': [0.0440, 0.0482, 0.0570, 0.0600, 0.0600, 0.0600, 0.0600, 0.0600, 0.0600]
    '2024': [0.0440, 0.0482, 0.0570, 0.0570, 0.0570, 0.0570, 0.0570, 0.0570, 0.0570]
    '2025': [0.038, 0.038, 0.038, 0.038, 0.038, 0.038, 0.038, 0.038, 0.038]
  reference: 'Iowa Code 2017 ed. 422.5(1)(a)-(i) for the 0.36-8.98% ladder and 2019 ed. 422.5A for 0.33-8.53%, the TY2019 cut being 2018 Acts ch 1161 (SF 2417) section 73. HF 2317 (2022 Acts ch 1002) section 15 wrote the TY2023 four-bracket 4.40/4.82/5.70/6.00 ladder and the TY2024 three-bracket 4.40/4.82/5.70 one. SF 2442 (2024 Acts ch 1094) section 2 set the flat 3.8% for TY2025 onward and sections 15-17 repealed 422.5A and bracket indexation; IDR''s 2024-10-16 release: "Iowa law provides for a flat tax rate of 3.8 percent for all levels of taxable individual income beginning with tax year 2025. There will be no income tax brackets in 2025", with the 2025-10-21 release confirming 3.8% for TY2026. Rate vectors are padded to nine bands by repeating the top rate (the KY/IL convention); under the flat rate every band carries the same rate so the padding is exact'

---
# Iowa rate schedule (IA 1040; Iowa Code 422.5, 422.5A).
#
# THREE REGIMES and four bracket counts in nine years, all driven by two
# acts. SF 2417 (2018 Acts ch 1161) cut the nine rates for TY2019 and, in the
# same bill, moved the base to federal taxable income and repealed the
# federal income tax deduction from TY2023. HF 2317 (2022 Acts ch 1002) then
# rewrote the TY2023+ ladder as a four-then-three bracket phase-down, and
# SF 2442 (2024 Acts ch 1094) replaced the whole thing with a flat 3.8% from
# TY2025 and repealed bracket indexation outright.
#
# THROUGH TY2022 THE NINE-BRACKET LADDER APPLIES TO EVERY FILING STATUS.
# There is no married rate schedule at all. What Iowa offered married couples
# instead was a COMBINED RETURN -- two columns of one return, each running
# the same ladder against one spouse's income with its own standard deduction
# -- which is why a two-earner couple almost always split. That election is
# encoded through the combined-separate machinery below; it was abolished
# with the rest of the pre-2023 apparatus.
#
# Also encoded here: the ALTERNATE TAX, which is not really a rate schedule
# but a ceiling. It caps tax at a stated rate times income above $13,500
# ($32,000 where a filer is 65 or older) for every status except single. Its
# rate tracked the top marginal rate through TY2024 and was then hard-coded
# at 4.3% -- ABOVE the 3.8% flat rate -- so from TY2025 it helps only
# taxpayers near the thresholds. It is encoded through the no-tax-status
# formula in credits.yaml, where the single filer's zero threshold makes the
# ceiling exceed the tax and the whole thing fall away on its own.

filing_status_mapper:
  brackets:
    '1': brackets_other
    '2': brackets_joint
    '3': brackets_other
    '4': brackets_other


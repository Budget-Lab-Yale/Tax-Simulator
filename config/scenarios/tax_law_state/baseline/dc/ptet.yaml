---
# District of Columbia: NO pass-through entity tax. B26-0324 (introduced
# 7/2025) had a Committee of the Whole hearing on 3/19/2026; no Council vote
# or enactment found as of 10/2026. Arkansas DFA's TY2026 list shows DC with
# no similar tax. (DC also taxes unincorporated businesses at entity level
# under the UBT, which is unrelated to the SALT-cap workaround.)
#
# All parameters are at their neutral no-PTET values except
# resident_credit_for_other_state_ptet, which matters for a District of Columbia
# resident who owns an interest in another state's electing entity.
#

available:
  value: 0
  reference: 'No PTET: B26-0324 heard 3/19/2026 (https://chairmanmendelson.com/wp-content/uploads/2026/03/3.19.26-Bills-26-324.WL_.pdf), not enacted as of search 10/2026; Arkansas DFA TY2026 list https://www.dfa.arkansas.gov/wp-content/uploads/States_with_Similar_Tax_PET_2026.pdf'

mandatory:
  value: 0
  reference: 'No PTET'
method:
  value: 0   # none
  reference: 'No PTET'
rate:
  value: 0
  reference: 'No PTET'
rate_tracks_top:
  value: 0
  reference: 'No PTET'
# rate_scorp: omitted, so the schema default (NA) applies -- no PTET
#   reference: 'No PTET'
credit_share:
  value: 0
  reference: 'No PTET'
credit_refundable:
  value: 0
  reference: 'No PTET'
addback:
  value: 0
  reference: 'No PTET'
# resident_scope: omitted, so the schema default (NA) applies -- no PTET
#   reference: 'No PTET'
# nonresident_scope: omitted, so the schema default (NA) applies -- no PTET
#   reference: 'No PTET'

resident_credit_for_other_state_ptet:
  value: 1
  reference: 'OTR Tax Notice 2022-03 (3/31/2022), District Treatment of Pass-through Entities Taxes Paid to Other Jurisdictions, https://otr.cfo.dc.gov/sites/default/files/dc/sites/otr/publication/attachments/OTR_NOTICE_2022-03_State_Credit_for_PTET_3_31_2022.pdf: D.C. Code 47-1806.04(a), enacted before any PTE taxes, does not restrict a resident from claiming the credit for such taxes paid (as summarized by Andersen; notice body not read -- PDF not text-extracted)'

surtax_rate:
  value: 0
  reference: 'No PTET'
surtax_credit_share:
  value: 0
  reference: 'No PTET'
local_rate:
  value: 0
  reference: 'DC is the jurisdiction; no separate local tax'
local_credit_share:
  value: 0
  reference: 'DC is the jurisdiction; no separate local tax'

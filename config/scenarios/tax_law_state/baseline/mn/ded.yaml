---
# Minnesota: deductions. 2017: federal deductions flow through the
# federal-taxable-income start, with the state income/sales tax addback
# (salt_addback, CO-style). 2018+: MN's OWN standard deduction (Minn. Stat.
# 290.0123; pre-TCJA amounts in 2018, TCJA-level MN-indexed amounts from
# 2019) or MN itemized deductions (Schedule M1SA, 290.0122) -- the MN
# election is fully decoupled from the federal one. Both deductions face
# the same high-income limitation: min(3% of AGI over T1 [+ 10% over T2
# from 2023], 80% of the deduction), flat 80% above the $1M-indexed
# trigger from 2023.
#
# M1SA component approximations [known-differences]: medical uses the
# federal-floor amount (MN floor is 10% of AGI vs federal 7.5% -- overstates
# for medical itemizers); misc-2% deductions are zero in post-TCJA PUF data
# (MN still allows them -- understates); casualty uses the federal
# disaster-only amount (MN allows non-disaster losses); real-estate +
# personal-property taxes share the 10k cap on the form but the cap is
# applied to property taxes only here.

filing_status_mapper:
  std_amount:
    '1': std_single
    '2': std_joint
    '3': std_single
    '4': std_head
  std_aged_addl:
    '1': aged_addl_single
    '2': aged_addl_married
    '3': aged_addl_married
    '4': aged_addl_single
  std_blind_addl:
    '1': aged_addl_single
    '2': aged_addl_married
    '3': aged_addl_married
    '4': aged_addl_single
  item_prop_tax_cap:
    '1': prop_cap_regular
    '2': prop_cap_regular
    '3': prop_cap_mfs
    '4': prop_cap_regular
  pease_thresh:
    '1': pease_t1_regular
    '2': pease_t1_regular
    '3': pease_t1_mfs
    '4': pease_t1_regular
  pease_thresh2:
    '1': pease_t2_regular
    '2': pease_t2_regular
    '3': pease_t2_mfs
    '4': pease_t2_regular


---
# Arkansas: credits (Form AR1000F lines 7 and 34; Form AR1000TC).
#
# Arkansas grants PERSONAL TAX CREDITS in place of exemptions: a flat amount
# per taxpayer, one more for each of several conditions, and one per
# dependent. There is NO state earned income credit -- a verified negative
# across all nine booklets, not merely something unfound.

exempt_credit_style:
  value: 1
  reference: 'Form AR1000F lines 7A and 7B: a flat credit per person applied against tax rather than an allowance against income'
exempt_credit_personal:
  value:
    '2017': 26
    '2020': 29
  reference: 'Booklet LINE 7A and the AR1000F form face, which reads "X $26 =" through TY2019 and "X $29 =" from TY2020. The $26 figure secondary sources quote is right only through TY2019. The credit is CONDITIONALLY indexed: Ark. Code Ann. 26-51-501(d)-(f) indexes a CY2001 base of $20 but only in years a general-revenue growth trigger fires, which is why it stepped once and then held. Encoded as the observed per-year series rather than as a CPI formula'
exempt_credit_dep:
  value:
    '2017': 26
    '2020': 29
  reference: 'Line 7B, the same amount for each dependent'
exempt_credit_aged:
  value:
    '2017': 26
    '2020': 29
  reference: 'Line 7A allows an additional credit where the taxpayer or spouse was age 65 or over on January 1 following the tax year. The statute sets the add-on at a flat $20, but the form applies the same per-person amount to every box'
exempt_credit_blind:
  value:
    '2017': 26
    '2020': 29
  reference: 'Line 7A allows an additional credit for blindness, and another for deafness, on the same terms. Only the blindness box is modeled -- deafness is not a model input'

cdctc_match:
  value: 0.20
  reference: 'Form AR2441: the Arkansas child care credit is 20% of the federal child and dependent care credit in all nine years. From TY2021 Arkansas computes it on a PRE-ARPA recomputation of the federal credit rather than the credit as claimed -- see documented_not_modeled'
cdctc_refundable:
  value: 0
  reference: 'The Arkansas child care credit is nonrefundable'

eitc_match:
  value: 0
  reference: 'Arkansas has NO state earned income credit: zero hits across all nine booklets and no line on Form AR1000TC. Stated explicitly to record the verified negative'

# Stepped flat credits on AR1000F line 28 (net taxable income), both on Form
# AR1000TC and both nonrefundable. Slot 1: Inflationary Relief Income-Tax
# Credit (TY2022-23). Slot 2: Additional Tax Credit for Qualified Individuals
# (TY2022+). Filing status 4 (separately on one return) looks up each spouse
# on the single table; it is not modeled here (see filing.yaml)
stepcred1_amount:
  value:
    '2017': 0
    '2022': 150
    '2024': 0
  reference: 'DFA Inflationary Relief Income-Tax Credit Worksheets: TY2022 and TY2023 tables both pay $150 (filing statuses 1, 3, 4, 5, 6) at the bottom; the credit existed for TY2022-23 only. (policyengine-us carries $50 for 2023; the DFA 2023 table says $150)'
stepcred1_thresh:
  value:
    '2017': 0
    '2022': 87000
    '2023': 89600
    '2024': 0
  reference: 'TY2022 table: $1-$87,000 pays $150; TY2023 table: $1-$89,600 pays $150'
stepcred1_step:
  value: 1000
  reference: 'Both tables step down every $1,000 of net income ($87,001-$88,000 $140, ...)'
stepcred1_reduction:
  value: 10
  reference: '$10 per $1,000 step: zero above $101,000 (TY2022) / $103,600 (TY2023)'
stepcred1_joint_mode:
  value: 1
  reference: 'Filing status 2 has its own table with every figure doubled: $300 up to $174,000 (TY2022) / $179,200 (TY2023), then $20 per $2,000, zero above $202,000 / $207,200'
stepcred2_amount:
  value:
    '2017': 0
    '2022': 60
  reference: 'DFA Additional Tax Credit for Qualified Individuals Worksheets, TY2022-2025 (Ark. Code Ann. 26-51-501): $60 at the bottom of the table'
stepcred2_thresh:
  value:
    '2017': 0
    '2022': 24300
    '2023': 25000
    '2024': 25800
    '2025': 26500
  reference: 'Table top band: $0-$24,300 (TY2022), $0-$25,000 (TY2023), $0-$25,800 (TY2024); TY2025 worksheet "net income up to $27,600" with the same $1,100 tail gives $26,500'
stepcred2_step:
  value: 100
  reference: 'The table steps every $100 of net income'
stepcred2_reduction:
  value: 5
  reference: '$5 per $100 step ($55 in the first band above the threshold), zero after twelve steps'
stepcred2_joint_mode:
  value: 2
  reference: 'Filing status 2: "Find your net taxable income in the table below ... Double the credit from line 2"'

documented_not_modeled:
  deaf_and_head_of_household_credits:
    reference: 'Line 7A grants an additional personal credit for deafness, and another where the filing status is head of household or surviving spouse. Deafness is not a model input, and the head-of-household add-on has no place in the per-taxpayer/aged/blind/dependent structure the machinery carries [understates credits by $29 per affected return]'
  cdctc_arpa_decoupling:
    reference: 'From TY2021 Arkansas recomputes the federal child and dependent care credit under PRE-ARPA rules on Form AR2441 and takes 20% of that, rather than 20% of the enlarged federal credit actually claimed. The model matches the federal credit as computed [overstates the Arkansas credit for TY2021, when the federal credit was temporarily much larger]'
  developmental_disabilities_credit:
    reference: 'Ark. Code Ann. 26-51-503 grants a $500 credit per child with developmental disabilities in all years. Disability status is not a model input'
  certificated_credits:
    reference: 'Form AR1000TC carries the credit for taxes paid to other states plus a long tail of certificated business credits. None is a broad income-conditioned credit reconstructible from the microdata'

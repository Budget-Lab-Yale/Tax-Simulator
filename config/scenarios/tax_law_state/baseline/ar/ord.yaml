# Arkansas rate schedule (Form AR1000F lines 28-30).
#
# The taxpayer booklet prints a dense $100-step Regular Income Tax Table, not
# a schedule. DFA separately publishes a one-page memo, "<year> Indexed Tax
# Brackets", giving the closed form the table is built from, as
# `rate x income - minus adjustment`. That memo is the authoritative
# machine-readable form and is what is encoded here, converted to the
# base-amount shape the calculator uses: base_j = rate_j x bracket_j - adj_j
# makes base_j + rate_j x (TI - bracket_j) identically equal to
# rate_j x TI - adj_j. Every band was converted programmatically from the
# transcribed memo rather than by hand, and eight published points across
# four years were checked back against the minus-adjustment form exactly.
#
# TWO FEATURES THE BASE-AMOUNT SHAPE EXISTS FOR:
#
# (1) A genuine NOTCH at the top of the fourth bracket through TY2021. The
# statute runs three separate whole-income tables selected by income level,
# so crossing the boundary re-taxes the whole income on a higher table: in
# TY2020 net taxable income of $22,899 owes $537 and $22,900 owes $717.29.
# A smooth marginal schedule cannot express that and would understate tax by
# about $180 just above the boundary. Act 1 of 2022 merged the rows and
# ended it.
#
# (2) A RECAPTURE TAIL at the top, which claws back the benefit of the lower
# brackets. Through TY2021 it is a handful of ~$1,000-wide rows whose minus
# adjustment drops $100 at each boundary -- encoded band for band, cliffs
# intact. From TY2022 it becomes granular: $100-wide rows dropping $10 each,
# roughly 30 to 60 of them. Those are encoded as ONE ramp band whose rate is
# the average slope over the range, which reproduces both endpoints exactly
# and sits within $10 of the staircase in between; above the tail the final
# published adjustment is encoded exactly. See documented_not_modeled.
#
# The schedule applies to NET TAXABLE INCOME (AR1000F line 28 = Arkansas AGI
# less the standard or itemized deduction). Arkansas grants personal CREDITS
# rather than exemptions, so nothing else comes out of the base.


documented_not_modeled:
  midpoint_table_convention:
    reference: 'DFA computes each printed table entry at the MIDPOINT of its $100 band and states so explicitly: "If you use a formula to calculate Arkansas income tax, the results must match the table exactly. The calculations in the table are made at the midpoint of each income level." The continuous schedule is encoded, so a filer at the bottom of a band pays up to about $2.45 more than the table and one at the top about $2.45 less [averages to roughly zero across a population]'
  granular_recapture_tail_2022_onward:
    reference: 'From TY2022 the recapture tail is 30 to 60 rows of $100 each whose minus adjustment falls $10 per row, and it is encoded as a single ramp band at the average slope. The endpoints are exact and the maximum deviation inside the range is one $10 step [a few dollars, confined to net taxable income within roughly $5,000 of the top bracket]. Encoding every row would need up to 60 bands for a difference no larger than the midpoint convention already introduces'
  low_income_tax_tables:
    reference: 'Arkansas publishes five Low Income Tax Tables that a qualifying filer may use INSTEAD of this schedule and instead of any deduction, and the booklet makes it an explicit taxpayer election. Modelling it properly means computing both paths and taking the better, which is the generic minimum-liability election pass already queued for the Wisconsin Act 15 retirement election and Alabama separate returns. NOT ENCODED [overstates Arkansas tax for low-income filers -- the tables zero out tax entirely below their thresholds, so this is the largest Arkansas known difference. Per-year thresholds are in the source packet]'
  per_spouse_schedule_under_status_4:
    reference: 'Under filing status 4 (married filing separately on the same return) Arkansas applies this schedule SEPARATELY to each spouse column and adds the two, and the low-income tables are unavailable. Not modeled -- see the source packet'

  reference: 'Booklet filing-threshold table, head of household with zero or one dependent, each year. Surviving spouse takes the same amounts'

documented_not_modeled:
  per_dependent_thresholds:
    reference: 'The head-of-household, joint and surviving-spouse thresholds rise for filers with two or more dependents -- TY2024 joint is $24,058 with zero or one and $28,954 with two or more. Only the zero-or-one column is carried, since the threshold governs the filer flag alone'
  ty2025_printed_typo:
    reference: 'The TY2025 booklet prints $28,723 for married filing jointly with two or more dependents where the Low Income Tax Table implies $29,723 -- a probable DFA typo. It falls in the per-dependent column that is not carried here, so nothing turns on it'
  six_filing_statuses:
    reference: 'Arkansas has six filing statuses, splitting married filing separately into "on the same return" (status 4) and "on different returns" (status 5) and separating surviving spouse. The model carries four federal statuses. Status 4 in particular applies the rate schedule TWICE, once per spouse column, and bars the low-income tables -- see the source packet'

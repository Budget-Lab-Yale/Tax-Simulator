---
# Vermont: NO pass-through entity tax. S.45 (2023) would have created an
# elective PTET with a 90% credit; it passed the Senate only (S.45 As Passed
# by the Senate, 3/30/2023). Arkansas DFA's list of states with and without
# similar taxes for TY2026 (6/3/2026) lists VT as having none.
#
# All parameters are at their neutral no-PTET values except
# resident_credit_for_other_state_ptet, which matters for a Vermont
# resident who owns an interest in another state's electing entity.
#

available:
  value: 0
  reference: 'No PTET: S.45 (2023) passed the Senate only, https://legislature.vermont.gov/Documents/2024/WorkGroups/House%20Ways%20and%20Means/Bills/S.45/S.45~Abby%20Shepard~As%20Passed%20by%20the%20Senate~3-30-2023.pdf ; Arkansas DFA TY2026 list https://www.dfa.arkansas.gov/wp-content/uploads/States_with_Similar_Tax_PET_2026.pdf (VT: no similar tax)'

mandatory:
  value: 0
  reference: 'No PTET'
method:
  value: 0   # none
  reference: 'No PTET'
rate:
  value: 0
  reference: 'No PTET'
rate_tracks_top:
  value: 0
  reference: 'No PTET'
# rate_scorp: omitted, so the schema default (NA) applies -- no PTET
#   reference: 'No PTET'
credit_share:
  value: 0
  reference: 'No PTET'
credit_refundable:
  value: 0
  reference: 'No PTET'
addback:
  value: 0
  reference: 'No PTET'
# resident_scope: omitted, so the schema default (NA) applies -- no PTET
#   reference: 'No PTET'
# nonresident_scope: omitted, so the schema default (NA) applies -- no PTET
#   reference: 'No PTET'

# resident_credit_for_other_state_ptet: omitted, so the schema default (NA) applies -- 32 V.S.A. 5825 text and IN-117 instructions not found on entity-paid tax
#   reference: 'Unresolved. 32 V.S.A. 5825 (credit for taxes paid to other states) and Schedule IN-117 instructions do not address tax paid by the entity in the sources found; S.45 (2023, not enacted) would have added an explicit credit for other-state entity-level taxes, suggesting current law does not clearly allow one. Searched tax.vermont.gov and legislature.vermont.gov'

surtax_rate:

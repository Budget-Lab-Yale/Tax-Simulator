std_po_share_per_step:
  value: 0.20
  reference: 'Standard Deduction Worksheet line 7 percentage chart (1 -> 0.8000, 2 -> 0.6000, 3 -> 0.4000, 4 -> 0.2000; zero beyond 4 steps), all years'
std_po_base:
  value: 2
  reference: 'Worksheet line 2 is modified federal AGI (RI-1040 line 3) = state AGI -> st_income_base enum 2 (NOT the enum default of federal AGI: the SS and pension modifications must shrink the phase-out measure)'

item_allowed:
  value: 0
  reference: 'RI-1040 line 4 instruction, every year 2017-2025: "Rhode Island does not allow the use of federal itemized deductions"; R.I.G.L. 44-30-2.6(c)(3)(B) provides a standard deduction only'

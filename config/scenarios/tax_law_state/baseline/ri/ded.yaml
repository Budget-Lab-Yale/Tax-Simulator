---
# Rhode Island: standard deduction (RI-1040 line 4; R.I.G.L. 44-30-2.6(c)(3)(B)).
# RI allows NO itemized deduction of any kind -- "Rhode Island does not allow
# the use of federal itemized deductions" appears on the line 4 instruction in
# every year 2017-2025 -- so item_allowed stays 0 and no itemized machinery is
# encoded.
#
# The deduction phases out on a STEPPED schedule (Standard Deduction
# Worksheet): 20% of the deduction is removed for each increment, OR FRACTION
# THEREOF, by which modified federal AGI (line 3) exceeds the threshold, so the
# applicable percentage is 0.8 / 0.6 / 0.4 / 0.2 at 1 / 2 / 3 / 4 steps and
# ZERO once the excess passes 4 increments (the worksheet's "if the result is
# more than $X, STOP HERE" line, where X = 4 x increment in every year). This
# uses the generic stepped machinery (st_ded.std_po_step /
# std_po_share_per_step), which shares its ceiling() rounding with the
# exemption worksheet -- the two RI worksheets are parameter-identical.
#
# Dependent filers keep the FULL standard deduction (only the exemption is
# zeroed -- see exempt.yaml dep_filer_zero). RI has no aged or blind
# additional deduction.

filing_status_mapper:
  std_amount:
    '1': std_single
    '2': std_joint
    '3': std_mfs
    '4': std_head

std_single:
  value:
    '2017': 8375
    '2018': 8525
    '2019': 8750
    '2020': 8900
    '2021': 9050
    '2022': 9300
    '2023': 10000
    '2024': 10550
    '2025': 10900
  reference: 'RI Standard Deduction Worksheet / RI-1040 line 4 chart, single, TY2017-2025'

---
# Colorado: SALT Parity Act elective entity-level tax (C.R.S. 39-22-340
# et seq.).
#
# Law: HB21-1327 enacted the election for TY2022+; SB22-124 made it
# retroactive to income tax years commencing on or after 1/1/2018. For
# TY2018-2021 the election had to be made on a composite amended return
# filed 9/1/2023-6/30/2024 (39-22-343(1)(c)(I)). C.R.S. 39-22-343(2): the
# election "is only allowed in an income tax year where there is a
# limitation on the deductions allowed to individuals under section 164 of
# the internal revenue code" -- so it runs while IRC 164(b)(6) applies
# (permanent under P.L. 119-21). The DOR's Feb 2024 Income Tax Topic said
# "prior to January 1, 2026" (the pre-OBBBA cap expiry); the Oct 2025
# revision states no end date.
#
# Election: annual, on the DR 0106 (or DR 1705), binding on all owners.
# Guaranteed payments and owners with negative net income are excluded.
# Not held by the parameters: owners also add back the full IRC 199A
# deduction (DOR SALT Parity page).
#
# Rate: 39-22-344(1) uses "the tax rate set forth in section 39-22-301" (the
# CORPORATE rate) for the year. Colorado's corporate and individual rates
# are the same flat rate, including the TABOR temporary reductions under
# 39-22-627 (2019, 2021) and SB24-228 (2024), so `rate` repeats
# baseline/co/ord.yaml. 2026 is at the 4.40% permanent rate pending the
# SB24-228 TY2026 surplus trigger, as in ord.yaml.
#

available:
  value:
    '2017': 0
    '2018': 1
  reference: 'C.R.S. 39-22-343(1)(a) ("for income tax years commencing on or after January 1, 2018, an S corporation or partnership may annually elect") and 39-22-343(2) (only in years with an IRC 164 limitation on individuals), https://colorado.public.law/statutes/crs_39-22-343; CDOR Income Tax Topics: SALT Parity Act (Oct 2025), https://tax.colorado.gov/sites/default/files/documents/ITT_SALT_Parity_Act_Oct_2025.pdf'
mandatory:
  value: 0
  reference: 'C.R.S. 39-22-343(1)(a): annual election'
method:
  value:
    '2017': 0
    '2018': 1
  reference: 'CDOR Income Tax Topics: SALT Parity Act; CDOR SALT Parity Act page (owner credit equal to share of tax imposed upon and paid by the entity), https://tax.colorado.gov/income-tax-topics-salt-parity-act'
rate:
  value:
    '2017': 0.0463
    '2019': 0.045
    '2020': 0.0455
    '2021': 0.045
    '2022': 0.044
    '2024': 0.0425
    '2025': 0.044
  reference: 'C.R.S. 39-22-344(1) (rate set forth in 39-22-301 for the applicable income tax year), https://colorado.public.law/statutes/crs_39-22-344; 39-22-301(1)(d) and 39-22-627 (temporary TABOR reductions apply to both the individual and corporate rates). Values equal baseline/co/ord.yaml: 4.63% 2018, 4.50% 2019 and 2021 (39-22-627), 4.55% 2020 (Prop 116), 4.40% 2022+ (Prop 121), 4.25% 2024 (SB24-228)'
# The statute references the CORPORATE rate (39-22-301), not the individual
# top rate; they coincide in every year, so the check would pass
rate_tracks_top:
  value: 0
  reference: 'C.R.S. 39-22-344(1) references 39-22-301 (corporate), not 39-22-104 (individual)'
# rate_scorp: omitted, so the schema default (NA) applies -- NA = same as rate (schema default)
#   reference: 'C.R.S. 39-22-344(1)'
credit_share:
  value: 1
  reference: 'CDOR SALT Parity Act page: each owner is allowed a credit "equal to the share of the tax imposed upon and paid by the entity with respect to the partner''s or shareholder''s income"'
credit_refundable:
  value: 1
  reference: 'CDOR SALT Parity Act page: if the credit exceeds the owner''s Colorado income tax liability, "the excess will be refunded to them"'
addback:
  value: 1
  reference: 'CDOR SALT Parity Act page and Income Tax Topics: SALT Parity Act -- owners add back their distributive share of state income tax deducted by the entity on its federal return (and the full IRC 199A deduction)'
resident_scope:
  value: 1
  reference: 'C.R.S. 39-22-344(1)(b): the base includes "Each resident electing pass-through entity owner''s pro rata or distributive share of the electing pass-through entity''s income not attributable to the state"; CDOR page (residents all-source, DR 0106K Column A)'
nonresident_scope:
  value: 2
  reference: 'C.R.S. 39-22-344(1)(a): each owner''s share of income "attributable to the state"; CDOR page (nonresidents, DR 0106K Column B)'
resident_credit_for_other_state_ptet:
  value: 1
  reference: 'CDOR Income Tax Topics: Credit for Tax Paid to Another State (Jan 2024), resident partner or shareholder may claim credit for their share of net income tax "imposed upon and paid to another state by the partnership or S corporation", https://tax.colorado.gov/sites/default/files/documents/ITT_Credit_for_Tax_Paid_to_Another_State_Jan_2024.pdf; DR 0106CR 2025 instructions (credit allowed even where the imposition on the entity was at its election); C.R.S. 39-22-108'
surtax_rate:
  value: 0
  reference: 'No second entity-level layer'
surtax_credit_share:
  value: 0
  reference: 'No second entity-level layer'
local_rate:
  value: 0
  reference: 'Colorado local occupational privilege taxes are not income taxes'
local_credit_share:
  value: 0
  reference: 'See local_rate'

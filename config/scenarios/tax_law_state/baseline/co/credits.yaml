# Family Affordability Tax Credit (C.R.S. 39-22-130; HB24-1311): refundable,
# additional to the CO CTC, children under 17 (higher amount under 6),
# TABOR-growth-contingent. Allowed TY2024 and TY2025 only; the TY2026
# December-2025 forecast trigger was NOT met (DOR Jan 2026 publication), and
# later years default to 0 pending each year's trigger
fatc_young_amount:
  value:
    '2017': 0
    '2024': 3200
    '2025': 3273
    '2026': 0
  reference: 'HB24-1311; DR 0104CN 2024; DOR ITT Family Affordability Tax Credit (Jan 2026: "tax years 2024 and 2025")'
fatc_old_amount:
  value:
    '2017': 0
    '2024': 2400
    '2025': 2455
    '2026': 0
  reference: 'HB24-1311 (75% of the under-6 amount); DR 0104CN 2024; DOR ITT FATC Jan 2026'
fatc_young_age_limit:
  value: 5
  reference: 'C.R.S. 39-22-130 (children 5 or younger vs 6-16)'
fatc_max_child_age:
  value: 16
  reference: 'C.R.S. 39-22-130'
fatc_po_start_single:
  value: 15000
  reference: 'DR 0104CN 2024 (max credit at AGI <= 15,000 single)'
fatc_po_start_joint:
  value: 25000
  reference: 'DR 0104CN 2024'
fatc_po_step:
  value: 5000
  reference: 'DR 0104CN 2024 and DOR ITT FATC 2025 tables: $5,000 AGI bands'
fatc_po_rate:
  value: 0.06875
  reference: 'DR 0104CN 2024 tables (3,200 -> 2,980 -> 2,760 ...; 2,400 -> 2,235 ...) and DOR ITT FATC Jan 2026 2025 tables (3,273 -> 3,048; 2,455 -> 2,286): each started $5,000 band removes 6.875% of the full amount; the 80,001-85,000 band pays $120 / $90'
fatc_po_zero_single:
  value: 85000
  reference: 'DR 0104CN 2024/2025 (credit 0 above 85,000 single)'
fatc_po_zero_joint:
  value:
    '2017': 95000
    '2024': 95000
    '2025': 96000
  reference: 'DR 0104CN 2024; DOR FATC publication 2025'

# ----------------------------------------------------------------------------
# Child care expenses credit (39-22-119; DR 0347 Part III). Table A on the
# 2017 form: more than $0 to $25,000 -> .50, to $35,000 -> .30, to $60,000 ->
# .10; from TY2019 a single .50 up to $60,000 (2019 form line 7). Bands are
# closed below / open above, so each "not more than" bound sits a cent above
# the dollar amount
# ----------------------------------------------------------------------------
cdctc_style:
  value: 1
  reference: 'DR 0347 line 9 (2017-2025): line 8 (federal Form 2441 line 11) times the line 7 decimal'
cdctc_fed_base:
  value: 0
  reference: 'DR 0347 line 8: "Enter the amount from line 11 of IRS form 2441" -- the federal credit as claimed, after the tax-liability limit'
cdctc_share_income_base:
  value: 1
  reference: 'DR 0347 line 4: "adjusted gross income from your federal income tax return"'
cdctc_share_agi_bounds:
  value: [-1.0e+12, 25000.01, 35000.01, 60000.01, 1.0e+12, 1.0e+13]
  reference: 'DR 0347 Table A (2017) / line 7 (2019-2025); "If the amount of line 4 is greater than $60,000 STOP"'
cdctc_share_start:
  value:
    '2017': [0.50, 0.30, 0.10, 0, 0, 0]
    '2019': [0.50, 0.50, 0.50, 0, 0, 0]
  reference: 'DR 0347 2017 Table A (.50/.30/.10, carried to TY2018: the 2018 form was not opened, PolicyEngine agrees); DR 0347 2019, 2022 and 2024 line 7 (0.50 at $60,000 or less)'
cdctc_share_end:
  value:
    '2017': [0.50, 0.30, 0.10, 0, 0, 0]
    '2019': [0.50, 0.50, 0.50, 0, 0, 0]
  reference: 'Step table: each band holds its decimal (same sources as cdctc_share_start)'
cdctc_refundable:
  value: 1
  reference: 'DR 0104CR line 1 (refundable credits); 39-22-119(1) excess credit refunded'

# ----------------------------------------------------------------------------
# Low-income child care expenses credit (39-22-119.5; DR 0347 Part IV):
# 25% of line 3 (the smallest of qualified expenses and each earner's earned
# income), at most $500 for one qualifying child under 13 and $1,000 for two
# or more (Table A), where line 6 federal tax is $0 and federal AGI is
# $25,000 or less. Not available for TY2017 (2017 form instructions);
# available 2018-2025. No separate filers
# ----------------------------------------------------------------------------
cdctc_lowinc_rate:
  value:
    '2017': 0
    '2018': 0.25
  reference: 'DR 0347 2019, 2022, 2024 line 10 (0.25); 2017 instructions: the low-income credit is not available for income tax year 2017'
cdctc_lowinc_expense_base:
  value: 1
  reference: 'DR 0347 line 11: line 3 (smallest of line 2(e) expenses, 2(f) and 2(g) earned income) times line 10'
cdctc_lowinc_cap1:
  value: 500
  reference: 'DR 0347 Table A: one qualifying child $500'
cdctc_lowinc_cap2:
  value: 1000
  reference: 'DR 0347 Table A: two or more qualifying children $1,000'
cdctc_lowinc_agi_limit:
  value: 25000
  reference: 'DR 0347 Part IV: line 4 federal AGI $25,000 or less; 39-22-119.5'
cdctc_lowinc_agi_limit_joint:
  value: 25000
  reference: 'Same limit for joint returns (DR 0347 Part IV)'
cdctc_lowinc_no_fed_tax:
  value: 1
  reference: 'DR 0347 line 6 (federal tax) and Part IV: "Complete this part if line 6 is $0 AND line 4 is $25,000 or less" (2024 wording; 2019: "If you have no federal tax on line 6")'


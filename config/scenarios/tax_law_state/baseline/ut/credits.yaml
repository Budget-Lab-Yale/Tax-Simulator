  reference: 'TC-40 instr. line 18 base amount table, 2017-2025 (single and MFS); UC 59-10-1018(5)-(6) CPI indexation, joint = 2x single'
  i_measure:
    '2017': cpi
  i_base_year:
    '2017': NA
    '2026': 2025
  i_direction: 0
  i_increment: 1
tpc_base_head:

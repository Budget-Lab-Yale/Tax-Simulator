#---------------------------------------------------------------
# Retirement credit (UC 59-10-1019): $450 per person born on or
# before Dec 31, 1952 (frozen cohort encoded as a year-keyed
# minimum age), reduced 2.5 cents per dollar of modified AGI
# (approximated as federal AGI + state additions) over the
# threshold. Values identical 2017-2025; not indexed
#---------------------------------------------------------------

age_credit_amount:
  value: 450
  reference: 'UC 59-10-1019(2)(b); TC-40C, 2017-2025'
age_credit_min_age:
  value:
    '2017': 65
    '2018': 66
    '2019': 67
    '2020': 68
    '2021': 69
    '2022': 70
    '2023': 71
    '2024': 72
    '2025': 73
    '2026': 74
    '2027': 75
    '2028': 76
    '2029': 77
    '2030': 78
    '2031': 79
    '2032': 80
    '2033': 81
    '2034': 82
    '2035': 83
  reference: 'UC 59-10-1019(1)(c): born on or before Dec 31, 1952; age-equivalent by tax year'
age_credit_po_rate:
  value: 0.025
  reference: 'UC 59-10-1019(3); TC-40C worksheet, "multiply by 2.5% (.025)", 2017-2025'
age_credit_income_base:
  value: 3
  reference: 'UC 59-10-1019(1)(b) modified AGI: total income (FAGI + additions) plus tax-exempt interest; modeled as federal AGI + state additions (known-difference)'
retire_thresh_single:
  value: 25000
  reference: 'UC 59-10-1019(3)(b); TC-40C, 2017-2025; not indexed'
retire_thresh_joint:
  value: 32000
  reference: 'UC 59-10-1019(3)(b): MFJ, QSS, and HoH threshold; TC-40C, 2017-2025'
retire_thresh_mfs:
  value: 16000
  reference: 'UC 59-10-1019(3)(b); TC-40C, 2017-2025'

#---------------------------------------------------------------
# Social Security benefits credit (UC 59-10-1042; HB 86 2021,
# TY2021+): the year's tax rate times taxable SS benefits,
# reduced 2.5 cents per dollar of modified AGI over the
# threshold. Return-level exclusivity with the retirement
# credit (the unit takes the larger)
#---------------------------------------------------------------

ss_credit_rate:
  value:
    '2017': 0
    '2021': 0.0495
    '2022': 0.0485
    '2023': 0.0465
    '2024': 0.0455
    '2025': 0.045
    '2026': 0.0445
  reference: 'UC 59-10-1042(2): credit equals the 59-10-104 rate times taxable SS; worksheet multipliers verified 2021-2025; 2026 = SB 60 rate'
ss_credit_po_rate:
  value: 0.025
  reference: 'UC 59-10-1042(3); TC-40 SS credit worksheet, 2021-2025'
ss_credit_income_base:
  value: 3
  reference: 'UC 59-10-1042(1) modified AGI; modeled as federal AGI + state additions (2025 worksheet base change to line 9 is a documented known-difference)'
ss_age_credit_exclusive:
  value: 1
  reference: 'UC 59-10-1042(5)/59-10-1019(4): a return may not claim both the SS/military credit and the retirement credit; booklets apply at return level'
ss_thresh_single:
  value:
    '2017': 999999999999
    '2021': 30000
    '2022': 37000
    '2023': 45000
    '2025': 54000
  reference: 'UC 59-10-1042(3)(a); HB 86 (2021), SB 59 (2022), HB 54 (2023), SB 71 (2025); pre-2021 sentinel (credit rate is zero)'
ss_thresh_joint:

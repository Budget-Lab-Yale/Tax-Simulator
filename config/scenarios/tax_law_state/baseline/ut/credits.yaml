---
# Utah credits: the taxpayer tax credit (UC 59-10-1018, TC-40 lines 11-20),
# retirement credit (59-10-1019, TC-40A code 18), Social Security benefits
# credit (59-10-1042, code AH), nonrefundable EITC (59-10-1044, code AM),
# and nonrefundable child tax credit (59-10-1047, code AT). All amounts
# transcribed from the 2017-2025 TC-40 instruction booklets and enrolled
# bills (see source packet); 2026 enacted changes included (SB 60 rate flows
# to ss_credit_rate; HB 290 CTC thresholds). Omitted: my529, at-home parent,
# health benefit plan, military retirement (59-10-1043), solar/other credits.

filing_status_mapper:
  ded_credit_po_thresh:
    '1': tpc_base_single
    '2': tpc_base_single * 2
    '3': tpc_base_single
    '4': tpc_base_head
  age_credit_po_thresh:
    '1': retire_thresh_single
    '2': retire_thresh_joint
    '3': retire_thresh_mfs
    '4': retire_thresh_joint
  ss_credit_po_thresh:
    '1': ss_thresh_single
    '2': ss_thresh_joint
    '3': ss_thresh_mfs
    '4': ss_thresh_joint
  ctc_po_thresh:
    '1': ctc_thresh_single
    '2': ctc_thresh_joint
    '3': ctc_thresh_mfs
    '4': ctc_thresh_single

#---------------------------------------------------------------
# Taxpayer tax credit (UC 59-10-1018): 6% of [Utah personal
# exemption + federal standard deduction OR (federal itemized
# deductions less the capped state/local income-tax component)],
# reduced 1.3 cents per dollar of Utah taxable income (= state
# AGI here; no base deductions) over the base amount
#---------------------------------------------------------------

ded_credit_rate:
  value: 0.06
  reference: 'UC 59-10-1018(2); TC-40 line 16, "multiply line 15 by 6% (.06)", 2017-2025'
ded_credit_po_rate:
  value: 0.013
  reference: 'UC 59-10-1018(4); TC-40 line 19, "multiply line 18 by 1.3% (.013)", 2017-2025'
ded_credit_po_base:
  value: 2
  reference: 'UC 59-10-1018(4)(a): phase-out on state taxable income (TC-40 line 9), equal to the modeled state AGI (Utah has no base deductions)'
ded_credit_salt_cap:
  value:
    '2017': 999999999999
    '2018': 10000
  reference: 'UC 59-10-1018(1)(e) as enacted by HB 293 (2018): state/local income tax addback capped at $10,000; uncapped in 2017 (2017 TC-40 instr. line 14)'
ded_credit_exempt_taxpayer:
  value:
    '2017': 3038
    '2018': 0
  reference: '2017: 75% of the $4,050 federal personal exemption per exemption incl. taxpayer/spouse (UC 59-10-1018(2)(b)(i), 2017 TC-40 instr. line 11); dependents-only from 2018 (HB 2003, 2018 2nd SS)'
ded_credit_exempt_dep:
  value:
    '2017': 3038
    '2018': 565
    '2019': 579
    '2020': 590
    '2021': 1750
    '2022': 1802
    '2023': 1941
    '2024': 2046
    '2025': 2111
  reference: 'UC 59-10-1018(1)(g); TC-40 instr. line 11, 2017-2025 (2021 jump = SB 153); IRC-24-eligible dependents'
  i_measure:
    '2017': cpi
  i_base_year:
    '2017': NA
    '2026': 2025
  i_direction: 0
  i_increment: 1
ded_credit_dep_age0_extra:
  value:
    '2017': 0
    '2023': 1
  reference: 'UC 59-10-1018(1)(g) as amended by HB 54 (2023): an additional qualifying dependent in the year of a dependent''s birth; proxied by dependents age 0'
tpc_base_single:

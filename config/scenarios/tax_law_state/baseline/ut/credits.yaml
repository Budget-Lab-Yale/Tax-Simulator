#---------------------------------------------------------------
# Utah EITC (UC 59-10-1044; SB 59 2022): nonrefundable match on
# the federal EITC; 2023+ capped at W-2 wages (HB 54 2023)
#---------------------------------------------------------------

eitc_match:
  value:
    '2017': 0
    '2022': 0.15
    '2023': 0.20
  reference: 'UC 59-10-1044; SB 59 (2022) 15%; HB 54 (2023) 20%; TC-40A code AM worksheets 2022-2025'
eitc_refundable:
  value: 0
  reference: 'UC 59-10-1044(3): may not carry forward or back; nonrefundable, 2022-2025'
eitc_wage_cap:
  value:
    '2017': 0
    '2023': 1
  reference: 'UC 59-10-1044 as amended by HB 54 (2023): claimant must earn Utah W-2 income; worksheet caps the credit at box-16 wages (total wages proxy; known-difference)'

#---------------------------------------------------------------

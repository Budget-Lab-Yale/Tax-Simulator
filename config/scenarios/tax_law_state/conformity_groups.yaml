---
# Shared federal reference-law contexts for states with fixed or selective IRC
# conformity. Group 0 is rolling conformity. Positive groups are reusable
# packages, never state-name branches in the calculator.
#
# What a positive group's reference law IS (decision S44, 2026-10-13). The
# model computes one federal context per ready group and per year under
# `reference_tax_law_id`, and every state in the group reads its federal
# inputs (AGI, taxable income, itemized components, credits) from that
# context instead of from the scenario's federal law. Each fixed-conformity
# state's YAML already encodes, explicitly and per provision, every way its
# base departs from ENACTED federal law -- that is how CA cleared the
# cross-model bar under the rolling context -- so the reference law's one job
# is to hold the federal context at enacted current law: a federal REFORM in
# a counterfactual scenario must not flow into a state whose conformity date
# precedes it. All four groups therefore reference `baseline`, the enacted
# federal law. For a baseline-law run this reproduces the scenario context
# exactly (same law, same records); for a federal-reform run it isolates the
# state. The groups stay distinct because their dates differ: the day the
# federal baseline itself carries a change enacted after a group's date
# (group 1: 2015-01-01; group 2: 2025-01-01; group 3: the prior December 31,
# re-set annually; group 4: 2025-12-31 plus named extenders), that group's
# reference becomes an overlay that backs the change out, and only that
# group moves. Lagged adoption by annual conformers (group 3 picks up a
# federal change the following year if its legislature re-conforms) is not
# modeled; within the window it is indistinguishable from non-adoption.
0:
  label: rolling
  ready: true
  reference_tax_law_id:
1:
  label: fixed_2015_selective
  ready: true
  reference_tax_law_id: baseline
2:
  label: fixed_2025_selective
  ready: true
  reference_tax_law_id: baseline
3:
  label: fixed_date_annual
  ready: true
  reference_tax_law_id: baseline
4:
  label: fixed_dec_2025_plus_extenders
  ready: true
  reference_tax_law_id: baseline

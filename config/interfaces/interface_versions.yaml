---
#---------------
# Model version
#---------------

Tax-Simulator:
  type: model_data
  version: 1


#---------------------
# Dependency versions
#---------------------

# NOTE (2026-10-13): the default Tax-Data vintage predates the non-filer
# rebuild and refit; it cannot run 2021+ (ids outside the random-number id
# space, Tax-Data S25) and is not the vintage the default State-Weights was
# fit on. A state-mode row must pin dep.Tax-Data.vintage/.ID to the vintage
# its State-Weights was fit on -- 2026102315_rebuild for the default
# State-Weights below (see config/runscripts/tests/
# state_weights_baseline_rebuild.csv), 2026092720_filer_refit_v2 for rows
# that pin the dry run dryrun_B_2022_2023 (config/runscripts/tests/
# cross_model.csv); federal runscripts keep working on the default.
Tax-Data:
  type: model_data
  version: 1
  default_vintage: '2026070814'
  default_id: baseline

Macro-Projections: 
  type: model_data
  version: 3
  default_vintage: '2026022522' 
  default_id: baseline

Value-Added-Tax-Model:
  type: model_data
  version: 1
  default_vintage: '2024050121'
  default_id: baseline

Off-Model-Estimates:
  type: model_data
  version: 4
  default_vintage: '20250925'
  default_id: baseline
  
Wealth-Tax-Simulator:
  type: model_data
  version: 1
  default_vintage: '2025011312'
  default_id: baseline

Cost-Recovery-Simulator:
  type: model_data
  version: 1
  default_vintage: '202509251222'
  default_id: baseline
  
Estate-Tax-Distribution:
  type: model_data
  version: 1
  default_vintage: '2025092512'
  default_id: baseline

# The per-year state split of each record's national weight, published by
# Tax-Data's src/main_state_weights.R (Tax-Data research/state_weights/notes/
# phase4_state_weights_interface.md). Read by build_state_weights(method =
# 'interface'); only rows with `states` pin it (parse_globals drops it for
# federal-only rows, so no federal run depends on it). The default is the
# Phase 4 P6 production vintage: arm C_10_warmB_pct (the percentile arm),
# TY2017-2023 fitted, 2024-2097 carried on the TY2023 shares, fit on Tax-Data
# 2026102315_rebuild -- so a state-mode row must read that Tax-Data vintage
# (validate_state_weights_pins, src/data/state_weights.R). Bumped 2026-10-24
# from the dry run dryrun_B_2022_2023 (arm B, 2022-2023 fitted, 2024-2025
# carried, fit on 2026092720_filer_refit_v2).
State-Weights:
  type: model_data
  version: 1
  default_vintage: '2026102315_rebuild'
  default_id: baseline

# Supplemental inputs (decision S43): optional DATA columns for the state
# calculator that the pinned Tax-Data vintage does not carry -- rent paid,
# tenure, pension source, ... -- published by another model under the
# supplemental-inputs file contract (research/state_tax/
# supplemental_inputs_interface.md; consumer schema config/interfaces/
# supplemental_inputs_schema.yaml). One entry per producer, marked by
# `contract: supplemental_inputs`. Read by build_supplemental_inputs(); pinned
# only by rows whose `supplemental_inputs` runscript column names a variable
# (parse_globals blanks the pin otherwise, so no other run depends on it).
# No default vintage while the producer is provisional: a row that opts in
# must pin dep.Affordability-Index.vintage/.ID explicitly.
Affordability-Index:
  type: model_data
  version: 1
  contract: supplemental_inputs
  default_id: baseline

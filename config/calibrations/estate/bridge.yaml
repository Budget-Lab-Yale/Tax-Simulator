# Frozen estate tax measurement parameters
#
# The bridge from Tax-Data economic wealth to reported gross estate, plus the
# SOI per-bin parameters, frozen at the latest observed death year. Read by
# the estate calculator in src/calc/functions/tax/estate.R. These measure the
# data rather than stating tax law, and a reform must never override them.
# Estate tax law is in config/scenarios/tax_law/default/estate.yaml.
#
# Generated by other/estate_tax/write_frozen_params.R, not written by hand.
# Inputs: config/calibrations/estate/valuation_fit.yaml (fitted r/rho_pt,
#         written by other/estate_tax/calibrate_estate_v2.R) and
#         config/calibrations/estate/settings.yaml (the chosen inputs).
# Sources: calibration 2026-07-08 (r/rho_pt);
#          SOI death year 2022 at $12.06M exemption (f_ded/DSUE/gamma).
# Status and residuals: other/estate_tax/new_estate_modeling_thoughts.md section 10h.

r: 0.951
rho_pt: 0.612
cluster_death_weight_cap: 300
gamma: 0.091438
bins:
  size_bin:
    - under_10m
    - 10m_20m
    - 20m_50m
    - 50m_plus
  lo:
    - 0.0
    - 1.0e+07
    - 2.0e+07
    - 5.0e+07
  hi:
    - 1.0e+07
    - 2.0e+07
    - 5.0e+07
    - .inf
  f_ded:
    - 0.066176
    - 0.056617
    - 0.132937
    - 0.35565
  p_dsue:
    - 0.0
    - 0.112639
    - 0.175729
    - 0.0
  f_dsue:
    - 0.0
    - 0.166868
    - 0.164294
    - 0.0
tax_data_vintage: '2026070814'
calibration_date: '2026-07-08'
soi_death_year: 2022
soi_exemption: 12060000


# Generated file -- written by the calibrator, not by hand.
#
# The two fitted parameters of the estate measurement bridge. The optimizer that
# produces them, other/estate_tax/calibrate_estate_v2.R, writes them here, so that
# the shipped number and the run behind it cannot drift apart.
#
# Read by : other/estate_tax/write_frozen_params.R, which merges these with the SOI
#           per-bin table and the chosen inputs in settings.yaml to emit
#           config/calibrations/estate/bridge.yaml, the file the model reads. This
#           file is upstream of the model.
#
# The bridge measures the data rather than stating tax law, and a reform must never
# override it. Estate tax law is in config/scenarios/tax_law/default/estate.yaml.

_channel:
  role: state


r:
  value: 0.951
  kind: calibrated
  set: '2026-07-08'
  target: >
    Uniform valuation haircut in

      reported_gross = economic_gross * r * [1 + (rho_pt - 1) * s_pt]

    Fitted jointly with rho_pt against the SOI shape over death years 2018-2022,
    with deadbands on the post-TCJA SOI level, the JCT delta of OBBBA against
    sunset, and CBO receipts for FY2026-2028 alone. Death years 2015-2017 are held
    out and validate within about 15% on tax.
  derived_under:
    tax_data: '2026070814'
    macro_projections: '2026022522'
  invalidated_by:
    - other/estate_tax/calibrate_estate_v2.R
    - other/estate_tax/estate_module.R
  invalidated_by_hashes:
    other/estate_tax/calibrate_estate_v2.R: 233b9306143aeb8b174c4e17a7589472
    other/estate_tax/estate_module.R: 851848320ded94c864bf49e842ceadab
  conditioned_on:
    settings.estate.cluster_death_weight_cap: 300
  rederive: other/estate_tax/calibrate_estate_v2.R
  note: >
    Unchanged from the fit on Tax-Data 2026060918: the wealth and balance sheet
    columns are identical between that vintage and 2026070814, so the fit does not
    move and the 2026-07-08 run re-pinned the guard alone. Conditioned on the
    donor-clone cluster cap, which is an input to the objective rather than a result
    of it, so moving the cap means refitting. Residuals and open issues:
    other/estate_tax/new_estate_modeling_thoughts.md section 10h.

rho_pt:
  value: 0.612
  kind: calibrated
  set: '2026-07-08'
  target: >
    Additional valuation discount on the pass-through slice of the balance sheet,
    entering the expression above as [1 + (rho_pt - 1) * s_pt]. Fitted jointly with
    r, bounded below at 0.5 to keep the discount plausible.
  derived_under:
    tax_data: '2026070814'
    macro_projections: '2026022522'
  invalidated_by:
    - other/estate_tax/calibrate_estate_v2.R
    - other/estate_tax/estate_module.R
  invalidated_by_hashes:
    other/estate_tax/calibrate_estate_v2.R: 233b9306143aeb8b174c4e17a7589472
    other/estate_tax/estate_module.R: 851848320ded94c864bf49e842ceadab
  conditioned_on:
    settings.estate.cluster_death_weight_cap: 300
  rederive: other/estate_tax/calibrate_estate_v2.R
  note: >
    Closely related to the deemed realization haircut in
    config/calibrations/kg/settings.yaml and to the estate-side asset-class
    reporting factor. The three should be reconciled on a shared per-asset-class
    factor rather than carried as three separately chosen discounts.

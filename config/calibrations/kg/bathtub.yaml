# GENERATED FILE -- do not hand-edit.
#
# The capital-gains bathtub's calibrated response parameters. Written by the
# calibrator that measures them, so that a shipped number and the run that
# produced it can never drift apart the way they did before: every one of these
# values was previously hand-copied out of a log.
#
# Written by : other/kg_model_tests/form_ab/measure_efull_logs.R   (eta_logs)
#              other/top_tax/eta_dial/measure_efull_by_eta.R       (eta)
#              other/kg_model_tests/form_ab/confirm_efull_logs.R   (timeable_share_logs)
# Read by    : the behavior leg. A scenario reaches these values by binding the
#              `bathtub` piece of kg_dynamics to this file; a sweep binds a
#              different file with the same shape, which is how an eta grid gets
#              recorded in the vintage instead of vanishing with a shell
#              variable.
#
# The `conditions` block on each entry is the machine-readable statement of what
# the calibration assumed. The parse-time check compares it against what the run
# actually resolves, so a scenario that changes one of those assumptions stops
# rather than quietly using a number derived under different ones. Getting past a
# stop takes one of three visible things: re-derive and re-pin, override the value
# in an alternative, or put a dated waiver on the entry in the file that points
# here.

#
# HASH RE-PIN 2026-07-26 (second, KG_DYN_SPEC_VERSION removal): constants.R's
# hash moved because KG_DYN_SPEC_VERSION was deleted. It was a hand-maintained
# integer meant to be bumped whenever the Bellman primitives changed, and nothing
# read it -- no state file wrote it and no consumer compared it. The job it
# described is done by the invalidated_by hashes below. Dead code only. CONFIRMED
# 2026-07-26: the six-scenario gate came back byte-identical, so the re-pin stands.
#
# HASH RE-PIN 2026-07-26 (calibration switchover): the dependency hashes below
# were re-pinned after the kg source files changed in one respect only -- the
# accessor for these very values changed from economy_param('kg', ...) to
# kg_bathtub() / kg_setting(), reading the same numbers from their new home. No
# formula, threshold or magnitude moved. CONFIRMED 2026-07-26: the six-scenario
# gate came back byte-identical, including both scenarios that run the bathtub end
# to end, so the re-pin stands and none of these values needs re-deriving.

_channel:
  role: state

eta:
  value: 2.4825
  kind: calibrated
  set: '2026-07-26'
  target: >
    Constant SEMI-elasticity of realizations with respect to the gains rate.
    E_full measured at sim-year 2055 on the +5pp gains shock across the
    trial grid (2 2.3992 3), inverted through the origin for the eta that
    hits E_full = -2.5210 (= -0.6/0.238, the author-locked top-rate
    divisor). The single-pool entropy model makes E_full linear through the
    origin in eta, which is what licenses the through-origin fit here where
    the net-of-tax form needs a piecewise one. Measured E_full at each grid
    point: -2.0483 -2.4395 -3.0325. Fitted slope 1.01551.
  derived_under:
    tax_data: '2026070814'
    macro_projections: '2026022522'
  invalidated_by:
    - src/sim/kg/constants.R
    - src/sim/kg/bellman.R
    - src/sim/kg/recurrence.R
    - src/sim/kg/timing.R
    - src/sim/kg/apply.R
  invalidated_by_hashes:
    src/sim/kg/constants.R: '5022893f3ec2ec1fdb78bb1bfe3feecb'
    src/sim/kg/bellman.R: '24520852179a1d8830a8430446a245f8'
    src/sim/kg/recurrence.R: '72f808f7c5a288ba0912c29621bb604e'
    src/sim/kg/timing.R: '1350e269e70924db5b550b107821a8cf'
    src/sim/kg/apply.R: '0e0eb6d9813f994fec7c86bc453023ca'
  conditioned_on:
    settings.kg.applier_allocation: '0.5'
    settings.kg.timing_ref_wedge: 0.05
    settings.kg.timing_window: 1
  rederive: other/top_tax/eta_dial/measure_efull_by_eta.R
  active_when:
    kg.response_form: levels
  note: >
    DORMANT under the shipped configuration: response_form is 'logs' since
    2026-07-22, so the live elasticity is eta_logs and this value is read
    only by a run that flips that setting. Higher than eta_logs because the
    semi-elastic full-sim slope is flatter, so the same E_full needs a
    larger eta. Response is INCREASING in |eta|. History: 4.4984 (spec-v2
    nested) -> 2.3992 (spec-v3 single pool) -> 2.4825 (full-sim E_full
    inversion, 2026-07-12, reproduced 2026-07-26 by this script writing its
    own value for the first time). apply.R is listed as a dependency because
    the applier rule feeds the measured E_full -- an applier-rule change
    once biased every conventional kg estimate by about 37% on a 5pp
    gains-rate score before it was caught. That is the reason the dependency
    list is wider than the Bellman itself. Grid + fit:
    other/top_tax/eta_dial/eta_repin_fit.csv. The trial values are
    config/calibrations/kg/sweeps/eta_*/bathtub.yaml, and the sweep is
    launched by other/top_tax/eta_dial/launch_eta_dial_levels.sh -- which
    requires response_form flipped to 'levels' first and refuses to run
    otherwise. Measured from vintages: eta_dial_e20_v2 eta_dial_c_v2
    eta_dial_e30_v2.


timeable_share:
  value: 0.2542
  kind: calibrated
  set: '2026-07-09'
  target: >
    Short-run announcement moment: a short-run semi-elasticity of +5.04, twice the
    long-run magnitude with the sign flipped, since a future rate increase pulls
    realizations forward. Measured at the announcement year under a five point
    delayed permanent shock, and identified given eta, since the long-run moment does
    not depend on this share: the overlay nets to zero under a uniform permanent
    shock.
  derived_under:
    tax_data: '2026050315'
    macro_projections: '2026022522'
  invalidated_by:
    - src/sim/kg/constants.R
    - src/sim/kg/timing.R
    - src/sim/kg/recurrence.R
  invalidated_by_hashes:
    src/sim/kg/constants.R: 54f11bfc9f9d613373cd39e453f09168
    src/sim/kg/timing.R: cda95c0c59a0f210ae6dc1d606c3b82e
    src/sim/kg/recurrence.R: '996464e2be1f5ba854712d6463c3a785'
  conditioned_on:
    settings.kg.timing_window: 1
    settings.kg.timing_ref_wedge: 0.05
    settings.kg.applier_allocation: '0.5'
  rederive: other/kg_model_tests/calibrate.R
  active_when:
    kg.response_form: levels
  note: >
    Live only when response_form is 'levels'. Derived under Tax-Data 2026050315,
    an earlier vintage than the 2026070814 the rest of the capital gains calibration
    uses. The code asserts that the timing overlay is robust to the Tax-Data
    vintage, which is why this does not read as stale; that assertion has not been
    re-tested. other/kg_model_tests/calibrate.R is a drift diagnostic and no longer
    ships values, so re-deriving this share means running the short-run leg by
    hand.

timeable_share_logs:
  value: 0.2452
  kind: calibrated
  set: '2026-07-27'
  target: >
    Short-run announcement moment: a short-run semi-elasticity of +5.04, twice the
    long-run magnitude with the sign flipped, since a future rate increase pulls
    realizations forward. Measured in 2026 under a two point permanent shock whose
    rate rises in 2027. Law is unchanged in 2026, so movement that year is retiming
    alone, which separates the overlay from the elasticity. Identified given
    eta: the long-run moment does not depend on this share, and that was checked
    across the grid rather than assumed, coming out at -2.6677 -2.6792 -2.6934. The
    grid 0.15 0.2542 0.4 gave short-run elasticities of +2.6877 +5.2636 +8.8133, and
    the pin interpolates piecewise-linearly onto the target after checking the grid
    is monotone.
  derived_under:
    tax_data: '2026070814'
    macro_projections: '2026022522'
  invalidated_by:
    - src/sim/kg/constants.R
    - src/sim/kg/timing.R
    - src/sim/kg/recurrence.R
  invalidated_by_hashes:
    src/sim/kg/constants.R: '54f11bfc9f9d613373cd39e453f09168'
    src/sim/kg/timing.R: 'cda95c0c59a0f210ae6dc1d606c3b82e'
    src/sim/kg/recurrence.R: '996464e2be1f5ba854712d6463c3a785'
  conditioned_on:
    settings.kg.timing_window: 1
    settings.kg.timing_ref_wedge: 0.05
    settings.kg.applier_allocation: '0.5'
  rederive: other/kg_model_tests/form_ab/measure_timeable.R
  active_when:
    kg.response_form: logs
  note: >
    Live under the shipped configuration, which sets response_form to 'logs'.
    measure_timeable.R derives it. The earlier solver in
    other/kg_model_tests/calibrate.R found eta and this share together in a
    standalone Bellman, and was demoted to a drift diagnostic when eta moved onto
    the full simulator; the instability that demoted it is why measure_timeable.R
    checks the grid is monotone before inverting. Measured from vintages
    form_timeable_logs_15 form_timeable_logs_25.
    form_timeable_logs_40. Per-point measurements:
    other/kg_model_tests/form_ab/timeable_logs.csv.


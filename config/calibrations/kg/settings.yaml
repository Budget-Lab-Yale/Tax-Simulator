# Hand-edited. The one file in config/calibrations/ no calibrator writes.
#
# The capital gains machinery's model-form switches and judgment calls: the choices
# that are made rather than measured.
#
# They are part of what the calibrations assumed. The bathtub entries record the
# settings they were calibrated under and the parse-time check compares that record
# against this file, so changing one here stops every capital gains run until the
# affected value is re-derived or its entry carries a dated waiver.

_channel:
  role: state


response_form:
  value: logs
  kind: structural
  note: >
    Which cost primitive the scenario-side first-order condition extrapolates away
    from the calibrated local moment with. 'logs', the default, is a constant
    net-of-tax elasticity, the specification Agersnap and Zidar prefer and the
    better-motivated prior for a revenue-maximizing rate; it lowers the
    revenue-maximizing rate under step-up relative to 'levels', a constant
    semi-elasticity. The two cross at the baseline point by construction, so the
    baseline pass does not depend on the form, but vintages are not comparable
    across forms.

applier_allocation:
  value: '0.5'
  kind: structural
  note: >
    How the lock-in and carryover stock realization is distributed across records
    within a cell: 'R' in proportion to positive realized gains, which targets active
    realizers, 'G' in proportion to the gain stock, which targets holders, or a blend
    between 0 and 1. The default is a blend because a realized carryover dollar needs
    a holder who sells, so neither proxy alone is right. Mechanical carryover revenue
    is monotone in it and deemed revenue does not depend on it. The eta and
    timeable_share calibrations are conditioned on 0.5, so changing it requires
    re-pinning both.

dg_allocation:
  value: G
  kind: structural
  note: >
    How the policy-induced change in the gain stock is allocated within a cell,
    which sets the effective cell mortality in the death and survivor channels. 'G'
    weights it by gains, the inheritance-flow account; 'R' is the lock-in account. It
    stays on 'G' whatever applier_allocation is, since whose dollars die follows
    holdings while whose dollars are sold is the applier's question. It affects
    carryover and deemed realization only, not step-up.

timing_window:
  value: 1
  kind: structural
  note: >
    Half-width in years over which timeable realizations may retime. Part of the
    conditioning set for the timeable-share calibration.

timing_ref_wedge:
  value: 0.05
  kind: structural
  note: >
    Reference wedge for the timing overlay. The fraction of planned dollars moving
    toward the best year in the window is

      clamp(rate change / ref_wedge, 0, 1)

    so five points move the whole bucket and one point moves a fifth of it. Part of
    the conditioning set for both calibrations.

wealth_carry_scale:
  value: 1
  kind: structural
  note: >
    Multiplier on the wealth tax carrying cost of deferral before it enters the
    Bellman, the equivalent rate, the guard slack and the state file. It is an
    uncalibrated sensitivity dial rather than a measured magnitude.

beta_fallback:
  value: 0.978
  kind: structural
  note: >
    Fallback annual discount factor, read only when no year-varying series is
    supplied, as in an isolated solver unit test. kg_dyn_load_beta_series builds the
    series a simulation uses from the ten-year Treasury rate deflated by that year's
    CPI-U growth.

#-------------------------------------------------------------------------------
# Judgment -- chosen, with no recorded derivation
#-------------------------------------------------------------------------------

deemed_avoidance:
  value: 0.25
  kind: judgment
  note: >
    Valuation and noncompliance haircut on deemed realization at death, applied in
    the applier alone: the per-record deemed amount is scaled by one less this.
    Chosen for consistency with the estate-side pass-through valuation discount of
    about 0.65 and with the discounts JCT and Treasury assume, though no derivation
    is recorded. This is the same object as the estate tax asset-class reporting
    factor, and the two should be reconciled on a shared per-asset-class factor.

char_extensive_intercept:
  value: -2.415
  kind: judgment
  note: >
    Logit intercept for the probability that a decedent makes any charitable
    bequest, on log gross estate in millions of char_base_year dollars. No source is
    recorded anywhere in the repository. The four charitable coefficients look like a
    fitted two-equation logit, most likely on SOI estate data, but neither the fit
    nor the data is documented.

char_extensive_ln_slope:
  value: 0.458
  kind: judgment
  note: Log-estate slope of the extensive charitable bequest logit. No source recorded; see char_extensive_intercept.

char_intensive_intercept:
  value: -1.872
  kind: judgment
  note: Logit intercept for the charitable share conditional on giving. No source recorded; see char_extensive_intercept.

char_intensive_ln_slope:
  value: 0.468
  kind: judgment
  note: Log-estate slope of the intensive charitable bequest logit. No source recorded; see char_extensive_intercept.

char_base_year:
  value: 2026
  kind: structural
  note: >
    CPI-U base year the gross estate is deflated to before entering the charitable
    logits. It must match the year the coefficients were fitted in, which cannot be
    verified while that fit is undocumented.

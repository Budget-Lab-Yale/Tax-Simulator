timeable_share_logs:
  value: 0.2452
  kind: calibrated
  set: '2026-07-27'
  target: >
    Short-run announcement moment: a short-run semi-elasticity of +5.04, twice the
    long-run magnitude with the sign flipped, since a future rate increase pulls
    realizations forward. Measured in 2026 under a two point permanent shock whose
    rate rises in 2027. Law is unchanged in 2026, so movement that year is retiming
    alone, which separates the overlay from the elasticity. Identified given
    eta: the long-run moment does not depend on this share, and that was checked
    across the grid rather than assumed, coming out at -2.6677 -2.6792 -2.6934. The
    grid 0.15 0.2542 0.4 gave short-run elasticities of +2.6877 +5.2636 +8.8133, and
    the pin interpolates piecewise-linearly onto the target after checking the grid
    is monotone.
  derived_under:
    tax_data: '2026070814'
    macro_projections: '2026022522'
  invalidated_by:
    - src/sim/kg/constants.R
    - src/sim/kg/timing.R
    - src/sim/kg/recurrence.R
  invalidated_by_hashes:
    src/sim/kg/constants.R: '54f11bfc9f9d613373cd39e453f09168'
    src/sim/kg/timing.R: 'cda95c0c59a0f210ae6dc1d606c3b82e'
    src/sim/kg/recurrence.R: '95e893be21eeb0778a06ecb0333238d6'
  conditioned_on:

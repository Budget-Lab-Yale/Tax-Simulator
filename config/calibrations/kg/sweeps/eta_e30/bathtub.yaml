timeable_share:
  value: 0.2542
  kind: calibrated
  set: '2026-07-09'
  target: >
    Short-run announcement moment: a short-run semi-elasticity of +5.04, twice the
    long-run magnitude with the sign flipped, since a future rate increase pulls
    realizations forward. Measured at the announcement year under a five point
    delayed permanent shock, and identified given eta, since the long-run moment does
    not depend on this share: the overlay nets to zero under a uniform permanent
    shock.
  derived_under:
    tax_data: '2026050315'
    macro_projections: '2026022522'
  invalidated_by:

_channel:
  role: state

eta:
  value: 2.4825
  kind: calibrated
  set: '2026-07-26'
  target: >
    Constant semi-elasticity of realizations with respect to the gains rate. The
    full-simulation elasticity was measured at 2055 under a five point gains shock
    across the grid (2 2.3992 3) and inverted through the origin for the eta hitting
    -2.5210, which is -0.6 over the 0.238 top-rate divisor. The single-pool entropy
    model makes that elasticity linear in eta through the origin, so it is fitted
    through the origin here where the net-of-tax form needs a piecewise fit. Measured at each grid point: -2.0483 -2.4395 -3.0325. Fitted
    slope 1.01551.
  derived_under:
    tax_data: '2026070814'
    macro_projections: '2026022522'
  invalidated_by:
    - src/sim/kg/constants.R
    - src/sim/kg/bellman.R
    - src/sim/kg/recurrence.R
    - src/sim/kg/timing.R
    - src/sim/kg/apply.R
  invalidated_by_hashes:
    src/sim/kg/constants.R: '54f11bfc9f9d613373cd39e453f09168'
    src/sim/kg/bellman.R: '1aa6776c70f4d508eec34de176318dd7'
    src/sim/kg/recurrence.R: '95e893be21eeb0778a06ecb0333238d6'
    src/sim/kg/timing.R: 'cda95c0c59a0f210ae6dc1d606c3b82e'
    src/sim/kg/apply.R: '11fe1873b7c431b74f8c02bb3b5fe272'
  conditioned_on:
    settings.kg.applier_allocation: '0.5'
    settings.kg.timing_ref_wedge: 0.05
    settings.kg.timing_window: 1
  rederive: other/top_tax/eta_dial/measure_efull_by_eta.R
  active_when:
    kg.response_form: levels
  note: >
    Dormant under the shipped configuration, which sets response_form to 'logs', so
    only a run that flips that setting reads this. It is higher than eta_logs because
    the semi-elastic slope is flatter and so needs a larger eta to hit the same
    full-simulation elasticity. The response increases in the magnitude of eta.

    apply.R is a dependency because the applier rule feeds the measured elasticity:
    a change to that rule once biased every conventional gains estimate by 37% on a
    five point rate score, so the dependency list runs wider than the Bellman.

    Grid and fit: other/top_tax/eta_dial/eta_repin_fit.csv. The trial values are
    config/calibrations/kg/sweeps/eta_*/bathtub.yaml, and
    other/top_tax/eta_dial/launch_eta_dial_levels.sh launches the sweep, refusing to
    run until response_form is flipped to 'levels'. Measured from vintages
    eta_dial_e20_v2 eta_dial_c_v2 eta_dial_e30_v2.


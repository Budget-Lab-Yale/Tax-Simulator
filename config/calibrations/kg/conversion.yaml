# Generated file -- written by the calibrator, not by hand.
#
# The income-conversion response: how much top salary and active pass-through
# compensation is repackaged as unrealized equity appreciation when the wedge
# between ordinary and equity rates widens. The converted dollars land in the
# bathtub's gain state, which is why this is a piece of kg_dynamics rather than a
# response of its own.
#
# Written by : the sigma pipeline -- two legs of a five point top rate increase,
#              the top elasticity measurement, and the interpolation onto the
#              target -- other/top_tax/tests/compute_top_eti.R
# Read by    : the behavior leg, through the `conversion` piece of kg_dynamics.
#
# This file ships with a waiver because sigma is a residual. Entity shifting and
# evasion supply about 0.22 of the 0.25 top-income elasticity target on their own,
# so sigma is whatever closes the gap, which makes it conditional on the rest of
# the stack in a way a directly estimated parameter would not be. It was also
# derived with a charitable elasticity of -1.0 where production runs use -0.5.
# Until it is re-derived, capital gains runs print a waiver banner.

_channel:
  role: state

conv:
  value: 0.2002
  kind: calibrated
  set: '2026-07-26'
  target: >
    An elasticity of taxable income of 0.25 for the top subset, the central
    Saez, Slemrod and Giertz estimate, on taxable income after deductions and
    excluding net capital gains, holding top-bracket membership at baseline.
    Measured over 2025:2035 on a five point increase in the top ordinary rate with
    the whole behavior stack running. sigma is the residual conversion margin: at
    zero, entity shifting and evasion alone produce an elasticity of 0.1820, and
    sigma closes the gap. The grid 0 0.16 0.3 gave 0.1820 0.2363 0.2840, and the pin
    interpolates piecewise-linearly onto the target without forcing the origin,
    since the intercept is the point.
  derived_under:
    tax_data: '2026070814'
    macro_projections: '2026022522'
  invalidated_by:
    - src/behavior/entity_shifting/pearce_prisinzano.R
    - src/behavior/evasion/debacker.R
    - src/behavior/charity/50.R
    - src/sim/sigma_conversion.R
  invalidated_by_hashes:
    src/behavior/entity_shifting/pearce_prisinzano.R: 417bd83d700004da61178cf1fbeb21d4
    src/behavior/evasion/debacker.R: '30fcf7b063f9aeeb487402a862ba8334'
    src/behavior/charity/50.R: dede5ce971690cdc05465114730ec080
    src/sim/sigma_conversion.R: 'd9b9a24106fbcb5c271a02883cb31dc1'
  rederive: other/top_tax/sigma_calib/measure_sigma.R
  note: >
    Derived under src/behavior/charity/50.R, the charitable elasticity of -0.5 that
    production runs use. Method and measured legs:
    other/top_tax/sigma_explainer.md. This is the re-derivation the waiver on this
    entry was waiting for, so the waiver should be removed rather than re-dated.

    The capital gains Bellman calibration is orthogonal to this one, on a disjoint
    base, since ordinary income excludes realizations, unless the pool ever starts
    taxing gains. Measured from vintages sigma_calib_50_conv_00
    sigma_calib_50_conv_16 sigma_calib_50_conv_30, with per-year elasticities in
    other/top_tax/sigma_calib/sigma_eti_charity50.csv.

pt_labor_share:
  value: 0.75
  kind: sourced
  citation: >
    Labor-content share of active pass-through income (Smith, Yagan, Zidar and
    Zwick), applied to the active pass-through legs of the conversion pool.

# The entity-shifting response's parameters.
#
# `sourced` rather than calibrated: these come from a published paper, not from a
# procedure this model runs, so there is nothing to re-derive and nothing that can
# go stale. They are in the calibrations tree because the module reads them from
# here, bound as the `entity_shifting` piece of kg_dynamics -- which is what makes
# them visible in the run manifest alongside the values that DO get calibrated.
#
# Read by : src/behavior/entity_shifting/pearce_prisinzano.R

_channel:
  role: state

semi_elasticity_raw:
  value: 0.3788
  kind: sourced
  citation: >
    Pearce and Prisinzano (2018), Table IV.B preferred results: the semi-
    elasticity of the pass-through share of business income with respect to the
    corporate-versus-pass-through tax differential.

pt_share_of_business_income:
  value: 0.6
  kind: sourced
  citation: >
    Pass-through's share of business income, the point at which the
    Pearce-Prisinzano semi-elasticity is evaluated. The module uses the ratio
    semi_elasticity_raw / pt_share_of_business_income, so the shipped elasticity
    is 0.3788 / 0.6.

current_payout_share:
  value: 0.45
  kind: judgment
  note: >
    Share of corporate earnings assumed paid out currently rather than retained.
    The current-payout leg's tax is proxied by the long-term gains MTR -- the
    historical module's dividends-equal-gains simplification, carried forward.
    The retained share is priced properly, by the bathtub's expected present-value
    tax per dollar newly entering the unrealized-gain state, whenever the bathtub
    is running.

beta_legacy:
  value: 0.25
  kind: judgment
  note: >
    The retained-earnings deferral proxy: 25 percent of the statutory rate. This
    is the OLD pricing, superseded by the bathtub's tau_eq. It survives for two
    cases where tau_eq does not exist or is deliberately not used -- an
    entity-only scenario with no bathtub, and the explicit legacy comparison
    module (pearce_prisinzano_legacy.R) that exists to measure what the tau_eq
    change did.

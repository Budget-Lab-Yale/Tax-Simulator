# Wealth bathtub -- operational parameters for the saving-financing channel.
#
# This file holds the TUNABLE knobs of the mechanical wealth-accumulation
# channel (src/sim/wealth_dynamics.R). It is NOT a reform tax-law file and must
# never be overridden by a scenario. NEITHER the saving share `s` NOR the
# transition operator `M` lives here: they are a per-scenario FINANCING PROFILE
# -- a folder of two files (s.csv, M.csv) under config/wealth/profiles/<name>/,
# selected by the runscript `wealth_financing` column (or the scalar `s`
# shorthand). See wealth_dyn_resolve_profile() in src/sim/wealth_dynamics.R.
#
# Provenance: the staleness stamp (spec_version, pinned macro_vintage) lives in
# code as WEALTH_DYN_PROVENANCE (src/sim/wealth_dynamics.R), mirroring kg's
# KG_DYN_CALIB_PROVENANCE; wealth_dyn_check_provenance() compares the live
# Macro-Projections vintage and these params against that stamp.

# ----------------------------------------------------------------------------
# Cells
# ----------------------------------------------------------------------------
# Number of equal-weighted-headcount within-age net-worth percentile bins.
n_pctiles: 100

# ----------------------------------------------------------------------------
# Applier
# ----------------------------------------------------------------------------
# Symmetric per-record gross-asset shrink clamp |f| <= fmax. The clamp lets cuts
# (negative deficit) scale wealth UP and hikes scale it DOWN; ~1% of wealth in
# normal operation, so it rarely binds, but CAN bind for low-net-worth
# high-income payers. A clamp-bind frequency / max|f| diagnostic is reported by
# the one-time long-horizon check.
fmax: 0.9

# ----------------------------------------------------------------------------
# Kernel growth path r_total(t)
# ----------------------------------------------------------------------------
# Central r_total(t) = nominal GDP-per-capita growth, read PER YEAR from
# Macro-Projections projections.csv (gdp_c column), NOT a flat peak. NOMINAL to
# match the nominal stock and flows. additive_delta shifts the whole path
# additively for a ONE-TIME external sensitivity test; default 0 leaves
# production runs untouched (no standing multi-run sweep).
r_total:
  source: macro_gdp_per_capita   # nominal GDP/capita growth = (gdp growth)/(pop growth);
                                 # pop = sum of unmarried_*/married_* cols in projections.csv
  additive_delta: 0.0            # one-time sensitivity shift (pp, as a decimal); default 0

# ----------------------------------------------------------------------------
# Transition operator M and saving share s
# ----------------------------------------------------------------------------
# BOTH moved to the per-scenario financing PROFILE (config/wealth/profiles/<name>/):
#   - s.csv : the bracket-varying saving share s(age, net-worth percentile)
#   - M.csv : the within-age percentile transition (identity = full persistence,
#             the realistic near-truth; uniform 1/n is the extreme-diffusion
#             bound). Absent M file => identity.
# The 'default' profile is auto-applied to any scenario that names no profile and
# sets no scalar `s`. Bracket-varying s and a per-age M are no longer dormant
# hooks -- they are realized by the profile files. (Direction-split s for
# hike-vs-cut asymmetry remains a future extension: the linear recurrence
# enforces symmetry, so it would need a direction-conditional inflow, not just a
# per-cell magnitude.)
